Cavalcade of the T enth Plague W ar Prophet can take a Day of his W rath ACTION. If they do so, take a Risky Success Roll for the model. If the roll is a Failure the W ar Prophet’s Activation ends immediately. If the roll is a Success, make an Injury Roll with the IGNORE ARMOUR Keyword for 1 enemy model within 3” of the W ar Prophet. If the roll is a Critical Success, make an Injury Roll with +1 INJURY DICE and the IGNORE ARMOUR Keyword for 1 enemy model within 3” of the W ar Prophet.","Mastery of the Elements":"Mastery of the Elements: When this model is deployed for the first time in a game, you can give one of the following Keywords to all of the Jabirean Alchemist’s Ranged Weapons and Melee","Elemental Change ACTION":"Elemental Change ACTION: A Jabirean Alchemist can take an Elemental Change ACTION. If they do so, take a Risky Success Roll for the model. If the roll is a Failure, nothing happens and the Jabirean Alchemist’s Activation ends. If the roll is a Success or a Critical Success, you can change the Master of the Elements Keyword on all of the Jabirean Alchemist’s Weapons to one of the other two choices. Keywords SUL TANATE, ELITE MF","Artillery Witch Battery":"Artillery Witch Battery: You may include 0-2 Artillery Witches in a Warband if the total cost of all of the other models in the Warband (including their Battlekit, etc) adds up to 1,000 👑 o r more.","Battlefield Vivisection":"Battlefield Vivisection: Whenever a Combat Biologist is part of your Warband, add the Gather Knowledge Glorious Deed to those normally available in each scenario you play. Gather Knowledge: You complete this Glorious Deed if 3 or more enemy models are taken Out of Action while they are within 1” of a friendly Combat Biologist.","Divine Judgement ACTION":"Divine Judgement ACTION: A Witchburner can take a Divine Judgement ACTION. If they do so, take a Risky Success Roll for the Witchburner. If the roll is a Failure, the Witchburner’s Activation ends. If the roll is a Success or a Critical Success, pick 1 enemy model within 24” of the Witchburner (no Line of Sight is required) and place 1 BLOOD MARKER next to them. If the enemy model has the BLACK GRAIL, DEMONIC, or HERETIC Keyword, place 2 BLOOD MARKERS next to it instead of 1. Keywords ELITE, NEGATE FEAR Gavel of Justice The staff of a Witchburner is both a mark of their office and a weapon imbued with the wrath of God against those who have broken divine law. It dooms the souls of those found guilty to burn in flames for all eternity. Type Range Keywords 1-Handed Melee CRITICAL Found Guilty: After making the Injury Roll for a Gavel of Justice, place 1 extra BLOOD MARKER next to the target model (even if the Injury Roll has No Effect). If the target has the BLACK GRAIL, DEMONIC, or HERETIC Keyword, place 2 BLOOD MARKERS next to it instead of 1. Mercenary Special Rules Starting a Warband New Antioch Trench Pilgrims Iron Sultanate Heretic Legions Black Grail The Court Keywords Mercenaries","Hegemon's Last Blessing":"Hegemon’s Last Blessing: Putrid Shotguns in this Warband have a Limit of 3, and Viscera Cannon have a Limit of 3 and do not have the ELITE only stipulation.","Hold Your Fire! ACTION":"Hold Your Fire! ACTION: The Lieutenant orders their warband to stop shooting, forcing the enemy to move first. T o represent this, a Lieutenant can take a Hold Your Fire! ACTION. If they do so, pick 1 enemy model that is in the Lieutenant’s Line of Sight and that the opponent is allowed to Activate. The Lieutenant’s Activation then ends, and the opponent must Activate the model you picked. Keywords NEW ANTIOCH, ELITE, LEADER, TOUGH","God is With Us! ACTION":"God is With Us! ACTION: A Trench Cleric can take a God is With Us! ACTION. If they do so, take a Risky Success Roll for the Trench Cleric. If the roll is a Failure, nothing happens, and the Trench Cleric’s Activation ends. If the roll is a Success or a Critical Success, you can place 1 BLESSING MARKER next to the Trench Cleric or a friendly model within 6” of the Trench Cleric.","Battlefield Demolition":"Battlefield Demolition: You can ignore the Effect of the HEAVY Keyword for 1 Satchel Charge that a Combat Engineer has. A Combat Engineer still cannot have more than 1 Weapon (of any type) with the HEAVY Keyword.","Masters of the Grenade":"Masters of the Grenade: Add 4” to the Range of all Grenades used by models from a Stosstruppen of the Free State of Prussia Warband.","Away Serpents! ACTION":"Away Serpents! ACTION: An Éire Rangers Trench Cleric can take an Away Serpents! ACTION. If they do so, pick 1 enemy model within 12” of the Trench Cleric and say that the Trench Cleric orders them to crawl on their belly like a snake. Then take a Risky Success Roll for the Trench Cleric. Add -1 DICE to the roll if the enemy model is mounted on a base that is 40mm or greater. If the roll is a Failure, nothing happens, and the Trench Cleric’s Activation ends. If the roll is a Success or Critical Success, the enemy model is taken Down.","The Communicant Cross":"The Communicant Cross: A sacred cross is nailed on the face of the Communicant. A Communicant counts as having the following pieces of Equipment at no cost in 👑 : Iron Capirote (Headgear); Gas Mask. It cannot be removed or lost for any reason. Keywords PILGRIM, ELITE, REGENERATE 1, STRONG, TOUGH MF","Symphony of Slaughter":"Symphony of Slaughter: An Anchorite Shrine is armed with two 1-Handed Melee Weapons (the Catherine Wheel and Bonebreaker Mace). When it makes a Melee Attack, it can either attack once using either its Catherine Wheel or the Bonebreaker Mace, or twice, first with the Catherine Wheel and second with its Bonebreaker Mace (the Off- Hand Weapon modifier applies to the attack made with the Bonebreaker Mace). Keywords PILGRIM, FEAR, NEGATE SHRAPNEL, STRONG, TOUGH","Price of Greed ACTION":"Price of Greed ACTION: W orldly wealth becomes the target of this curse, gradually crushing its victim under its weight. A Knights of Avarice Heretic","Six-armed Monstrosity":"Six-armed Monstrosity: An Amalgam can take 1 Shoot ACTION per Activation with each Ranged Weapon it is equipped with, and can take 1 Fight ACTION per Activation with each Melee Weapon it is equipped with. The Off-Hand Weapon modifier does not apply to any of its Melee Attacks.","Celtic Machine Armour":"Celtic Machine Armour: Models in a Kingdom of Alba Assault Detachment Warband with Machine Armour have a Charge Bonus of D6” (it is not reduced to D3” by Machine Armour).","Specialised Equipment":"Specialised Equipment: Submachine Guns in a Stosstruppen of the Free State of Prussia Warband have a Limit of 4, and Automatic Pistols do not have the ELITE only stipulation. However, Machine Guns in a Stosstruppen of the Free State of Prussia Warband have a Limit of 1, and models cannot have Grenade Launchers or Martyrdom Pills.","Close Assault Weapons":"Close Assault Weapons: Submachine Guns cost 25 👑 fo r a Heretic Naval Raiders Warband.","Let Sleeping Dogs Lie":"Let Sleeping Dogs Lie: This Warband cannot include a W ar W olf.","Blessed Psalm ACTION":"Blessed Psalm ACTION: A Holy W arrior can take a Blessed Psalm ACTION. If they do so, you can remove 1 BLESSED MARKER from the Holy W arrior and place it beside a friendly model. A Success Roll is not required to carry out this Action.","Puppet Master ACTION":"Puppet Master ACTION: A Heretic Priest can take a Puppet Master ACTION. If they do so, take a Risky Success Roll for the model. If the roll is a Failure, the Heretic Priest’s Activation ends immediately. If the roll is a Success or Critical Success, pick 1 model (friend or foe) that is within 12” of the Heretic Priest and in their Line of Sight, apart from the Heretic Priest themselves. You can move the model D6” . The move must be in a straight line, but can be in any direction, and can be used to make the model move within 1” of an enemy, make a retreat move, Climb, Jump, or Jump Down. The model cannot make a Diving Charge and does not count as charging if it finishes the move within 1” of an enemy model. Keywords HERETIC, ELITE, LEADER, TOUGH MF","Heretic Legionnaires":"Heretic Legionnaires: You can upgrade Heretic T roopers in your Warband to Heretic Legionnaires, at a cost of +10 👑 each . Y oucannot upgrade a Heretic T rooper if doing so would result in there being more Heretic Legionnaires in your Warband than there are Heretic T roopers. When you upgrade a Heretic T rooper to a Heretic Legionnaire, you can change either their Ranged Characteristic or their Melee Characteristic from 0 to +1. Keywords HERETIC MF","Hammer and the Anvil":"Hammer and the Anvil: Anti-T ank Hammers taken for a Procession of the Sacred Affliction Warband do not have the ELITE only stipulation.","Punishing Millstones":"Punishing Millstones: Add +1 INJURY DICE for Melee Attacks made by models from a Procession of the Sacred Affliction if the target is Down. This special rule does not apply to attacks made by Ecclesiastic Prisoners.","Art of Assassination":"Art of Assassination: Each Sultanate Assassin and Master Assassin in a Fida’i of Alamut Warband can have one of the following abilities at the additional cost in 👑 indicate d below. Y oucannot give the same ability to more than one model (i.e. every Assassin that has an ability must have a different one).","Loudspeakers ACTION":"Loudspeakers ACTION: A W ar Prophet can take a Loudspeakers ACTION. If they do so, take a Risky Success Roll for the model and add +2 DICE to the roll. If the roll is a Failure, the W ar Prophet’s Activation ends immediately. If the roll is a Success or Critical Success, you can move all friendly models within 8” of the W ar Prophet up to 3” . They must end the move as close as possible to the nearest enemy model that was visible to them at the start of the move. This move can be used to bring a model within 1” of an enemy model in which case the model counts as charging. If no enemy models are visible, they can move normally.","Broken on the Wheel":"Broken on the Wheel: At the start of each game, before deployment, you can say that one Trench Pilgrim or Ecclesiastic Prisoner will be broken on the wheel to show their piety and devotion. The model you choose is permanently removed from your Warband, but in a campaign you can redistribute their Battlekit to other models that would be allowed to have it in the following Quartermaster Step. Injuries that would be inflicted on the Anchorite Shrine are instead inflicted on its unfortunate victim, until the victim finally passes away. This is represented by the following special rules, which apply to the Anchorite Shrine until it suffers an Out of Action result on the Injury Table: It has an Armour Characteristic of 0 and does not have the NEGATE SHRAPNEL and TOUGH Keywords. It treats Down results as Minor Hit results. The first time the Anchorite Shrine suffers an Out of Action result on the Injury Table, it is treated as a No Effect result. When this happens, any BLOOD MARKERS on the Anchorite Shrine are removed, and from then on, these special rules no longer apply to the model, it has an Armour Characteristic of -3, and gains the NEGATE SHRAPNEL and TOUGH Keywords (the TOUGH Keyword will apply the next time the Anchorite Shrine suffers an Out of Action result on the Injury Table).","Plague Knight Ranks":"Plague Knight Ranks: (▶ see Plague Knight Ranks) Keywords BLACK GRAIL, ELITE, FEAR, NEGATE GAS, STRONG","Voice of God ACTION":"Voice of God ACTION: An Observer can take a V oice of God ACTION. If they do so, take a Risky Success Roll for the Observer. If the roll is a Failure, the Observer’s Activation ends. If the roll is a Success or Critical Success, pick 1 model (friend or foe), anywhere on the battlefield, that has not been Activated this Turn. The Observer’s Activation then ends, and the other model’s Activation immediately begins. Keywords None Mercenary Special Rules Starting a Warband New Antioch Trench Pilgrims Iron Sultanate Heretic Legions Black Grail The Court Keywords Mercenaries Mercenaries -Trench Crusade 182 0-1 Scripture Guardian - Cost: 7 ☼ A Scripture Guardian is a Mercenary that can be recruited by any Warband. The Scripture Guardian has the same alignment as the Warband they are recruited into. The origins of the Scripture Guardians remain shrouded in mystery, though rumours suggest they were created by the great masters of Kabbalah. Accounts of their existence began circulating in the early days of the Great War as the destruction of Jerusalem unearthed tombs and sacred resting places. Those who had once been interned in peace now wander the unhappy land, endlessly reciting the sacred writings entrusted to them in death. On rare occasions, expeditions into No Man’s Land have encountered such creatures, and by placing a holy text of their faith into its hands, they have transformed the Scripture Guardian into a powerful ally, bound to the will of those who align with the holy (or desecrated) scroll or tome it holds. Capable of speaking and reading the One True Language, the Scripture Guardian can unleash the powers it calls upon against anyone its master commands. It carries out its purpose with the single-mindedness of an automaton, devoid of thought or empathy. When spoken by the Guardian, the words are imbued with the primordial power of Creation, and capable of unmaking anything in their path. The longer the Guardian concentrates on its target, the greater the power it channels. Movement Ranged Melee Armour Base 6”/Infantry - +1 DICE -2 40mm Battlekit A Scripture Guardian always has Reinforced Armour and a Combat Helmet. In addition, it must have either two 1-Handed Melee Weapons or one 2-Handed Melee Weapon. You must purchase the Melee Weapons from your Faction Armoury Tables at their normal Cost, and you must obey any stipulation that apply to the weapons you choose (e.g. ELITE Only, Limit: 1 etc). The weapons you choose cannot be removed or lost over the course of the campaign for any reason. Abilities","Anointed Ammunition":"Anointed Ammunition: Models in an Eire Ranger Warband can have Armour- Piercing Bullets (▶ see Battlekit in the Trench Crusade Digital Rulebook) at a cost of 5 👑 each . TheArmour-Piercing Bullets have the Limit: 2 stipulation.","Stolen Communicants":"Stolen Communicants: Communicants cost 3 ☼ to recruit for a Cavalcade of the T enth Plague Warband (they do not cost any 👑 ).","Siege Jezzail Teams":"Siege Jezzail T eams: The Defenders of the Iron W all are trained to use Siege Jezzails in pairs. Add +1 DICE to the Success Roll for a Ranged Attack made with a Siege Jezzail if there is a friendly model within 1” of the model making the attack.","Barbed Wire Banshee":"Barbed Wire Banshee: A Trench Ghost Warband can include a Barbed Wire Banshee instead of a Chorister. The Barbed Wire Banshee has the same Profile and Cost as a Chorister, but instead of the Unholy Hymns Ability add +1 INJURY DICE to rolls for enemy models that are within 8” of a Barbed Wire Banshee.","Automaton Destrier":"Automaton Destrier: If the scenario you are playing allows Infiltrators to use their special deployment rules, after any Infiltrators have deployed, you can deploy the Mamluk Faris within 1” of any edge of the battlefield and more than 8” away from any enemy models.","Overwhelming Horde":"Overwhelming Horde: A Grail Thrall or Fly Thrall can make a Melee Attack even though it does not have a Melee Weapon. In addition, add +1 DICE to the Success Roll for a Melee Attack made by a Grail Thrall or Fly Thrall for each other friendly model within 3” of the attacking model (not including the attacking model itself ).","Infected Proboscis":"Infected Proboscis: A Herald of Beelzebub can make a Melee Attack with the INFECTION MARKERS Keyword even though it does not have a Melee Weapon. If a Melee Attack made by a Herald of Beelzebub causes any INFECTION MARKERS to be placed on the target model, you can remove up to 1 BLOOD MARKER from the attacking Herald of Beelzebub.","Goetic Gaze ACTION":"Goetic Gaze ACTION: A Goetic W arlock can take a Goetic Gaze ACTION. If they do so, take a Success Roll for the Goetic W arlock. If the roll is a Failure, nothing happens. If the roll is a Success, place 1 BLOOD MARKER next to an enemy model within 24” of the Goetic W arlock and in their Line of Sight. If the roll is a Critical Success, place 2 BLOOD MARKERS next to an enemy model within 24” of the Goetic W arlock and in their Line of Sight instead of only 1. Mercenary Special Rules Starting a Warband New Antioch Trench Pilgrims Iron Sultanate Heretic Legions Black Grail The Court Keywords Mercenaries Mercenaries -Trench Crusade 177 Abilities","Faithful Followers":"Faithful Followers: When you Activate a model within 1” of a Mendelist Ammo Monk, you can also Activate the Mendelist Monk if they have not yet been Activated during the Turn. If you do so, the two models can take their ACTIONS in any order you wish, and you can switch between the two models freely. If the Activation of either model ends (due to a failed Risky Success Roll, for example), the other model can carry on with its Activation normally. Keywords None Mercenary Special Rules Starting a Warband New Antioch Trench Pilgrims Iron Sultanate Heretic Legions Black Grail The Court Keywords Mercenaries Mercenaries -Trench Crusade 181 0-1 Observer - Cost: 3 ☼ An Observer is Faithful and can be recruited as a Mercenary by New Antioch and Trench Pilgrim Warbands. This order of warrior monks lives in absolute solitude, honing their minds and bodies to become living weapons of the Hand of God. Once a soldier joins the order, they rarely leave the T emple of the Word, the sole exception being when they are summoned to the battlefield, where their unique abilities can decisively shift the balance in favour of the Faithful. The slightest disturbance in their prayers or training could sever their connection to the Lord of all Creation. Thus, the days and nights of the Observers are spent in secluded, cloistered cells, when not practicing their rigorous martial and mental disciplines. Movement Ranged Melee Armour Base 8”/Infantry +1 DICE +2 DICE -1 32mm Battlekit An Observer always has Standard Armour, a Combat Helmet, a Gas Mask, a Medi-kit, and a Polearm. Abilities","Dum-Dum Ammunition":"Dum-Dum Ammunition: Models in a Kingdom of Alba Assault Detachment Warband can have Dum-Dum Bullets (▶ see Battlekit in the Trench Crusade Digital Rulebook) at a cost of 5 👑 each . TheDum-Dum Bullets have the Limit: 3 stipulation.","Abyssinian Healers":"Abyssinian Healers: An Expeditionary Forces of Abyssinia Warband can include 0-2 Combat Medics and Misericordia have the Limit: 2 stipulation instead of Limit: 1.","Anchorite Cloister":"Anchorite Cloister: A W ar Pilgrimage of Saint Methodius Warband may include up to two Anchorite Shrines.","Communicant Heresy":"Communicant Heresy: The Pilgrims of Saint Methodius oppose the creation of Communicants. Ammo Monks, Communicants and Communicant Anti-T ank Hunters cannot be included in a W ar Pilgrimage of Saint Methodius Warband.","Treasure in Heaven":"T reasure in Heaven: Trench Pilgrims in a W ar Pilgrimage of Saint Methodius Warband cannot be resurrected as Martyr Penitents. W AR PILGRIMAGE OF SAINT METHODIUS ARMOURY & BATTLEKIT The following pieces of Battlekit are available to a W ar Pilgrimage of Saint Methodius Warband. The Machine Gun and Submachine Gun entries in the W ar Pilgrimage of Saint Methodius Armoury replace those in the standard Trench Pilgrim Armoury. Ranged Weapons Automatic Rifle Bayonet Lug, Limit: 1 40 👑 Machine Gun Limit: 2 50 👑 Submachine Gun Bayonet Lug, Shield Combo, Limit: 1 30 👑 Anchorite Ranged Weapons When you recruit an Anchorite Shrine, you can replace its Catherine Wheel with one of the following Ranged Weapons. Due to its immense size, all these weapons are counted as being 1-Handed weapons when they are used by an Anchorite Shrine. Anti-Materiel Rifle 40 👑 • Autocannon 55 👑 • Gas Censer 50 👑 Heavy Flamethrower 45 👑 • Punt Gun 10 👑 • Trench Mortar 40 👑 Anchorite Battlekit An Anchorite Shrine can have up to 2 of the following pieces of Battlekit. Once equipped, the Battlekit cannot be removed or lost from the Anchorite Shrine for any reason. • Gas Filters 5 👑 • Grand Anchorite Limit: 1 15 👑 • Hallowed Anchorite Limit: 1 10 👑 • Holy Diesel Engine 10 👑 • Piston Legs 10 👑 • Sacred Geometry Limit: 1 10 👑 • Wr a th ful Cherub Face 20 👑","Favour of the Lord":"Favour of the Lord: At the start of each Turn, you can place 1 BLESSING MARKER next to a model from this Warband.","Only the Righteous":"Only the Righteous: Any model with the PILGRIM Keyword in a Cavalcade of the T enth Plague Warband (including an Anchorite Shrine) can have a Sacrifical Lamb at a cost of 5 👑 each, except for Ecclesiastic Prisoners.","Flock of Assassins":"Flock of Assassins: A Fida’i of Alamut Warband can include 0-2 Sultanate Assassins and 1 Master Assassin (▶ see below).","Weapon Collections":"Weapon Collections: When you create your starting Warband, you can purchase 1 piece of Battlekit from the New Antioch Armoury, and 1 piece of Battlekit from the Trench Pilgrims Armoury. Any stipulations that apply to it are followed (so there is little point in taking Battlekit that can only be used by models from the other Warbands). You can repurchase the Battlekit later during the campaign if it is lost for any reason. Takwin Homunculus - Cost: 40 👑 Takwin Homunculi can take almost any shape and their sizes can range from a tiny imp to a towering colossus of 15 feet tall or more, depending on the skills and needs of the Alchemist that created them. Often their existence is a harsh one, even death does not release them from servitude as they can simply be repaired and re-animated. Some with sufficient intelligence take a philosophical stance and find fulfilment in their service to a greater cause. Movement Ranged Melee Armour Base 6”/Infantry +0 DICE +0 DICE 0 25mm Battlekit A Takwin Homunculus cannot have any Battlekit but can have Alchemical Formulas (▶ see Alchemical Formulas). Abilities","Janissary Officers":"Janissary Officers: A Defenders of the Iron W all Warband can have 0-2 Janissaries, which have the ELITE Keyword at no additional cost in 👑 .","Finish the Fallen":"Finish the Fallen: Due to their knowledge of anatomy and physiology, the Sisters are experts at inflicting debilitating injuries and excruciating pain. Add +1 INJURY DICE to Injury Rolls for Melee Attacks made by a Sister of Saint Cosmas if the target is Down and does not have the BLACK GRAIL or DEMONIC Keywords. Keywords NEGATE FEAR Mercenary Special Rules Starting a Warband New Antioch Trench Pilgrims Iron Sultanate Heretic Legions Black Grail The Court Keywords Mercenaries Mercenaries -Trench Crusade 186 0-1 Witchburner - Cost: 5 ☼ A Witchburner is Faithful and can be recruited as a Mercenary by New Antioch and Trench Pilgrim Warbands. Witchburners are the field officers of the Inquisition, charged with hunting down and punishing witches, warlocks, and Heretics who cannot be brought to face justice by conventional means. On the battlefield, they wield the power to call down divine retribution on those deemed to have transgressed against God, causing sinners to burst into flames with mere words of condemnation. Since none are without sin, none are truly safe. Movement Ranged Melee Armour Base 6”/Infantry +0 DICE +1 DICE -2 32mm Battlekit Witchburners always has Reinforced Armour, a Combat Helmet, and a Gavel of Justice (▶ see below). Abilities","Temporal Assassin":"T emporal Assassin: After determining the Charge Bonus for a Sultanate Assassin that has not already carried out a Fight ACTION in its Activation, you can say that the Sultanate Assassin will split itself through time. If you do so, choose an additional enemy model as the target of the Charge (the normal rules for picking a target apply, but do not count enemy models picked as targets for the Charge as interposing enemy models). Then make a charge move with the Sultanate Assassin which finishes within 1” of the first enemy model you picked as a target, and then take a Fight ACTION with the enemy model as the target. After resolving the Fight ACTION, you must immediately remove the Sultanate Assassin from the battlefield and redeploy it to within 1” of the other model that you picked. Then take a second Fight ACTION with the other enemy model as the target. The Sultanate Assassin must use the same Melee Weapon for both attacks, and cannot take a Fight ACTION later in the same Activation.","Forward Positions":"Forward Positions: When you deploy a Sultanate Sapper for the first time in a game, you must deploy them up to 6” away from your deployment zone and in contact with a terrain piece that is at least ½” high. Keywords SULT ANA TE 0-2 Sultanate Sappers - Cost: 50 👑👑 The Sultan’s Sappers are valued specialists, holding the great cannons of the Iron W all no matter what their enemies throw at them. They are easily identified by the terrible burns all over their bodies as their mighty artillery is prone to overheating. ª– Troops Warband Entries: Those Who Believe –≠ MF MF Trench Crusade Rulebook.indb 184Trench Crusade Rulebook.indb 184 09.09.25 15:1109.09.25 15:11Rules of Trench Crusade - Battlekit 143 Shovel Battlefield shovels allow troops to dig in and fight from cover in virtually any battlefield. Ty pe Range Keywords Equipment - - Shovel: A model equipped with a Shovel that starts the game on Open terrain has the COVER Keyword until it moves away from its starting position. In addition, a model equipped with a Shovel can use it as a 2-Handed Melee Weapon instead of using any other Melee Weapons it has. T racer Bullets T racer bullets allow soldiers to adjust their aim efficiently. Ty pe Range Keywords Equipment - CONSUMABLE T racers: When this Battlekit is taken, you must choose 1 Ranged Weapon that the model already has. The Weapon gains the +1 DICE Keyword. Troop Flag Most warbands and units carry banners, flags, standards, pennants or other symbols to rally the troops. Ty pe Range Keywords Equipment - LEADER, HELD Unholy Relic An artefact bestowed with unholy power. Examples include nephilim heads, desecrated splinters of the T rue Cross or mummified body parts of fallen saints and bishops. Ty pe Range Keywords Equipment - FEAR Unholy T rinket Many Heretic T roopers carry a talisman or charm that are sold by soothsayers and imps in the Heretic domains. Such a trinket might be a skull, preserved foetus, horn of a goat, and is often covered in Goetic runes. Ty pe Range Keywords Equipment - CONSUMABLE T alisman: Once during a game, when a Risky Success Roll for a model with an Unholy T rinket is a Failure, you can say that the model will use it. If you do, the model’s Activa-tion does not end. QSY QSY QSY QSY Trench Crusade Rulebook.indb 143Trench Crusade Rulebook.indb 143 09.09.25 15:1009.09.25 15:10 MF Other Rules Principles Game T urns 1. Initiative 2. Activation Movement Combat 3. Morale Winning","Stealth Generator":"Stealth Generator: Add -1 DICE to rolls for Ranged Attacks that target a Death Commando.","Beelzebub's Touch":"Beelzebub’s T ouch: Whenever a Melee Attack made by a Lord of T umours causes any BLOOD MARKERS or INFECTION MARKERS to be placed on the target, place 1 extra INFECTION MARKER next to the target model.","Frightening Speed":"Frightening Speed: Add +1 DICE to the Risky Success Roll for a Hound of the Black Grail that is taking a Dash ACTION. In addition, do not halve the Movement Characteristic of a Hound of the Black Grail when it stands up at the start of an Activation. Infested Carcasses: Hounds of the Black Grail models can add the INFECTION MARKERS Keyword to their melee attacks at a cost of +5 👑 each.","Iron-Clawed Hands":"Iron-Clawed Hands: A Goetic W arlock can make a Melee Attack with the CLEAVE 2 and CRITICAL Keywords even though it does not have a Melee Weapon. In addition, the Off- Hand Weapon modifier applies to the second attack.","Dignified Conduct":"Dignified Conduct: Witchburners are well aware of the dignity of their status. A Witchburner cannot take a Dash ACTION.","Janissary Veteran":"Janissary Veteran: You can make the Y üzbaşı a Janissary V eteran with the STRONG Keyword and the Janissary Counter- Charge ability at a cost of +10 👑 .","Maddening Buzzing":"Maddening Buzzing: Up to 1 Herald of Beelzebub model can have the Maddening Buzzing ability at a cost of +10 👑 . Success Rolls taken for enemy models within 8” of a model with this ability become Risky Success Rolls (there is no additional effect if they are Risky Success Rolls already). Keywords BLACK GRAIL, FEAR, FLYING, NEGATE GAS, SKIRMISHER","Hit & Run Tactics":"Hit & Run Tactics: Add -1 DICE to the roll for a Melee Attack that targets a model from an Éire Rangers Warband that is making a Retreat.","Highland Strength":"Highland Strength: The Lieutenant and any Shock T roopers in a Kingdom of Alba Assault Detachment Warband have the STRONG Keyword at no additional cost in 👑 .","Chieftain Panoply":"Chieftain Panoply: Mechanized Heavy Infantry in an Expeditionary Forces of Abyssinia Warband cannot have Machine Armour.","Faith of Ethiopia":"Faith of Ethiopia: The sect of the Sniper Priests does not operate in the Solomonic Dynasty. An Expeditionary Forces of Abyssinia Warband cannot include Sniper Priests.","Reliquary Armoury":"Reliquary Armoury: Holy Icon Shields cost 20 👑 fo r a Procession of the Sacred Affliction Warband and do not have the ELITE only stipulation.","Anchorite Armoury":"Anchorite Armoury: Anchorite Shrines in a W ar Pilgrimage of Saint Methodius Warband have a Ranged Characteristic of +0 DICE instead of -, and can have Anchorite Ranged Weapons and Anchorite Battlekit from the W ar Pilgrimage of Saint Methodius Armoury.","Blood of the Lamb":"Blood of the Lamb: Castigators in a Cavalcade of the T enth Plague Warband have the TOUGH Keyword at no additional cost in 👑 .","Assassin Acolytes":"Assassin Acolytes: Up to three Azeb models in a Fida’i of Alamut Warband can be given the INFIL TRATOR Keyword at a cost of +10 👑 each.","Takwin Homunculus":"Takwin Homunculus: : A House of Wisdom Warband can include one Takwin Homunculus for each Jabirean Alchemist in the Warband. Each Takwin Homunculus must be associated with a Jabirean Alchemist when it is added to the Warband. An Alchemist can only have a single Takwin Homunculus associated with it and vice versa. If a Takwin Homunculus associated Alchemist is killed during the campaign, it cannot be deployed during a game, its Battlekit cannot be changed, and no Alchemical Formulas can be applied to it. If you add a new Jabirean Alchemist to your Warband and it has any unassociated Takwin Homunculi, you must associate one of them with the new Alchemist.","Slow and Creeping":"Slow and Creeping: Treat a Trench Ghost model as having a Movement Characteristic of 3”/Infantry when it takes a Dash ACTION. In addition, add -1 DICE to the Success Roll for an attack made by a Trench Ghost model on an enemy model that is making a Retreat.","Corrupt Merchants":"Corrupt Merchants: When you create your starting Warband, you can purchase 1 piece of Battlekit from the New Antioch Armoury, and 1 piece of Battlekit from the Iron Sultanate Armoury. Any stipulations that apply to it must still be followed (so there is little point in taking the Assassin’s Dagger, for example, as it can only be used by Assassins). You can repurchase the Battlekit later during the campaign if it is lost for any reason.","Preserve the Loot":"Preserve the Loot: Models in a Knights of Avarice Warband cannot have Battlekit that has, or would give another piece of Battlekit, the FIRE and/ or SHRAPNEL Keywords. Grenade Launchers can be taken, but replace the SHRAPNEL Keyword with the -1 INJURY DICE, GAS, and IGNORE ARMOUR Keywords.","Fast as Lightning":"Fast as Lightning: Add +1 DICE to the Risky Success Roll for models from a Heretic Naval Raiders Warband that are taking a Dash ACTION.","Infection Markers":"INFECTION MARKERS: Some Cult of the Black Grail Weapons have the INFECTION MARKERS Keyword. These Weapons cause INFECTION MARKERS (instead of BLOOD MARKERS) to be placed next to the target (▶ see INFECTION MARKERS ).","Seven Deadly Sins":"Seven Deadly Sins: Before you recruit any models you must choose which of the Seven Deadly Sins your Warband is dedicated to. You can choose either W rath, Envy, Lust, Pride, Sloth, Gluttony, or Greed.","Blessed Stigmata":"Blessed Stigmata: Each time you remove a BLOOD MARKER from a Stigmatic Nun because of the REGENERATE 1 Keyword, place 1 BLESSING MARKER next to the Stigmatic Nun. Keywords PILGRIM, REGENERATE 1","Whirling Dervish":"Whirling Dervish: The ritual dance of these Dervishes is hypnotic to witness, and it is as graceful as it is deadly. Add -1 DICE to the Success Rolls for Ranged Attacks that target a Dervish.","Pummelling Blows":"Pummelling Blows: A Takwin Homunculus can make a Melee Attack even though it does not have any Melee Weapons.","Undead Fortitude":"Undead Fortitude: Add -1 INJURY DICE to Injury Rolls for a Lord of T umours unless the attack has the FIRE Keyword. Keywords BLACK GRAIL, ELITE, FEAR, LEADER, NEGATE GAS, STRONG, TOUGH GD","Martyrdom Device":"Martyrdom Device: An Ecclesiastic Prisoner with a Martyrdom Device can take a T rigger Martyrdom Device ACTION. If they do so, the Martyrdom Device detonates and cannot be used again. When Martyrdom Device detonates, make an Injury Roll for all models within 3” of the Ecclesiastic Prisoner (friend or foe, including the Ecclesiastic Prisoner). Make the Injury Roll for the Ecclesiastic Prisoner by rolling 4D6 and adding all 4 dice together, and add +1 INJURY DICE to the Injury Rolls for other models that are within 1” of the Ecclesiastic Prisoner. If an Ecclesiastic Prisoner detonates their Martyrdom Device and survives the game, you must either buy them a new Martyrdom Device for 35 ducats, or use them without one.","Specialist Force":"Specialist Force: You have 500 👑 and 11 ☼ to recruit a Papal State Intervention Force Warband for a campaign (▶ see Starting a Warband). A Papal States Intervention Force gains 4 ☼ each time it calls for Reinforcements. In a campaign, their Threshold V alue is reduced by 200 👑 . When recruiting models as a latecomer for a campaign, or for a one-off game, after agreeing upon the size of the game, reduce the amount of 👑 aP a p alS t a t esI n t e r v e n t i onF o r ceW a r b a nd has to spend by 200 👑 , and increase the amount of ☼ they have to spend by 11 ☼","Supreme Blessing":"Supreme Blessing: When you recruit a Papal States Intervention Force Warband, you must give the Supreme Pontiff ’s Crucifix to one model in the Warband. The Supreme Pontiff ’s Crucifix taken when the Warband is created is free and does not cost any ☼ (if it is lost then the replacement must be paid for normally).","Lightly-armoured":"Lightly-armoured: Only the Lieutenant and Mechanized Heavy Infantry model in a Stosstruppen of the Free State of Prussia Warband can have Reinforced Armour or Machine Armour.","Expert Fireteams":"Expert Fireteams: A Stosstruppen of the Free State of Prussia Warband can include up to 3 Fireteams instead of only 2.","Day of His Wrath":"Day of His Wrath: The W ar Prophet of this Warband replaces their Laying on Hands ACTION with the following Day of his W rath ACTION.","Infernal Rivalry":"Infernal Rivalry: Mammon is a rival of Beleth, who is the Patron of Death Commandos. A Knights of Avarice Warband cannot include Death Commandos.","Set Mine ACTION":"Set Mine ACTION: A Sultanate Sapper can take a Set Mine ACTION if they are in contact with a terrain piece that measures up to 8” by 8” that doesn't have the MINED Keyword. If they do so, take a Success Roll for the model and add +2 DICE to the roll. If the roll is a Failure, nothing happens. If the roll is a Success or a Critical Success, the terrain piece gains the MINED Keyword.","Feeble Flailing":"Feeble Flailing: An Ecclesiastic Prisoner can make a Melee Attack even though it doesn't have a melee weapon. If it does so, add -1 DICE to the Success Roll for the attack.","Artificial Life":"Artificial Life: Add -1 INJURY DICE to Injury Rolls for a Lion of Jabir.","Teeth and Claws":"T eeth and Claws: The Dragon can make a Melee Attack even though it does not have any Melee Weapons. A T eeth and Claws attack has the +1 DICE, +1 INJURY DICE, and IGNORE ARMOUR Keywords. Tail Swipe: After you make a Melee Attack with the Dragon, if it is still within 1” of any models that are not on its back, make a Melee Attack against each of the models that are not on its back in the order of your choice. A T ail Swipe attack has the +1 INJURY MODIFIER Keyword. Living Battlefield: Models can treat the Dragon and its base as if they were Dangerous terrain, and can finish a move on top of the Dragon’s model. All Success Rolls for a model on top of the Dragon become Risky Success Rolls if they are not already. Attacks made by a model that is on top of the Dragon and target it get +1 DICE and +1 INJURY DICE. The Dragon cannot attack a model that is on top of it. When the Dragon moves, any models on top of the Dragon are moved with it. After the Dragon’s move is finished, make a Success Roll for each model on it. If the roll is a Failure, the model Falls from the Dragon. Move it the shortest possible distance to the ground and place it Down, and then make an Injury Roll for it if it has Fallen 3” or more. If the roll is a Success or Critical Success, nothing happens. T ake the Success Roll in the same way if a model on top of the Dragon is taken Down for any reason. Scenario Format IV I V VII II VIII III IX X XI XII","Martial Prowess":"Martial Prowess: Mamluks are disciples of furūsiyya, the knightly discipline passed on through generations, they practice ceaselessly and thus have few equals. The Mamluk’s Greatsword does not have the HEAVY Keyword, and the Jezzail carried by a Mamluk Faris has the ASSAUL T Keyword and Shield Combo stipulation.","Disease Carrier":"Disease Carrier: If an enemy model is Activated while it is within 1” of a Hound of the Black Grail, place 1 INFECTION MARKER next to the enemy model before it carries out any Actions.","Poison Stingers":"Poison Stingers: A Pit Locust can make a Melee Attack with the CLEAVE 2 and SHRAPNEL Keywords even though it does not have a Melee Weapon. Keywords THE COURT, DEMONIC, FEAR, FLYING MF","Lightning Speed":"Lightning Speed: An Observer's Polearm has the CLEAVE 2 Keyword.","Zealot Strength":"Zealot Strength: Up to 1 Trench Pilgrim or Martyr Penitent can have the STRONG Keyword at a cost of +5 👑 . In addition, change the base size of the model to 32mm. Keywords PILGRIM","Loose Formation":"Loose Formation: The Lieutenant in an Éire Rangers Warband replaces their Hold Your Fire! ability with the SKIRMISHER Keyword at no change to their cost in 👑 .","Strong in Faith":"Strong in Faith: Éire is a bastion of the Church, with many famed warrior-priests who travel to war. An Éire Rangers Warband can include 0-2 Trench Clerics. In addition, Trench Clerics in an Éire Rangers Warband replace the Onward Christian Soldiers ability with the following two abilities:","Claymore Smiths":"Claymore Smiths: Great Swords/Axes cost 7 👑 instead of 12 for models from a Kingdom of Alba Assault Detachment Warband.","Strained Supply":"Strained Supply: Automatic Shotguns, Grenade Launchers, Machine Guns, Sniper Rifles, and Submachine Guns in a Kingdom of Alba Assault Detachment Warband have a Limit of 1. KINGDOM OF ALBA ASSAULT DETACHMENT ARMOURY & BATTLEKIT The following pieces of Battlekit are available to a Kingdom of Alba Warband. Lochaber Axe | 20 👑 Lochaber axes combine the power of the battle axe with the defensive qualities of a polearm. Its wicked spike has stopped many a Heretic in their tracks. Dùn Èideann Guard are especially adept at their use. Type Range Keywords 2 -Handed Melee +2 INJURY DICE, BLOCK, CRITICAL, CUMBERSOME, HEAVY","Troop Selection":"Troop Selection: A Stosstruppen of the Free State of Prussia Warband must include 2-8 Shock T roopers and cannot include Trench Moles. In addition, it cannot have more than 1 Sniper Priest or 1 Mechanized Heavy Infantry model. STOSSTRUPPEN OF THE FREE STATE OF PRUSSIA ARMOURY & BATTLEKIT The following pieces of Battlekit are available to a Stosstruppen of the Free State of Prussia Warband. Tank-Splitter Sword | 15 👑 | Limit: 2 It takes years of gruelling Mensur practice and field drills to acquire the precision and speed required to use the specialist tank-splitter swords of the Gardekorps. Despite their great size (often over 6 feet long), they are remarkably light, and due to the large quantities of orichalcum used in their forging process, they are virtually unbreakable. They are often used to disable tanks and other armoured vehicles, by either slicing their armour open or disabling them with an accurate swing to sever their tracks. Before any battle, they are treated with a special metal-corroding chemical compound which melts armour, making it far deadlier against armoured targets than those who wear none. Type Range Keywords 2-Handed Melee +1 INJURY DICE, CRITICAL, CUMBERSOME Melt Armour: When you make an Injury Roll for an attack made with a T ank- Splitter Sword, determine if the target has an Armour Characteristic that is -1 or greater, or if it is wearing Armour or carrying a Shield. If it does, before rolling the dice for the Success Roll, put one dice aside and turn it so that it shows a roll of ‘6’ . Roll the rest of the dice, and then return the dice you put to one side; it counts as having rolled a 6. In addition, attacks made with a T ank-Splitter Sword are not affected by the Dragonslayer Patron Skill ( ▶ see Patrons in the Trench Crusade Digital Rulebook). Holy Smoke | 15 👑 | Consumable, Trench Clerics only Made of a mixture of frankincense, agarwood, and secret chemicals from the Mendelist Order, this burned incense is inhaled by Prussian Trench Clerics before battle. It is highly addictive but grants great physical and mental resilience. Type Range Keywords Equipment - CONSUMABLE Chemical Incense: When you deploy a model that has Holy Smoke, you can say that they will consume it. If you do so, until the end of the game, the model has the NEGATE FEAR Keyword if it doesn't already have it, and -1 INJURY DICE is added to Injury Rolls for attacks that hit it.","Vanguard Forces":"Vanguard Forces: An Expeditionary Forces of Abyssinia Warband cannot include Trench Moles. Instead, up to 4 Y eomen in an Expeditionary Forces of Abyssinia Warband can have the Flanking ability for +5 👑 each.","Master Assassin":"Master Assassin: A Fida’i of Alamut Warband must include 1 Master Assassin. The Master Assassin uses the Sultanate Assassin Warband Entry, except that it has the LEADER and TOUGH Keywords and has a cost of 95 👑 .","Noble Guardians":"Noble Guardians: A House of Wisdom can include 0-2 Fāris. The Fāris use the Janissary Warband Entry, but have the ELITE Keyword at no additional cost in ducats.","Private Venture":"Private Venture: A House of Wisdom Warband cannot include a Y üzbaşı, Janissaries, or Sultanate Assassins.","Goetic Warlocks":"Goetic Warlocks: Goetic W arlocks are creations of Mammon. A Knights of Avarice Warband can include up to 2 Goetic W arlocks as Mercenaries (▶ see Goetic W arlock). In addition, the first Goetic W arlock to be recruited in a Knights of Avarice Warband costs 110 👑 insteadof its normal cost in ☼ .","Mammon's Chosen":"Mammon’s Chosen: A Knights of Avarice Warband cannot include a model if the cost of the model and its Battlekit is less than 80 👑 , unless the model is a W retched.","Absolute Faith":"Absolute Faith: Sniper Priests do not use their eyesight to aim at their enemies. The opposing player cannot spend BLOOD MARKERS to add -DICE to a Ranged Attack by a Sniper Priest.","Fortify ACTION":"Fortify ACTION: A Combat Engineer can take a Fortify ACTION. If they do so, take a Risky Success Roll for the Combat Engineer. If the roll is a Failure, the Combat Engineer’s Activation ends. If the roll is a Success or a Critical Success, the Combat Engineer has the COVER Keyword until they move away from their current position. Keywords NEW ANTIOCH, NEGATE MINED","Counter-Charge":"Counter-Charge: If the first ACTION a Janissary makes during their Activation is a Charge, add +1 DICE to Melee Attacks made by the Janissary for the rest of the Activation. Keywords SUL TANATE, STRONG MF","Trample ACTION":"T rample ACTION: A Brazen Bull can take a T rample ACTION. If it does so, it can make a Melee Attack that must target an enemy model that is Down. A T rample Melee Attack does not use a Melee Weapon and has the IGNORE ARMOUR Keyword. Keywords SUL TANATE, ARTIFICIAL, FEAR, STRONG, TOUGH MF","Sworn Brethren":"Sworn Brethren: When you recruit a Mamluk Faris to your Warband, before adding it to your roster, you can say it will form a FIRETEAM with 1 other model from your Warband that has the ELITE Keyword. Both of the models gain the FIRETEAM Keyword. Note that the Mamluk Faris’s FIRETEAM is in addition to any other FIRETEAMS your Warband can have, and that if a Mamluk Faris is in a FIRETEAM with a model from a New Antioch Warband, then only the model from the New Antioch Warband can use the Concentrated Attack special rule. Keywords FIRETEAM (▶ see Sworn Brethren), IGNORE OFF-HAND WEAPON Mercenary Special Rules Starting a Warband New Antioch Trench Pilgrims Iron Sultanate Heretic Legions Black Grail The Court Keywords Mercenaries Mercenaries -Trench Crusade 180 0-1 Mendelist Ammo Monk - Cost: 2 ☼ A Mendelist Ammo Monk is Faithful and can be recruited as a Mercenary by New Antioch and Trench Pilgrim Warbands. The Order of Mendelist Monks is entrusted with the design of divinely enhanced items and the creation of the Communicants, devotees who have undergone chemical communion. The Brotherhood of Blessed Munitions is a subsect of the Order whose duty is to supply the Faithful with ammunition infused with the chemically altered blood of a Meta-Christ. These concoctions are highly unstable, dangerous to handle, and the secrets behind their formulas are fiercely guarded. On the battlefield, the monks brave enemy fire and infernal terrors, unwavering in their holy duty to deliver ammunition and unleash the wrath of the Lord upon the Heretics. Their patron, Saint Barbara, is believed to raise those who fall in battle to everlasting glory. Movement Ranged Melee Armour Base 6”/Infantry -1 DICE -1 DICE 0 25mm Battlekit A Mendelist Ammo Monk only has a Gas Mask. Note that a Mendelist Ammo Monk has no weapons and therefore cannot attack. Abilities","Crushing Blows":"Crushing Blows: A Lord of T umours can make a Crushing Blows Melee Attack even if it does not have any Melee Weapons, or instead of using any Melee Weapons that it has. If it does so, this Melee Attack has the CLEAVE 2 Keyword.","Barbed Embrace":"Barbed Embrace: An enemy model within 1” of a Goetic W arlock cannot take a Retreat ACTION.","Temporal Fugue":"T emporal Fugue: Add -1 DICE to rolls for Ranged Attacks and Melee Attacks that target an Observer.","Unseen Advance":"Unseen Advance: Up to three models without the ELITE Keyword in a Heretic Naval Raiders Warband can be given the INFIL TRATOR Keyword at a cost of +10 👑 each. MF","Light Infantry":"Light Infantry: The following restrictions apply to an Éire Rangers Warband: It can only include 1 Mechanized Heavy Infantry model but can have up to 4 Combat Engineers and the Limit on Satchel Charges is changed to 4. It cannot include more than 3 models that have a Great Sword/Axe. In addition, Mechanized Heavy Infantry models cannot have a Great Sword/Axe. With the exception of Great Swords/Axes, only the Mechanized Heavy Infantry model can have Ranged Weapons and Melee Weapons with the HEAVY Keyword. Combat Engineers can have Satchel Charges. Only Mechanized Heavy Infantry can have Reinforced Armour or Machine Armour.","Rampant Charge":"Rampant Charge: Models in a Kingdom of Alba Assault Detachment Warband have the IGNORE DEFENDED OBSTACLE Keyword.","Warrior Nobles":"Warrior Nobles: Shock T roopers and models with the ELITE Keyword in an Expeditionary Forces of Abyssinia Warband can have the Chewa ability for +5 👑 each.","Face thy Fears":"Face thy Fears: Models in a Procession of the Sacred Affliction Warband cannot have Iron Capirotes. Ecclesiastic Prisoners in a Procession of the Sacred Affliction Warband do not have Iron Capirotes, but their cost remains the same.","Pride of Jabir":"Pride of Jabir: A House of Wisdom Warband can include 0-3 Lions of Jabir.","Enemies of All":"Enemies of All: A Trench Ghost Warband cannot include Mercenaries.","Semi-corporeal":"Semi-corporeal: Add -1 INJURY DICE for Injury Rolls caused by Ranged Attacks that hit a model from a Trench Ghost Warband.","Price of Greed":"Price of Greed: A Heretic Priest in a Knights of Avarice Warband has the following Price of Greed ACTION instead of the Puppet Master ACTION.","Worship Mammon":"Worship Mammon: The Patron of a Knights of Avarice Warband is always Mammon. KNIGHTS OF AVARICE ARMOURY & BATTLEKIT The following pieces of Battlekit are available to a Knights of Avarice Warband. Coin Hammer | 20 👑 | Limit: 2 This double-handed hammer bears the rune of Mammon on its head. Its strike burns through even the heaviest armour, leaving a permanent, painful scar in the shape of the rune. Type Range Keywords 2-Handed Melee +1 INJURY DICE, HEAVY Rune of Mammon: If the Injury Roll for an attack made by a Coin Hammer results in 1 or more BLOOD MARKERS being placed next to the target, place 1 BLESSING MARKER next to the model using the Coin Hammer. Golden Calf Altar | 20 👑 | Limit: 3 This portable altar of Mammon creates illusions of immense wealth, taking the form of whatever its target covets most. Type Range Keywords Equipment - DEPLOYABLE, HEAVY A Golden Calf Altar, if deployed, is represented by a terrain piece that is about ½” high and which is mounted on a 25mm base. It is Impassable terrain. Illusions: Enemy models treat Open ground and all terrain within 3” of a model with a Golden Calf Altar or a Golden Calf Altar terrain piece as being Difficult terrain (if it is not already), even if they have the FLYING Keyword. Place Altar ACTION: A model with a Golden Calf Altar can take a Place Altar ACTION. If they do so, deploy the Golden Calf Altar anywhere within 1”of the model. Once deployed, the model that had the Golden Calf Altar is not considered to be carrying it for the rest of the game. In addition, the Golden Calf Altar is lost at the end of the game and removed from your Warband Roster.","Hegemon's Will":"Hegemon’s Will: Using the remnants of the lingering power of a fallen Hegemon, a Plague Knight of the Warband can directly command a nearby Bereaved. An Executor or Plague Knight in a Dirge of the Great Hegemon Warband can take a Command Bereaved ACTION. If it does so, you can remove any number of INFECTION MARKERS from enemy models. For each INFECTION MARKER you remove, you can then carry out one of the following Commands with a Bereaved (Grail Thrall or Fly Thrall) that is within 18” of the model taking the Command Bereaved ACTION. A Bereaved cannot be given more than 1 Command each Turn, but carrying out a Command does not stop it from also being Activated in the same Turn (before or after the Command was issued). Charge","Assault Drill":"Assault Drill: You can ignore the Effect of the HEAVY Keyword for 1 Melee Weapon that a Shock T rooper has. A Shock T rooper still cannot have more than 1 Weapon (of any type) with the HEAVY Keyword.","Assault Beast":"Assault Beast: A W ar W olf is armed with two Melee Weapons (its Chainsaw Mouth and Shredding Claws). When it makes a Melee Attack, it can attack once using either its Chainsaw Mouth or Shredding Claws, or twice, first with the Chainsaw Mouth and second with its Shredding Claws (the Off- Hand Weapon modifier applies to the attack made with the Shredding Claws). Note that both Weapons have the RISKY keyword, which means that the W ar W olf ’s Activation ends immediately if the Success Roll for an attack made with either weapon is a Failure.","Dark Blessing":"Dark Blessing: When a W retched is taken Out of Action, place 1 BLESSING MARKER next to the nearest friendly model with the ELITE and HERETIC Keywords. If two or more eligible models are equally close to the W retched, you can choose which receives the BLESSING MARKER.","Parasite Host":"Parasite Host: Whenever a Melee Attack made by a Corpse Guard causes any BLOOD MARKERS or INFECTION MARKERS to be placed on the target, you can remove up to 1 BLOOD MARKER or INFECTION MARKER from the attacking Corpse Guard model.","Teeth & Claws":"T eeth & Claws: A Hound of the Black Grail can make a Melee Attack even though it does not have a Melee Weapon.","Rapid Assault":"Rapid Assault: Add +1 DICE to the Risky Success Roll when a model with the Rapid Assault ability takes a Dash ACTION.","Far from Home":"Far from Home: A Papal States Intervention Force Warband cannot include Trench Moles.","Melee-focused":"Melee-focused: Mechanized Heavy Infantry in a Kingdom of Alba Assault Detachment Warband have a Melee Characteristic of +1 DICE and a Ranged Characteristic of +0 DICE.","Holy Warriors":"Holy Warriors: An Expeditionary Forces of Abyssinia Warband can include 0-1 Trench Cleric and 0-2 Holy W arriors. Use the Trench Clerics Warband Entry for Holy W arriors. In addition to the normal rules for a Trench Cleric, a Holy W arrior has the following abilities:","Heaven Awaits":"Heaven Awaits: The Cavalcade rejects the doctrine of the Meta-Christ. Trench Pilgrims in a Cavalcade of the T enth Plague Warband cannot be resurrected as Martyr-Penitents.","Killing Squad":"Killing Squad: A Fida’i of Alamut Warband can include 1 Fireteam, consisting of any 2 models from the Warband. Both of the models in the Fireteam are given the FIRETEAM Keyword at no additional cost in 👑 .","Grand Cannons":"Grand Cannons: A Defenders of the Iron W all Warband can include 0-2 Sultanate Grand Cannons at a cost of 60 👑 each (▶ see Defenders of the Iron W all Warband Armoury). When a Grand Cannon is added to a Defender of the Iron W all Warband it must either be given to a Brazen Bull that is already part of the Warband, or added to the Armoury on the Warband’s roster sheet as a Grand Cannon gun battery. No more than 1 Grand Cannon can be given to a Brazen Bull model, and a Warband cannot have more than 2 Grand Cannons in total. The rules for using the Grand Cannon during a game can be found in the Defenders of the Iron W all Warband Battlekit section.","Sappers Corps":"Sappers Corps: The standard divisions assigned to the Iron W all have double-strength Sapper detachments. A Defenders of the Iron W all Warband can have 0-4 Sultanate Sappers.","Undead Horror":"Undead Horror: Models in this Warband have the FEAR, NEGATE DIFFICUL T TERRAIN, and NEGATE GAS Keywords.","Shock Charge":"Shock Charge: When you roll the Charge Bonus for a Shock T rooper, roll 1 extra D6 and use the single highest die to determine the bonus. Keywords NEW ANTIOCH MF","Expert Medic":"Expert Medic: Add +2 DICE to the Risky Success Roll when a Sister of Saint Cosmas carries out a Treat ACTION with their Medi-kit.","Memento Mori":"Memento Mori: The W ar Prophet is touched by a higher power, and the revealed truth allows them a degree of protection against premature death. The first time the W ar Prophet suffers an Out of Action result on the Injury Table, it is treated as a No Effect result instead. A W ar Prophet cannot have the TOUGH Keyword. Keywords PILGRIM, ELITE, LEADER","Resurrection":"Resurrection: If a Trench Pilgrim is killed after a game (▶ see Campaign in the Trench Crusade Digital Rulebook), they can be resurrected in the following Quartermaster Step as a Martyr Penitent with the Martyr Penitent Profile for a cost 45 👑 .Add -1 INJURY DICE to Injury Rolls for a Martyr Penitent. A Martyr Penitent keeps their Battlekit and Zealot Strength if the ability was purchased, but loses any Scars, Experience, and Advancements. Martyrdom Pills have no effect on a Martyr Penitent model.","Unholy Hymns":"Unholy Hymns: Add -1 DICE to Success Rolls taken for enemy models that are within 8” of one or more Choristers. Keywords HERETIC, ELITE, FEAR Heretic Troopers - Cost: 30 👑👑 These soldiers make up the bulk of the Heretic forces. Heretic Legionnaires have witnessed the Gate of Hell and survived; they are damned for all eternity. Heretic T rooper Profile Movement Ranged Melee Armour Base 6”/Infantry +0 DICE +0 DICE 0 25mm Heretic Legionnaire Profile Movement Ranged Melee Armour Base 6”/Infantry See below See below 0 25mm Battlekit A Heretic T rooper or Heretic Legionnaire can have any Battlekit from the Heretic Legions Armoury Tables. Abilities","Abiotic Life":"Abiotic Life: Add -1 INJURY DICE to rolls for an Artillery Witch that has been hit by an attack with the GAS Keyword.","Demonic Aura":"Demonic Aura: A Desecrated Saint has one of the following auras. The aura it has is determined by the Deadly Sin its Warband is dedicated to. Aura of Wrath: Add +1 DICE to rolls for Melee Attacks and the Risky Success Roll for taking a Dash ACTION for friendly models that are within 8” of this Desecrated Saint (including the Desecrated Saint themselves). Aura of Envy: Enemy models within 12” of the Desecrated Saint cannot charge a model from the Desecrated Saint's Warband that is within 1” of a model from the charging model's own Warband (it is allowed to move around them in order to reach a different target and does not treat them as an interposing enemy model). Aura of Lust: If an enemy model within 4” of this Desecrated Saint is wearing Armour that does not have the IMPERVIOUS Keyword, you can negate any of the Armour’s Keywords or special rules, if you wish to do so, for as long as the model is within 4” of the Desecrated Saint. The only rules or Keywords you cannot negate are those that affect the size of the base the model is mounted on. For example, if a model has Machine Armour, you could say that you will negate its -3 INJURY MODIFIER Keyword and Steadfast special rule while it is within 4” of the Desecrated Saint, but that you choose not to negate the Machine Armour’s Bulky special rule.","Wrath of God":"Wrath of God: Up to 1 Castigator, or Trench Pilgrim, or Martyr Penitent can have the W rath of God special rule at a cost of 15 👑 .BLOOD MARKERS are never placed next to a model with the W rath of God special rule, and it has the NEGATE FEAR Keyword. It cannot be Broken on the Wheel by an Anchorite Shrine. A model with the W rath of God special rule cannot have Ranged Weapons or Armour (it can have a Shield). In addition, change the base size of the model to 32mm.","Chaste Order":"Chaste Order: While they revere the holy stigmata of the Nuns of the order, the fathers of the monastery shun the ecstatic revelry of many Trench Pilgrims and insist on modest dress. All Stigmatic Nuns in a W ar Pilgrimage of Saint Methodius Warband must have Standard Armour, and cannot be used in a battle if they are not wearing Standard Armour. Additionally, the Warband cannot include more than 3 Stigmatic Nuns.","Alamut Alone":"Alamut Alone: A Fida’i of Alamut Warband cannot include a Y üzbaşı, a Jabirean Alchemist, any Janissaries, Lions of Jabir or Brazen Bulls.","Light Troops":"Light Troops: A Heretic Naval Raiders Warband cannot have more than two Anointed models or more than 1 Artillery Witch (even if the Warband has a value of 1,000 👑 o r more).","The Executor":"The Executor: A Dirge of the Great Hegemon Warband must include 1 Executor. The Executor uses the Plague Knight Warband Entry, except that it has a Ranged Characteristic of +1 DICE and the LEADER and TOUGH Keywords, and has a cost of 80 👑 . TheW arbandcan still include 0-2 Plague Knights.","The Bereaved":"The Bereaved: The Grail Thralls or Fly Thralls in a Dirge of the Great Hegemon Warband are called the Bereaved. They have a Ranged Characteristic of +0 DICE and a cost of 30 👑 ,and can have Ranged Weapons,Grenades, aMusical Instrument or a Troop Flag from the Cult of the Black Grail Armoury.","Defuse Mine":"Defuse Mine: When you move a Sultanate Sapper into contact with a ter-rain piece that has been Mined, you can say the Sultanate Sapper will halt and try to defuse the mine before it detonates (▶ see Detonating Mines below). If you do so, take a Risky Success Roll for the model. If the roll is a Failure, the mine detonates anyway and the Sultanate Sapper’s Activation ends. If the roll is a Success or a Critical Success, the mine does not deto-nate and the terrain piece is no longer considered to be Mined. Detonating Mines: When a model moves into contact with a Mined ter-rain piece, the mine will detonate unless the model is the one that set the mine, or has the Defuse Mine ability (▶ see above). Make an Injury Roll with the SHRAPNEL Keyword for the model that detonated the mine. The terrain piece is then no longer considered to be Mined. If the model wasn’t taken Down or Out of Action, it can then continue its move. Flying models only detonate a mine if they finish a move in contact with a Mined terrain piece (they can fly across it without setting it off ).","Whip of God":"Whip of God: When a Castigator makes a Melee Attack, they can target a friendly model that is within 1” instead of an enemy model. Set aside a D6 each time a Castigator attacks a friendly model and takes them Out of Action with a Melee Attack. The next time the Castigator’s Warband is forced to take a Morale Check, each D6 that was put aside adds +1 DICE to the roll and is then discarded.","Re-creation":"Re-creation: If a Takwin Homunculus is killed in the post-battle sequence, you do not have to remove it from your roster. Instead, you can spend 40 👑 i n the following Quartermaster Step to leave it on the Roster. Keywords SUL TANATE, ARTIFICIAL","Hide ACTION":"Hide ACTION: A Death Commando can take a Hide ACTION if they are in contact with a terrain piece that is at least ½” high. If they do so, take a Risky Success Roll for the model and add +1 DICE to the roll. If the roll is a Failure, the Death Commando’s Activation ends immediately. If the roll is a Success or Critical Success, enemy models cannot choose the Death Commando as the target for a Ranged Attack or Charge until the Death Commando moves, charges, retreats, makes a Ranged Attack, or an enemy model moves within 1.5” of them. The Death Commando can be hit if they are within the blast radius of a Weapon with the BLAST Keyword. Keywords HERETIC, ELITE, INFIL TRATOR","Loping Dash":"Loping Dash: Add +1 DICE to the Risky Success Roll for a W ar W olf that is taking a Dash ACTION. Keywords HERETIC, ARTIFICIAL, FEAR, NEGATE DIFFICUL T TERRAIN, TOUGH Chainsaw Mouth Type Range Keywords Special Melee +1 DICE, +1 INJURY DICE, IGNORE ARMOUR, RISKY Shredding Claws Type Range Keywords Special Melee +1 INJURY DICE, CUMBERSOME, RISKY","Law of Hell":"Law of Hell: If an attack made by a W retched takes an enemy model with the ELITE Keyword out of Action, the W retched model gains its freedom and is immediately removed from the game. It no longer counts as being part of the Warband for the purposes of Morale Checks, and is removed from the Warband Roster. Keywords THE COURT","Unstoppable":"Unstoppable: Enemy models that are mounted on a base of 32mm or less are not allowed to make a Melee Attack when an Amalgam that is within 1” of them retreats. In addition, an Amalgam can take a Move or Charge ACTION if all enemy models within 1” of it are mounted on bases of 32mm or less. Keywords BLACK GRAIL, FEAR, NEGATE GAS, STRONG, TOUGH","Annihilator":"Annihilator: A Desecrated Saint can take 1 Fight ACTION per Activation with each Melee Weapon it is equipped with.","Swiss Guard":"Swiss Guard: The Lieutenant and up to 4 models in a Papal States Intervention Force Warband can have the NEGATE FEAR Keyword at no additional cost in 👑 .","Athleticism":"Athleticism: The Lieutenant and Shock T roopers in a Stosstruppen of the Free State of Prussia Warband can have the Rapid Assault ability at a cost of +5 👑 each .","Feldkaplane":"Feldkaplane: Trench Clerics in a Stosstruppen of the Free State of Prussia Warband can have 1 dose of Holy Smoke (▶ see the Stosstruppen of the Free State of Prussia Armoury).","Light Melee":"Light Melee: Shock T roopers in a Stosstruppen of the Free State of Prussia Warband do not have the Assault Drill ability. They still cost 45 👑 .","The Unclean":"The Unclean: The Cavalcade detests using the unclean Ecclesiastic Prisoners. A Cavalcade of the T enth Plague Warband can only have 0-2 Ecclesiastic Prisoners.","Dishonoured":"Dishonoured: Models in a Dirge of the Great Hegemon Warband cannot have Beelzebub’s Axe or a Black Grail Shield.","Aim ACTION":"Aim ACTION: A Sniper Priest can take an Aim ACTION. If they do so, take a Risky Success Roll for the model and add +2 DICE to the roll. If the roll is a Failure, nothing happens and the Sniper Priest’s Activation ends. If the roll is a Success or Critical Success, for the rest of the Activation, add +2 DICE to the Success Rolls for Ranged Attacks that are made by the Sniper Priest. Keywords NEW ANTIOCH, ELITE MF","Iron Fists":"Iron Fists: The flesh of a Communicant Anti-T ank Hunter is as hard as iron, which makes their fists deadly weapons in their own right. A Communicant Anti-T ank Hunter can make a Melee Attack with the CLEAVE 2 Keyword even though it does not have a Melee Weapon. In addition, the Off-Hand Weapon modifier applies to the second attack. Keywords REGENERATE 1, STRONG, TOUGH Mercenary Special Rules Starting a Warband New Antioch Trench Pilgrims Iron Sultanate Heretic Legions Black Grail The Court Keywords Mercenaries Mercenaries -Trench Crusade 176 0-1 Goetic Warlock - Cost: 4 ☼ A Goetic Warlock is Fallen and can be recruited as a Mercenary by Heretic Legions Warbands and the Court of the Seven-Headed Serpent Warbands. Goetic Warlocks are nightmarish creations forged in the death factories of the Third Circle of Hell. Captured priests, prophets, vicars, rectors, and monks are tortured in fiendish machines that burn away their flesh with hellfire, encasing their still-living skeletons in infernal suits of armour, and stamping them with Goetic runes. The process is so agonising that the victims, driven by desperation, willingly enter into demonic pacts, seeking an end to their unbearable suffering. Thus, a new Goetic Warlock is born, now a ruthless predator, driven to hunt the very mortals they once swore to protect. The mere gaze of a Warlock induces necrosis. In close quarters, they clasp their enemies in a merciless embrace. Drawing on Goetic power, they portal to a secluded location, where they can savour the prolonged destruction of their victim, slowly shredding them into pieces. They revel in the grotesque act of skinning their victims alive, transforming the remains into repulsive vellum for dark grimoires and profane religious texts. Some even wear the faces of their victims to power their illusionary spells, confounding their enemies. Due to the rarity of the victims required to create Goetic Warlocks, these abominations are reserved for the most renowned Heretic commanders, with the greatest need and the most influential connections in the twisted web of Heretic politics. Mammon, the mighty devil of Greed, offers his personal battalion of Warlocks to the highest bidder. Movement Ranged Melee Armour Base 6”/Infantry +1 DICE +1 DICE -2 40mm Battlekit A Goetic W arlock always has Reinforced Armour. Abilities","Eye of God":"Eye of God: You can re-roll failed Success Rolls and Risky Success Rolls for an Observer. If you do so and any of the re-rolled dice show a 1, then the roll is treated as a Failure, the Observer is taken Down and their Activation immediately ends.","Cold Steel":"Cold Steel: Halve the cost of a Melee Weapon the first time that is purchased for a Kingdom of Alba Assault Detachment Warband. For example, the first Sword/ Axe purchased for a Warband would cost 2 👑 whileany further Swords/Axes would cost 4 👑 each","Mortal Sin":"Mortal Sin: Ecclesiastic Prisoners in a W ar Pilgrimage of Saint Methodius Warband cannot have a Martyrdom Device, and models in a W ar Pilgrimage of Saint Methodius Warband cannot be Broken on the Wheel of an Anchorite Shrine.","Alchemists":"Alchemists: A House of Wisdom Warband must include 1-2 Jabirean Alchemists. In addition, Alchemist Armour in a House of Wisdom Warband has the Limit: 2 stipulation instead of Limit: 1.","Lost Souls":"Lost Souls: A Trench Ghost Warband cannot include models with the ARTIFICIAL Keyword, and models in a Trench Ghost Warband cannot have Hellbound Soul Contracts or Infernal Brands. The Warband can include Anointed Heavy Infantry, but they do not have their Infernal Brand and still cost 95 👑 .","The Fallen":"the Fallen: Due to their knowledge of anatomy and physiology, the Sisters are experts at inflicting debilitating injuries and excruciating pain. Add +1 INJURY DICE to Injury Rolls for Melee Attacks made by a Sister of Saint Cosmas if the target is Down and does not have the BLACK GRAIL or DEMONIC Keywords. Keywords NEGATE FEAR Mercenary Special Rules Starting a Warband New Antioch Trench Pilgrims Iron Sultanate Heretic Legions Black Grail The Court Keywords Mercenaries Mercenaries -Trench Crusade 186 0-1 Witchburner - Cost: 5 ☼ A Witchburner is Faithful and can be recruited as a Mercenary by New Antioch and Trench Pilgrim Warbands. Witchburners are the field officers of the Inquisition, charged with hunting down and punishing witches, warlocks, and Heretics who cannot be brought to face justice by conventional means. On the battlefield, they wield the power to call down divine retribution on those deemed to have transgressed against God, causing sinners to burst into flames with mere words of condemnation. Since none are without sin, none are truly safe. Movement Ranged Melee Armour Base 6”/Infantry +0 DICE +1 DICE -2 32mm Battlekit Witchburners always has Reinforced Armour, a Combat Helmet, and a Gavel of Justice (▶ see below). Abilities","Bodyguard":"Bodyguard: If a friendly BLACK GRAIL model within 1” of a Corpse Guard is hit by a Ranged Attack or Melee Attack, you can say that the Corpse Guard will take the hit. If you do so, make an Injury Roll for the Corpse Guard instead of the original target. This ability cannot be used against attacks that have the BLAST Keyword.","Mubarizun":"Mubarizun: A Y üzbaşı is expected to face the mightiest of their enemies in personal combat, inspiring the troops to victory with their personal prowess. Add +1 INJURY DICE for attacks made by a Y üzbaşı if the target model has the TOUGH Keyword. Keywords SUL TANATE, ELITE, LEADER, NEGATE FEAR, TOUGH","Time Slip":"Time Slip: If your opponent fails their Success Roll for an attack targeting a Sultanate Assassin, you can say the Sultanate Assassin will slip into a moment in the future. If you do so, you can redeploy it anywhere within 6” of its original location (measured from the centre of its base to the centre of its base), and more than 1” away from any enemy models. If the failed attack took place because the Sultanate Assassin is retreating, the retreat move ends after you redeploy the model. Keywords SUL TANATE, ELITE, INFIL TRATOR","Corpulent":"Corpulent: Add -2 INJURY DICE to Injury Rolls for any attacks that target an Amalgam model.","Berserker":"Berserker: The Lieutenant or one of the Fianna in an Éire Rangers Warband can be upgraded to a Berserker for +15 👑 . A Berserker cannot have Armour (they can have Shields). In addition, a Berserker has the NEGATE FEAR Keyword, and BLOOD MARKERS are never placed on them under any circumstances.","Dervishes":"Dervishes: A Fida’i of Alamut Warband can include 0-4 Dervishes. The Dervishes use the Janissaries Warband Entry, but cannot wear Reinforced Armour and replace the STRONG Keyword with the IGNORE OFF-HAND WEAPON Keyword and the Whirling Dervish ability:","Gas Bombs":"Gas Bombs: Artillery Witches in a Knights of Avarice Warband replace their Infernal Bombs with Gas Bombs.","Mad Dash":"Mad Dash: Add +1 DICE to the Risky Success Roll for an Ecclesiastic Prisoner that is taking a Dash ACTION. Keywords PILGRIM","Levitate":"Levitate: You do not have to take a Risky Success Roll for an Artillery Witch when they Climb or Jump, or an Injury Roll if they Fall. Keywords HERETIC, ARTIFICIAL, NEGATE FEAR, NEGATE GAS","Armoured":"armoured: Only the Lieutenant and Mechanized Heavy Infantry model in a Stosstruppen of the Free State of Prussia Warband can have Reinforced Armour or Machine Armour.","Torturer":"T orturer: When a Y oke Fiend makes a Melee Attack, it can target a friendly model that does not have the DEMONIC Keyword. If it does so, it cannot attack again during the same Activation. Keywords THE COURT, DEMONIC MF","Flanking":"Flanking: When a model with this ability is deployed for the first time in a game, it can be deployed normally in its own deployment zone or in contact with any edge of the battlefield and at least 8” away from any enemy models. Models with this ability are deployed before models with the INFIL TRATOR Keyword, but after all other models. If a scenario has a special rule that says that models with the INFIL TRATOR Keyword must deploy normally, then models with this ability must also deploy normally.","Bagpipes":"Bagpipes: One Musical Instrument in a Kingdom of Alba Assault Detachment Warband can be upgraded to a set of Bagpipes at no additional cost in 👑 . Friendly models within 8” of a model that has a set of Bagpipes have the NEGATE FEAR Keyword.","Kavasses":"Kavasses: Kavasses are sworn guardians of the House of Wisdom. You can change the Melee Characteristic of up to 3 Azebs in a House of Wisdom Warband from -1 DICE to +0 DICE at a cost of +5 👑 each . However, these Azebs lose the Light Skirmisher ability.","Silahdar":"Silahdar: The commanders of the Iron W all’s units come from the personal bodyguards of the Sultan known as Silahdar. A Defenders of the Iron W all Warband must include 1 Silahdar. The Silahdar uses the Y üzbaşı Warband Entry, except that it replaces the Mubarizun ability with the STRONG Keyword, and they can have an Alaybozan from the Iron Sultanate Armoury (▶ see the Iron Sultanate Battlekit ), and an Anqā Guard and Explosive Charges from the Defenders of the Iron W all Armoury (▶ see Defenders of the Iron W all Warband Armoury), at the indicated cost in 👑 fo r each piece of Battlekit that is taken.","The Lost":"The Lost: A Dirge of the Great Hegemon Warband Warband can only include 0-2 Hounds of the Black Grail and can only include 0-2 Heralds of Beelzebub.","Awaited":"Awaited: An Ecclesiastic Prisoner that is taken Out of Action when their Martyrdom Device is triggered does not count towards the number of models from the Warband taken Out of Action for Morale Checks.","Chattel":"Chattel: In a campaign, W retched can be sold in the Quartermaster Step for 25 👑 plu s half the cost in 👑 of any Battlekit they have.","Hateful":"Hateful: When a Y oke Fiend is Activated, if it is more than 1” from any enemy models and there is an enemy model within 12” of it, that is in its Line of Sight, and that does not have the BLACK GRAIL or DEMONIC Keywords, then the Y oke Fiend must take a Charge ACTION with the closest enemy model as the target of the charge. If the Y oke Fiend was Down at the start of the Activation, it will stand up if it can do so and must then attempt to make the charge.","Weapons":"Weapons: If your model is armed with two Melee Weapons, it may attack with both, one after the other in the order of your choice. Add -1 DICE for the second attack. Fear: Add -1 DICE if your opponent has the FEAR Keyword. If both models cause FEAR the effect is cancelled out. Defended Obstacle: Add -1 DICE if the target is in cover. A model is in cover if it is in contact with a terrain piece that is at least ½” high and as wide as its base, and the terrain piece lies between it and the attacking model. Diving Charge: A model may attempt a Diving Charge against enemy models that are at least 3” below it. T ake a Risky Success Roll for the model. If the roll is a Failure the model is taken Down, and a Falling Injury Roll must then be taken for the model (▶ see Falling). If the roll is a Success, you do not have to take a Falling Injury Roll for the model, and you can add +1 DICE to the next Melee Attack that the model makes. Falling When a model Jumps, Dives, or Falls 3” or more, there is a chance it will be injured. T o see if this happens, make an Injury Roll for the model, and add +1 INJURY DICE for every 3” that the model fell. VP Initiative Phase Morale Phase","Command":"Command: The Y oke Fiend kills itself. It is taken Out of Action and crossed off its Warband Roster. Fight","Fianna":"Fianna: The Fianna are famed warrior-hunters. Shock T roopers in an Éire Rangers Warband can have the INFIL TRATOR and SKIRMISHER Keywords for +10 👑 pe r model.","Lector":"Lector: A Papal States Intervention Force Warband must include 1 Trench Cleric, but does not have to include a Lieutenant. A Trench Cleric in a Papal States Intervention Force Warband has the LEADER Keyword and the following additional ability:","Carnyx":"Carnyx: One Musical Instrument in an Éire Rangers Warband can have the FEAR Keyword at no additional cost in 👑 .","Sipahi":"Sipahi: Sipahi Automaton Cavalry often serves as infantry in the Iron W all’s units to reinforce areas under severe pressure. A Defenders of the Iron W all Warband can include up to 1 Sipahi Automaton Cavalry at a cost of 110 👑 . They use the Mercenary Entry for a Mamluk Faris but you cannot change their Battlekit in any way. Note that this does not stop you from recruiting a Mamluk Faris as a Mercenary as well.","Morale":"Morale: Fighting against the Cult of the Black Grail is a terrifying prospect. Your opponent must add -1 DICE to all Morale Checks unless their Warband is of either the Court of the Seven-Headed Serpent or the Cult of the Black Grail. Battlekit Elite Warband Entries Troops Warband Entries Warband Variants Starting a Warband New Antioch Trench Pilgrims Iron Sultanate Heretic Legions The Court Mercenaries Keywords Black Grail Armoury Tables Special Rules Warband Creation Black Grail- Trench Crusade 128 Infection Markers An INFECTION MARKER works in a similar way to a BLOOD MARKER, except that they grow and multiply over time if left untreated. Placing Infection Markers INFECTION MARKERS are placed next to a model in the same way as a BLOOD MARKER. A model may have up to six INFECTION MARKERS and up to six BLOOD MARKERS at the same time. W e recommend you use different coloured dice (the more disgusting the better!) to represent INFECTION MARKERS. Using Infection Markers An INFECTION MARKER can be used in the same way as a BLOOD MARKER (▶ see Comprehensive Rules in the Trench Crusade Digital Rulebook.); for example, it can be spent to modify Success Rolls and Injury Rolls, and/ or to convert an Injury Roll to a Bloodbath Roll. Additionally, you can combine BLOOD MARKERS and INFECTION MARKERS to affect the same roll or to cause a Bloodbath. Removing Infection Markers Rules that allow a BLOOD MARKER to be removed from a model cannot be used to remove an INFECTION MARKER unless specifically noted otherwise. The Infection Spreads If there are one or more INFECTION MARKERS next to a model when the model is Activated, place 1 more INFECTION MARKER next to the model before it carries out any Actions. Plague Knight Ranks Each Plague Knight in a Warband can be given one of the following Plague Knight Ranks at the indicated cost in 👑 :","Agile":"Agile: Add +1 DICE to Risky Success Roll when a Stigmatic Nun Climbs, Jumps, or makes a Diving Charge, o
