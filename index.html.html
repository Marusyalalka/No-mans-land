ccess or Critical Success, do not make an Injury Roll for the target. Instead, place 1 BLOOD MARKER next to the target, and then place a second BLOOD MARKER on the target because the Tormentor Chain has the SHRAPNEL Keyword. After placing the BLOOD MARKERS, you can move the target model up to 12” in a straight line, but you must move it so that it finishes the move as close as possible to the attacking model. This move can be used to make the model move within 1” of an enemy, make a retreat move, Climb, Jump, or Jump Down. The model cannot make a Diving Charge. Deadly Embrace: Enemy models cannot retreat if they are within 1” of a model with a Tormentor Chain.","armour_fly":"Insect Wings: Change the Movement Characteristic of a model that has the Armour of the Fly to 8”/Flying. Sucked Dry: After a model that has the Armour of the Fly takes a Fight ACTION, it can immediately make an additional Melee Attack with +1 DICE to the roll. However, do not make an Injury Roll if this Melee Attack hits the target; instead place 1 BLOOD MARKER next to the target model.","beelzebub_embrace":"Many-Legged Form: A model that has been blessed with Beelzebub's Embrace has its arms replaced with fly-like limbs. The model cannot have Weapons, Grenades, Shields or Equipment that has the HELD Keyword. It can take a Melee Attack with the CLEAVE 4 Keyword even though it doesn't have any Melee Weapons. If all 4 Melee Attacks successfully hit the same target model, and the target is mounted on a 32mm base or smaller, then the target is immediately taken Out of Action when it is hit by the fourth attack. Do not make an Injury Roll for the fourth attack, and any rules or abilities that would change the result do not apply (i.e. the TOUGH Keyword would not affect the fourth attack). This Battlekit cannot be removed or lost for any reason throughout the campaign.","cup_filth":"Drink from the Cup: At the start of the game, before either side deploys, you can pick either 1 ELITE model or up to 4 Thralls to drink from the cup. For the rest of the game, add +1 DICE to the Risky Success Roll for models that drank from the cup when they take a Dash ACTION.","locust_spitter":"Devouring Swarm: When a target is hit with the Locust Spitter, the mindless hunger of the Lord of Flies compels the swarm to continue devouring. If the Success Roll for a Ranged Attack made with Locust Spitter is a Success or Critical Success, after making the Injury Roll for the target, subtract the range to the target from 18”. Then make another Injury Roll for the closest model (friend or foe) that is within this distance of the target model and has a line of sight to it (no Success Roll is required). After the second target's Injury Roll has been made, the swarm moves on again, but this time the remaining distance it can travel is reduced by the distance between the first and second target, and it must target a new model that has not already been attacked. This carries on until the swarm either runs out of new target models it can reach and has a line of sight to, or the distance it is allowed to move is reduced to 0”. For example, if the range to the first target was 10”, then after making an Injury Roll for the first target, the closest model that can see the first target and is within (18-10) = 8” of it would also be hit. If the second target was within 3” of the first, then after making the second Injury Roll, the closest model that has not yet been attacked, and which can see the second target and is within (18-10-3) = 5” of it would be hit, and so on. Note that if the original attack was a Critical Success, the Injury Roll modifier only applies to the first Injury Roll; it does not apply to any subsequent models that are hit by the swarm. However, the -1 INJURY DICE and IGNORE ARMOUR Keywords apply to all of the Injury Rolls made.","bestial_cloak":"Spirit of the Beast: Once per Turn, you can do one of the following things for a model that as a Bestial Skin Cloak. Add +1 DICE to the roll for a Melee Attack made by the model. Add +1 INJURY DICE to the roll for a Melee Attack made by the model. Add +1 DICE to the Risky Success Roll when the model takes a Dash ACTION. A Hunter of the Left-Hand Path cannot cast the Oracle Beast Cloak Goetic Spell if it has a Bestial Skin Cloak.","cruel_helmet":"Gruesome Weight: When a model with a Cruel Helmet is deployed for the first time in a game, they are placed Down. In addition, if they are the target of an attack on the first Turn before they have been Activated, place 1 extra BLOOD MARKER next to them (even if the attack misses or the Injury Roll for it has No Effect).","koraktor":"Goetic Secrets: You can purchase a Goetic Power for a Sorcerer that has Koraktor, the Great Tome of Hell. It can be taken in addition to the 3 Goetic Powers the Sorcerer can normally have, and you can ignore any stipulations that would normally apply (such as the Sin the Sorcerer's Warband needs to be dedicated to, or it only being allowed for a model that isn't a Sorcerer). The additional power is purchased in the Quartermaster Step and its Cost must be paid normally.","lordship":"Mark of the Pit: The model carries a mark such as a living tattoo or a rune painted or carved by the hand of its infernal patron. At the start of each game, after both sides have deployed, if a friendly model with the Lordship of This W orld is on the battlefield you can pick 1 terrain piece that measures up to 8” by 8” and does not have any models from your Warband on it. You can move the terrain piece 6” in any direction, but it must finish wholly upon the battlefield, more than 1” from any other terrain pieces, and not on top of any of the models from your Warband. Any enemy models that are on the terrain piece are moved with it. Enemy models that the terrain piece is moved on top of are removed from the battlefield and then immediately redeployed by your opponent anywhere they desire within their deployment zone.","piece_silver":"Luck of the Devil: At the start of each game, before deployment, if you have a model with a Piece of Silver in your Warband, take 3 D6, set them to 6, and put them aside. During the game, unless you are making an Injury Roll or a Bloodbath Roll, you can replace a D6 that you are about to roll with one of the dice you put aside. It is not rolled and is always treated as having rolled a 6 (roll any other dice normally). You can only use one of the dice you set aside per roll. If the model with the Piece of Silver is taken Out of Action, any of the dice you set aside that remain are discarded and cannot be used.","crucifix":"Inspiring Relic: The bearer of this relic does not end their Activation after a failed Risky Success Roll.","martyrdom_device":"Martyrdom Device: An Ecclesiastic Prisoner with a Martyrdom Device can take a Trigger Martyrdom Device ACTION. If they do so, the Martyrdom Device detonates and cannot be used again. When the Martyrdom Device detonates, make an Injury Roll for all models within 3” of the Ecclesiastic Prisoner (friend or foe, including the Ecclesiastic Prisoner). Make the Injury Roll for the Ecclesiastic Prisoner by rolling 4D6 and adding all 4 dice together, and add +1 INJURY DICE to the Injury Rolls for other models that are within 1” of the Ecclesiastic Prisoner. If an Ecclesiastic Prisoner detonates their Martyrdom Device and survives the game, you must either buy them a new Martyrdom Device for 35 ducats, or use them without one.","infernal_bomb":"Duck: Add -1 INJURY DICE to the roll for a model that is hit by an Infernal Bomb if it is in contact with a terrain piece that is at least ½” tall and that lies in between it and the target point. Infernal Strike: If the Success Roll for a Ranged Attack with an Infernal Bomb that targets an enemy model is a Success or a Critical Success, or if the attack is a Failure and the target point scatters onto a model's base, apply the effect of the DEADLY Keyword to the Injury Roll for that model. Injury Rolls for other models caught in the Infernal Bomb’s BLAST are made normally. Mighty Explosion: If a model that has been hit by an Infernal Bomb is not taken Out of Action by the Injury Roll, it is blown away D3” in a straight line by the explosion, even if the model has been taken Down by the Injury Roll. Roll separately for each model to see how far it is blown away by an Infernal Bomb. If the model was the target of the attack, it is blown directly away from the Artillery Witch. If the model was caught in the Blast of the weapon, it is blown directly away from the target point. The model stops if it is blown into another model, Impassable terrain, or terrain it cannot cross without having to Climb."};

Object.assign(BOOK_RULES.named, {
  "Weapon Collections":"Weapon Collections: When you create your starting Warband, you can purchase 1 piece of Battlekit from the New Antioch Armoury, and 1 piece of Battlekit from the Trench Pilgrims Armoury. Any stipulations that apply to it are followed (so there is little point in taking Battlekit that can only be used by models from the other Warbands). You can repurchase the Battlekit later during the campaign if it is lost for any reason.",
  "Specialist Force":"Specialist Force: You have 500 👑 and 11 ☼ to recruit a Papal States Intervention Force Warband for a campaign. A Papal States Intervention Force gains 4 ☼ each time it calls for Reinforcements. In a campaign, their Threshold Value is reduced by 200 👑. When recruiting models as a latecomer for a campaign, or for a one-off game, after agreeing upon the size of the game, reduce the amount of 👑 a Papal States Intervention Force Warband has to spend by 200 👑, and increase the amount of ☼ they have to spend by 11 ☼.",
  "Strained Supply":"Strained Supply: Automatic Shotguns, Grenade Launchers, Machine Guns, Sniper Rifles, and Submachine Guns in a Kingdom of Alba Assault Detachment Warband have a Limit of 1.",
  "Troop Selection":"Troop Selection: A Stosstruppen of the Free State of Prussia Warband must include 2-8 Shock Troopers and cannot include Trench Moles. In addition, it cannot have more than 1 Sniper Priest or 1 Mechanized Heavy Infantry model.",
  "Worship Mammon":"Worship Mammon: The Patron of a Knights of Avarice Warband is always Mammon.",
  "Morale":"Morale: Fighting against the Cult of the Black Grail is a terrifying prospect. Your opponent must add -1 DICE to all Morale Checks unless their Warband is of either the Court of the Seven-Headed Serpent or the Cult of the Black Grail."
});

Object.assign(BOOK_RULES.keywordRules, {
  "SHIELD COMBO":"Shield Combo: A model can have a Shield and a 2-Handed Weapon if both have the Shield Combo stipulation.",
  "BAYONET LUG":"Bayonet Lug: A Bayonet can only be taken by a model that has a Ranged Weapon with the Bayonet Lug stipulation.",
  "HEADGEAR":"Headgear: A model cannot have more than one piece of Headgear (even if it has more than one head!).",
  "LIMIT":"Limit X: Your Warband cannot have more than X pieces of the Battlekit. For example, if a Weapon has Limit: 2 after its cost, then you can have a maximum of two such Weapons for your whole Warband. If you lose any Limit X Battlekit over the course of a campaign, you can buy replacements for them.",
  "FAITHFUL":"Alignment: All Warbands in this book are either Faithful or Fallen. Faithful Warbands are Heavenly-aligned and fight for the holy cause. Fallen Warbands are Hell-aligned and fight for the unholy cause. The Mercenaries that can be hired for a Warband will also have either Faithful or Fallen alignment. Unless stated otherwise, a Warband cannot include models of the opposing alignment.",
  "FALLEN":"Alignment: All Warbands in this book are either Faithful or Fallen. Faithful Warbands are Heavenly-aligned and fight for the holy cause. Fallen Warbands are Hell-aligned and fight for the unholy cause. The Mercenaries that can be hired for a Warband will also have either Faithful or Fallen alignment. Unless stated otherwise, a Warband cannot include models of the opposing alignment."
});
Object.assign(BOOK_RULES.named, {
  "Defuse Mine":"Defuse Mine: When you move a Sultanate Sapper into contact with a Marker or terrain piece with the MINED Keyword, you can say the Sultanate Sapper will try to defuse the mine before it detonates (▶ see MINED). If you do so, take a Risky Success Roll for the model. If the roll is a Failure the mine detonates and the Sultanate Sapper’s Activation ends. If the roll is a Success or a Critical Success, the mine does not detonate, and the Marker or terrain piece loses the MINED Keyword. A model that sets a mine on a terrain piece can defuse the mine automatically if it moves into contact with the terrain piece (do not take a Risky Success Roll).",
  "Gas Filters":"Gas Filters | 5 👑\nThe Anchorite is installed with a holy incense system that cleanses and purifies the air the monk inside the Anchorite breathes.\nType Range Keywords\nSpecial - NEGATE GAS",

const S = { list: [], view: "home", cur: null, nf: { fac: null, variant: null, sin: null, name: "" }, confirm: null, rulesQ: "" };
let STORE = null;

// ---------- storage ----------
const LS_KEY = "trench-warbands-v1";
const local = {
  kind: "local",
  async list() { try { return JSON.parse(localStorage.getItem(LS_KEY) || "[]"); } catch (e) { return []; } },
  async save(wb) { try { const l = await this.list(); const i = l.findIndex(x => x.id === wb.id); if (i >= 0) l[i] = wb; else l.push(wb); localStorage.setItem(LS_KEY, JSON.stringify(l)); } catch (e) {} },
  async remove(id) { try { const l = (await this.list()).filter(x => x.id !== id); localStorage.setItem(LS_KEY, JSON.stringify(l)); } catch (e) {} }
};
function dbStore(db, uid) {
  const col = db.collection("data/users/" + uid);
  const chain = {};
  const q = (id, fn) => (chain[id] = (chain[id] || Promise.resolve()).then(fn).catch(e => { console.warn(e); toast(e && e.code === "quota_exceeded" ? "Storage is full: delete an old warband." : "Couldn't save just now; will retry on the next change."); }));
  return {
    kind: "db",
    async list() { const s = await col.get(); return s.docs.map(d => d.data() && d.data().wb).filter(Boolean); },
    save(wb) { const body = { wb: JSON.parse(JSON.stringify(wb)), updated: Date.now() }; return q(wb.id, () => col.doc(wb.id).set(body)); },
    remove(id) { return q(id, () => col.doc(id).delete()); }
  };
}
async function initStore() {
  STORE = local;
  const fixW = w => { w.free = false; (w.models || []).forEach(m => { if (m.ft === "M" || m.ft === "E") m.ft = null; }); return w; };
  S.list = (await local.list()).map(fixW);
  render();
  try {
    if (!window.claude || !window.claude.use) return;
    const [db, user] = await Promise.all([window.claude.use("db"), window.claude.use("user")]);
    if (!db || !user) return;
    const uid = await user.id(); if (!uid) return;
    const st = dbStore(db, uid);
    const remote = await st.list();
    const ids = new Set(remote.map(w => w.id));
    const loc = S.list.filter(w => !ids.has(w.id));
    for (const w of loc) await st.save(w);
    STORE = st;
    S.list = remote.concat(loc); S.list.forEach(fixW);
    render();
  } catch (e) { console.warn("db unavailable", e); }
}
const saveTimers = {};
function persist(W) {
  W.updated = Date.now();
  clearTimeout(saveTimers[W.id]);
  saveTimers[W.id] = setTimeout(() => { STORE.save(W); if (STORE.kind === "db") local.save(W); }, 500);
}

function facLabel(W) { const f = FAC(W.fac); const v = W.variant && VARIANTS[W.variant]; return (v ? v.n + " · " : "") + f.short + (W.sin ? " · " + W.sin : ""); }
function toast(msg) { const r = $("#toast-root"); r.innerHTML = '<div class="toast" role="status">' + esc(msg) + "</div>"; clearTimeout(toast.t); toast.t = setTimeout(() => r.innerHTML = "", 2400); }

// keyword normalisation for glossary lookup
function normKw(k) {
  k = k.trim().replace(/[”"]/g, '"');
  let m;
  if ((m = k.match(/^[+-]\d+ (INJURY DICE|DICE|INJURY MODIFIER)$/))) return ["+/- " + m[1]];
  if ((m = k.match(/^NEGATE (.+)$/))) { const r = ["NEGATE"]; const sub = normKw(m[1]); if (sub.length && KEYWORDS[sub[0]]) r.push(sub[0]); return r; }
  if (k === "IGNORE ARMOUR") return ["IGNORE ARMOUR"];
  if (/^IGNORE /.test(k)) return ["IGNORE"];
  if ((m = k.match(/^(AUTOMATIC|CLEAVE|BLAST|BLESSED|REGENERATE)\b/))) return [m[1]];
  if (/^AMMUNITION/.test(k)) return ["AMMUNITION"];
  if (/^DANGEROUS TERRAIN/.test(k)) return ["DANGEROUS TERRAIN"];
  if (/^FIRETEAM/.test(k)) return ["FIRETEAM"];
  if (KEYWORDS[k]) return [k];
  return [];
}
const KW_RX = new RegExp("\\b(" + Object.keys(KEYWORDS).filter(k => /^[A-Z][A-Z -]+$/.test(k)).sort((a, b) => b.length - a.length).map(k => k.replace(/[-]/g, "\\-")).join("|") + ")\\b", "g");
function linkify(text) {
  return esc(text).replace(KW_RX, (m0) => '<button class="lk" data-act="kw" data-k="' + esc(m0) + '">' + m0 + "</button>");
}
function kwChip(k) { return '<button class="chip kw" data-act="kw" data-k="' + esc(k) + '">' + esc(k) + "</button>"; }
const cleanBookText = text => String(text || "")
  .replace(/\b([TWYV]) ([a-z]{2,})\b/g,"$1$2")
  .replace(/\bW arband(s)?\b/g,"Warband$1").replace(/\bW arlock(s)?\b/g,"Warlock$1").replace(/\bW ar\b/g,"War")
  .replace(/\bW eapon(s)?\b/g,"Weapon$1").replace(/\bW retched\b/g,"Wretched").replace(/\bW orldly\b/g,"Worldly")
  .replace(/\bW all\b/g,"Wall").replace(/\bW olf\b/g,"Wolf").replace(/\bT akwin\b|\bTa kwin\b/g,"Takwin").replace(/\bT rench\b/g,"Trench").replace(/\bT rooper(s)?\b/g,"Trooper$1")
  .replace(/\bT roops\b/g,"Troops").replace(/\bT raining\b/g,"Training").replace(/\bT errain\b/g,"Terrain")
  .replace(/\bT ank\b/g,"Tank").replace(/\bT urn(s)?\b/g,"Turn$1").replace(/\bT able(s)?\b/g,"Table$1")
  .replace(/\bT o\b/g,"To").replace(/\bY ou\b/g,"You").replace(/\bY our\b/g,"Your").replace(/\bY eom(e|a)n\b/g,"Yeom$1n")
  .replace(/\bY üzbaşı\b/g,"Yüzbaşı").replace(/\bV oice\b/g,"Voice").replace(/\bT rample\b/g,"Trample").replace(/\bT orturer\b/g,"Torturer")
  .replace(/\bINFIL TRATOR\b/g,"INFILTRATOR").replace(/\bDIFFICUL T\b/g,"DIFFICULT").replace(/\bASSAUL T\b/g,"ASSAULT").replace(/\bSUL TANATE\b/g,"SULTANATE").replace(/\bOff- Hand\b/g,"Off-Hand")
  .replace(/\bplu s\b/g,"plus").replace(/\bindicate d\b/g,"indicated").replace(/\byoucannot\b/gi,"you cannot")
  .replace(/\s+(?:Introduction The World in Flames Core Rules Comprehensive Rules Keywords|Warband Creation Special Rules Armoury Tables|Starting a Warband New Antioch).*$/i,"")
  .replace(/\s+(?:(?:PW|GD|MM|MF|VP|DG|MK|PP|VM)\s+)?(?:Ranged Weapons|Melee Weapons|Mercenary)$/i,"")
  .replace(/\s+(?:PW|GD|MM|MF|VP|DG|MK|PP|VM)$/," ").replace(/\s+([,.;:!?])/g,"$1").replace(/👑\s*👑/g,"👑").replace(/\bACTION\.If\b/g,"ACTION. If").trim();
const fullNamedRule = (name, fallback) => { const v = BOOK_RULES.named[name]; return cleanBookText(v && !/Warband Creation Special Rules|Introduction The World|HOUSE OF [A-Z]/.test(v) ? v : (fallback || "")); };
const fullItemRule = (id, fallback) => cleanBookText(BOOK_RULES.itemRules[id] || fallback || "");
const fullGoeticRule = p => cleanBookText(BOOK_RULES.goetic[p.n] || p.x || "");
const fullKeywordRule = (name, fallback) => cleanBookText(BOOK_RULES.keywordRules[name] || fallback || "");

const SH = { stack: [] };

function kwBody(k) {

function onlyLabel(only, all) { return only.map(o => o === "ELITE" ? "ELITE" : o[0] === "@" ? o.slice(1).replace(/^./, c => c.toUpperCase()) : o[0] === "$" ? "with " + (ITEMS[o.slice(1)] || {}).n : (modelName(o))).join(all ? " & " : " or "); }
function modelName(id) { for (const f of FACTIONS) { const m = f.models.find(x => x.id === id); if (m) return m.n; } for (const v of Object.keys(VARIANTS)) { try { const F = buildFaction(VARIANTS[v].fac, v); const m = F.models.find(x => x.id === id); if (m) return m.n; } catch (e) {} } return id; }

function abilityList(X, m) { const ef = X.eff(m); const def = X.def(m); const a = ef.ab.slice(); if (def.id === "saint" && X.W.sin) a.push(["Aura of " + X.W.sin, AURAS[X.W.sin]]); return a; }
function canBuyKit(X, m) {

}
function ftLabel(X, o) {
  if (/^[MEP]:/.test(o)) { const x = X.W.models.find(y => y.uid === o.slice(2)); return ({ M: "Sworn Brethren with ", E: "Enslaved Mind with ", P: "Plutocracy with " })[o[0]] + (x ? (x.name || X.eff(x).name) : "?"); }
  return "Fireteam " + o;
}
function fireteamOpts(X, m) {
  const out = []; const n = X.F.fireteams || 0; for (let i = 0; i < n; i++) out.push("ABC"[i]);
  const W = X.W;
  const isMam = x => x.type === "m_mamluk" || x.type === "sipahi";
  const isEns = x => X.hasUp(x, "enslaved");
  const isPl = x => X.camp && x.camp && (x.camp.skills || []).includes("plutocracy");
  if (isPl(m)) out.push("P:" + m.uid);
  W.models.filter(x => x !== m && isPl(x)).forEach(x => { if (!X.eff(m).elite) out.push("P:" + x.uid); });
  if (isMam(m)) return ["M:" + m.uid];
  if (isEns(m)) return ["E:" + m.uid];
  W.models.filter(isMam).forEach(x => { if (X.eff(m).elite) out.push("M:" + x.uid); });
  W.models.filter(isEns).forEach(x => out.push("E:" + x.uid));
  if (m.ft && !out.includes(m.ft)) out.push(m.ft);
  return out;
}

function kitSheet(uid) {

    { const t0 = X.totals(); m.items = (m.items || []).concat([key]); const t1 = X.totals(); m.items.pop(); const real = { d: t1.d - t0.d, g: t1.g - t0.g };

  CATS.forEach(cat => {
    const es = X.F.armoury.filter(e => e.cat === cat && X.allowedEntry(m, e));
    if (es.length) h += '<div class="pk-cat">' + CAT_LABEL[cat] + "</div>" + es.map(e => rowE(e, e.item)).join("");

      const es = FAC(fid).armoury.filter(e => (!fr.weaponsOnly || ["ranged","melee"].includes(e.cat)) && X.allowedEntry(m, Object.assign({}, e)));

// Goetic cost must be counted: hook into Ctx costs
const _Ctx = Ctx;
Ctx = function (W) {
  const X = _Ctx(W);
  const base = X.costs;

  return X;
};

// ---------- mutations ----------

}

function ledgerOn(W) { return !!(W && W.camp && W.camp.on && !W.camp.manual); }
function spend(fn, keepSheet) {
  mutate(W => { if (!ledgerOn(W)) return fn(W); const t0 = Ctx(W).totals(); fn(W); const t1 = Ctx(W).totals();
    W.camp.box = (W.camp.box || 0) - (t1.d - t0.d); W.camp.gp = (W.camp.gp || 0) - (t1.g - t0.g); }, keepSheet);
}
function marginal(W, fn) { const C = JSON.parse(JSON.stringify(W)); const t0 = Ctx(C).totals(); fn(C); const t1 = Ctx(C).totals(); return { d: t1.d - t0.d, g: t1.g - t0.g }; }
function afford(W, cost) { if (!ledgerOn(W)) return null; if (cost.d > (W.camp.box || 0)) return "Not enough ducats in the Strongbox (" + (W.camp.box || 0) + ")."; if (cost.g > (W.camp.gp || 0)) return "Not enough Glory (" + (W.camp.gp || 0) + " unspent)."; return null; }
function crucifixCheck(W, key) { if (W.camp && W.camp.on && X_itemOf(key) === "crucifix") W.camp.crucifixGone = true; }
function X_itemOf(key) { return key.startsWith("g:") ? key.slice(2) : key.includes("/") ? key.split("/")[1] : key; }

document.addEventListener("input", e => {
  const el = e.target; const a = el.dataset && el.dataset.act; if (!a) return;
  const W = curW();
  if (a === "nf-name") S.nf.name = el.value;
  else if (a === "rules-q") { S.rulesQ = el.value; const pos = el.selectionStart; render(); const n = $("#rules-q"); n.focus(); n.setSelectionRange(pos, pos); }
  else if (a === "wb-name") { W.name = el.value; persist(W); }
  else if (a === "wb-notes") { W.notes = el.value; persist(W); }
  else if (a === "m-name") { const m = W.models.find(x => x.uid === el.dataset.uid); m.name = el.value; persist(W); }
});
document.addEventListener("change", e => {
  const el = e.target; const a = el.dataset && el.dataset.act; if (!a) return;
  const uid = el.dataset.uid;
  if (a === "nf-sin") { S.nf.sin = el.value || null; render(); }
  else if (a === "wb-sin") mutate(W => { W.sin = el.value; });
  else if (a === "wb-bat") mutate(W => { W.batteries = Math.max(0, Math.min(2, +el.value || 0)); });
  else if (a === "m-opt") spend(W => { const m = W.models.find(x => x.uid === uid); m.opts = m.opts || {}; m.opts[el.dataset.o] = el.value; });
  else if (a === "m-up") spend(W => { const m = W.models.find(x => x.uid === uid); m.ups = m.ups || {}; if (el.checked) m.ups[el.dataset.u] = true; else delete m.ups[el.dataset.u]; });
  else if (a === "import") importFile(el);
  else if (a === "camp-on") mutate(W => { W.camp = W.camp || {}; W.camp.on = el.checked; if (!W.camp.patron && PATRON_LOCK[W.variant]) W.camp.patron = PATRON_LOCK[W.variant];
    if (el.checked && W.camp.box == null) { const t = Ctx(W).totals(); W.camp.box = Math.max(0, W.budget.d - t.d); W.camp.gp = Math.max(0, (W.camp.gp || 0) + W.budget.g - t.g); } }, true);
  else if (a === "hover-on") { try { localStorage.setItem("tc_hover", el.checked ? "1" : "0"); } catch (e) {} }
  else if (a === "camp-manual") mutate(W => { W.camp.manual = el.checked; }, true);
  else if (a === "c-field") mutate(W => { const v = el.dataset.f === "patron" ? (el.value || null) : Math.max(0, +el.value || 0); W.camp[el.dataset.f] = v; });
  else if (a === "m-camp") mutate(W => { const m = W.models.find(x => x.uid === uid); m.camp = m.camp || {}; m.camp[el.dataset.f] = Math.max(0, +el.value || 0); });
  else if (a === "dog-bond" || a === "dog-train") { spend(W => { const m = W.models.find(x => x.uid === uid); m.dog = m.dog || {}; if (a === "dog-bond") m.dog.bond = el.checked; else m.dog.train = el.value || null; }, true); if (SH.stack.length && /^Trench Dog/.test(SH.stack[SH.stack.length - 1].title)) { closeSheet(); render(); dogSheet(uid); } }
  else if (a === "m-limitem") mutate(W => { const m = W.models.find(x => x.uid === uid); m.camp.limItem = el.value || null; });
  else if (a === "m-ft") mutate(W => { const m = W.models.find(x => x.uid === uid); m.ft = el.value || null; });

});

function removeThing(W, kind, uid, ix, mode) {

  if (kind === "item") { const key = m.items.splice(ix, 1)[0]; if (!m.items.includes("g:trench_dog")) delete m.dog;
    if (mode === "arsenal") (W.arsenal = W.arsenal || []).push(key); else if (mode !== "undo") crucifixCheck(W, key); }
  else if (kind === "goetic") W.goetic[uid].splice(ix, 1);
  else if (kind === "arsenal") W.arsenal.splice(ix, 1);
  else if (kind === "model") {
    if (mode === "arsenal") (W.arsenal = W.arsenal || []).push(...(m.items || []));
    else if (mode !== "undo") (m.items || []).forEach(k => crucifixCheck(W, k));
    W.models = W.models.filter(x => x.uid !== uid); if (W.goetic) delete W.goetic[uid];

}

      name = l.raw.replace(/\s*[-–|:].*$/, "").trim(); return;
    }
    if (!cur) { if (!facWords.some(f => L.includes(f))) unmatched.push(l.raw); return; }
    // items & upgrades on this line
    let rest = L; let hit = false;
    idict.forEach(d => { while (rest.includes(" " + d.f + " ")) { rest = rest.replace(" " + d.f + " ", " | "); hit = true;
      cur.forEach(m => { const it = X.itemOf(d.key); const def = X.def(m);
        const oc = (def.opts || []).map(o => [o, o.choices.find(c => (c.fixed || []).includes(it) || (c.swap && c.swap[1] === it))]).find(x => x[1]);
        if (oc) { m.opts[oc[0].id] = oc[1].id; return; }
        if (!X.fixed(m).includes(it) && !(m.items || []).includes(d.key)) m.items.push(d.key); }); } });
    cur.forEach(m => { const def = X.def(m); def.ups.forEach(u => { nameForms(u.n).forEach(f => { if (rest.includes(" " + f + " ")) { m.ups[u.id] = true; hit = true; } }); }); });
    if (pick.fac === "court") GOETIC.forEach(p => { if (rest.includes(" " + impNorm(p.n).trim() + " ")) { cur.forEach(m => { (W.goetic[m.uid] = W.goetic[m.uid] || []).includes(p.id) || W.goetic[m.uid].push(p.id); }); hit = true; } });
    if (!hit && !mm && l.raw.length < 90 && !/^\s*[+-]?\d/.test(l.raw)) unmatched.push(l.raw);
  });
  W.name = name || "";
  return { W, pick, unmatched, models: created.length };
}

function companionPreview(raw, source, forced) {
  IMP.text = raw; IMP.source = source || "Import"; IMP.forced = forced || null;
  let res;
  try { res = impParse(raw, forced); } catch (e) { console.warn(e); toast("Couldn't read that roster."); return; }
  S.pendingImport = res.W;
  const W = res.W; const X = Ctx(W);
  const opts = impVariants().map((c, i) => '<option value="' + i + '" ' + (c.fac === res.pick.fac && (c.variant || null) === (res.pick.variant || null) ? "selected" : "") + ">" + esc(c.label) + "</option>").join("");
  let h = '<p class="typeline">Read from ' + esc(IMP.source) + ". Check the result, then create the warband. You can edit everything afterwards.</p>";
  h += '<div class="field"><label for="imp-name">Warband name</label><input type="text" id="imp-name" data-act="imp-name" value="' + esc(W.name) + '"></div>';
  h += '<div class="field"><label for="imp-fac">Faction</label><select id="imp-fac" data-act="imp-fac">' + opts + "</select></div>";
  if (W.fac === "court") h += '<div class="field"><label for="imp-sin">Deadly Sin</label><select id="imp-sin" data-act="imp-sin"><option value="">Choose…</option>' + SINS.map(s => "<option " + (W.sin === s ? "selected" : "") + ">" + s + "</option>").join("") + "</select></div>";
  h += '<div class="pk-cat">Models found (' + W.models.length + ")</div>";
  h += W.models.length ? W.models.map(m => { const ef = X.eff(m); const its = X.items(m).map(i => ITEMS[i].n); const ups = X.def(m).ups.filter(u => X.hasUp(m, u.id)).map(u => u.n);
      return '<div class="pk" style="grid-template-columns:1fr auto"><span><b>' + esc(m.name ? m.name + " · " : "") + esc(ef.name) + '</b><span class="st" style="display:block">' + esc(its.concat(ups).join(", ") || "No battlekit") + '</span></span><span class="pc">' + money(X.cost(m)) + "</span></div>"; }).join("")
    : '<p class="muted">No models recognised. Try choosing the faction above, or paste the text export instead.</p>';
  const t = X.totals();
  h += '<p class="typeline" style="margin-top:8px">Total ' + money(t) + "</p>";
  if (res.unmatched.length) h += '<details style="margin:8px 0"><summary class="muted">' + res.unmatched.length + " lines not used</summary><ul class=\"tiny muted\">" + res.unmatched.slice(0, 40).map(u => "<li>" + esc(u) + "</li>").join("") + "</ul></details>";
  h += '<div class="row" style="margin-top:12px"><button class="btn red" data-act="imp-create" ' + (W.models.length ? "" : "disabled") + ">Create warband</button></div>";
  openSheet("Import roster", h);
}
document.addEventListener("change", e => {
  const el = e.target; const a = el.dataset && el.dataset.act;
  if (a === "imp-fac") { const c = impVariants()[+el.value]; companionPreview(IMP.text, IMP.source, { fac: c.fac, variant: c.variant }); }
  else if (a === "imp-sin" && S.pendingImport) { S.pendingImport.sin = el.value || null; }
});
document.addEventListener("input", e => { const el = e.target; if (el.dataset && el.dataset.act === "imp-name" && S.pendingImport) S.pendingImport.name = el.value; });

</script>
