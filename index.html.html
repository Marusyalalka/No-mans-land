r takes a Dash ACTION.","Chewa":"Chewa: Add +1 DICE to the Success Roll for a Melee Attack made by a model with the Chewa ability for each other friendly model within 1” of the target, up to a maximum of +2 DICE.","Wings":"Wings: Change the Movement Characteristic of a model that has the Armour of the Fly to 8”/Flying. Sucked Dry: After a model that has the Armour of the Fly takes a Fight ACTION, it can immediately make an additional Melee Attack with +1 DICE to the roll. However, do not make an Injury Roll if this Melee Attack hits the target; instead place 1 BLOOD MARKER next to the target model.","Brave":"Brave: Add +1 DICE to the Success Rolls for a Morale Check for a Kingdom of Alba Assault Detachment Warband.","Slow":"Slow: Treat a Scripture Guardian as having a Movement Characteristic of 3”/Infantry when it takes a Dash ACTION.","Pin":"Pin: Enemy models that are Down and that are mounted on a base of 40mm or less are not allowed to stand up if a Lion of Jabir is within 1” of them (even if the Lion of Jabir is also Down). Keywords SUL TANATE, ARTIFICIAL","Philosophy, Poetry and Theology":"Philosophy, Poetry and Theology (20 👑 ): TheAlchemist is well-versed in the hidden truths of the Universe and of the Divine and has a calm and clearmind. Add +1 DICE to Morale Check Success Rolls for this Alchemist’s Warband, as long as the Alchemist is not Down or Out of Action. In addition, if this Alchemist’s Warband becomes Shaken, ignore the requirement that all Success Rolls become Risky Success Rolls (however you still need to see if the Warband flees in the following Turn’s Morale Phase). The Alchemist has the NEGATE FEAR Keyword.","Knight Companion of the Fly":"Knight Companion of the Fly (5 👑 ): Add +1 DICE to either the Ranged or the Melee Characteristic of this Plague Knight (you can choose which of the Characteristics to increase).","Cartography & Geometry":"Cartography & Geometry (20 👑 ): TheAlchemist has studied long and hard the sciences of cartography and Geometry. At the start of the game, before deployment, you can pick up to 2 models in the Warband that are mounted on a base of 32mm or less, giving them the INFIL TRATOR Keyword for that game.","Hallucinogen Disguise":"Hallucinogen Disguise (20 👑 ): If this Assassin is deployed using the INFIL TRATOR Keyword, it must be deployed at least 8” away from any enemy models but you may ignore any and all other restrictions that apply to deploying an INFIL TRATOR. For example, the model can be deployed in the Line of Sight of an enemy model, enemy Guard Dogs do not affect how it is deployed, and so on.","Thunderbolt of Alamut":"Thunderbolt of Alamut (20 👑 ): Add 2” to this Assassin’s Movement Characteristic, and add +1 DICE to the Risky Success Roll when this Assassin takes a Dash ACTION.","Terrifying Appearance":"T errifying Appearance (10 👑 ): The formula bestows an alluring beauty or horrifying visage upon the Homunculus. Give this Takwin Homunculus the FEAR Keyword.","Elemental Resistance":"Elemental Resistance (40 👑 ): Give this Takwin Homunculus the NEGATE FIRE and NEGATE GAS Keywords. In addition, add -1 INJURY DICE to Injury Rolls for attacks with the FIRE or GAS Keywords that target this Takwin Homunculus.","Chemistry & Alchemy":"Chemistry & Alchemy (25 👑 ): At the start of the first Turn of the game, before any models have been Activated, you can set up an Elemental Obstacle terrain piece that is up to 2” wide and 6” long anywhere on the battlefield. It must be set up more than 1” away from any other terrain pieces and more than 6” from any models. The Elemental Obstacle has the DIFFICUL T TERRAIN and DANGEROUS TERRAIN (X) Keywords. After setting it up, you must say if X is the FIRE, GAS, or SHRAPNEL Keyword. Warband Creation Special Rules Armoury Tables Battlekit Elite Warband Entries Troops Warband Entries Starting a Warband New Antioch Trench Pilgrims Heretic Legions Black Grail The Court Mercenaries Keywords Iron Sultanate Warband Variants Iron Sultanate-Trench Crusade 95","Regenerative Tissue":"Regenerative Tissue (25 👑 ): This Takwin Homunculus gains the REGENERATE 1 Keyword.","Secrets of Takwin":"Secrets of Takwin (20 👑 ): TheAlchemist has bound their Takwin creature to themselves with unbreakable bonds. If this Alchemist is hit by an attack while within 1” of their Takwin Homunculus, you can apply the hit to the Homunculus and make the Injury Roll for it instead of the Alchemist.","Janissary Officer":"Janissary Officers: A Defenders of the Iron W all Warband can have 0-2 Janissaries, which have the ELITE Keyword at no additional cost in 👑 .","Light Skirmisher":"Light Skirmishers: Any number of Azebs can have the SKIRMISHER Keyword at a cost of +5 👑 each. Keywords SUL TANATE Warband Creation Special Rules Armoury Tables Battlekit Elite Warband Entries Warband Variants Starting a Warband New Antioch Trench Pilgrims Heretic Legions Black Grail The Court Mercenaries Keywords Iron Sultanate Troops Warband Entries Iron Sultanate-Trench Crusade 85 0-2 Sultanate Sappers - Cost: 50 👑 The Sultan’s Sappers are valued specialists, holding the great cannons of the Iron Wall no matter what their enemies throw at them. They are easily identified by the terrible burns all over their bodies as their mighty artillery is prone to overheating. Movement Ranged Melee Armour Base 6”/Infantry +1 DICE +0 DICE 0 25mm Battlekit A Sultanate Sapper always has a Shovel (▶ see Battlekit in the Trench Crusade Digital Rulebook.) which cannot be removed or lost over the course of the campaign. They can also have any Battlekit from the Iron Sultanate Armoury Tables. Abilities","Assassin Acolyte":"Assassin Acolytes: Up to three Azeb models in a Fida’i of Alamut Warband can be given the INFIL TRATOR Keyword at a cost of +10 👑 each.","Inhuman Strength":"Inhuman Strength (15 👑 ): The musculature of the Homunculus is reinforced, replaced and strengthened. Give this Takwin Homunculus the STRONG Keyword, change its Melee Characteristic to +1 DICE, and increase its base size to 32mm.","Infested Carcass":"Infested Carcasses: Hounds of the Black Grail models can add the INFECTION MARKERS Keyword to their melee attacks at a cost of +5 👑 each.","Sacred Geometry":"Sacred Geometry | 10 👑 | Limit: 1 The monk is well-versed in geometries intended to make the viewer see the world through mathematics, granting a better understanding of the divine. Type Range Keywords Special - - Divine Accuracy: Add +1 DICE to the Ranged Characteristic of this Anchorite Shrine. Trench Mortar | 40 👑 A trench mortar is a smooth-bore, muzzle-loading weapon with high angles of fire. The shell contains both explosives and deadly Greek fire. Type Range Keywords 2-Handed 6”-36” +1 INJURY DICE, BLAST 3” , FIRE, HEAVY, IGNORES COVER, SCATTER High T rajectory: When a Trench Mortar is used to make a Ranged Attack, the target model (or target point, if targeting a point on the ground) cannot be within 6” of the attacking model. Note that if the attack Scatters it may end up landing within 6” of the attacking model. Wrathful Cherub Face | 20 👑 The Anchorite is decorated with an angelic face that is the very image of the wrath of the Lord. All must cower before the face of the Lord. Type Range Keywords Special - - Cower Before The Lord: An enemy model that does not have the FEAR keyword and that starts an Activation within 1” of this Anchorite Shrine must take a Retreat ACTION as part of the Activation. It cannot take any ACTIONS that require a Risky Success Roll while it is within 1” of this Anchorite Shrine. Warband Creation Special Rules Armoury Tables Battlekit Elite Warband Entries Troops Warband Entries Starting a Warband New Antioch Iron Sultanate Heretic Legions Black Grail The Court Mercenaries Keywords Trench Pilgrims Warband Variants Trench Pilgrims -Trench Crusade 68 MF Warband Creation Special Rules Armoury Tables Battlekit Elite Warband Entries Troops Warband Entries Warband Variants Starting a Warband New Antioch Iron Sultanate Heretic Legions Black Grail The Court Mercenaries Keywords Trench Pilgrims Trench Pilgrims -Trench Crusade 69 Cavalcade of the Tenth Plague This Trench Pilgrim Procession traditionally sacrifices lambs before battle, anointing themselves in its blood to ward off the wrath of God. They draw holy symbols with the blood upon their bodies, clothing and armour, and then march to battle singing hymns, in the certain belief that the blood of the lamb shields them from any harm. Firm believers in the traditional reading of the holy texts, they reject the new doctrines of the Meta-Christ by the Church. They steal Communicants from other Processions and force them to fight for them in penance for being born from sin. CAVALCADE OF THE TENTH PLAGUE SPECIAL RULES The following special rules apply to a Cavalcade of the T enth Plague Warband.","Gargantuan Size":"Gargantuan Size (20 👑 ): A Takwin Homunculus can only have this Alchemical Formula if it already has the Human Hands, Inhuman Strength, and Massive Size Alchemical Formulas. The Homunculus can use 1 Weapon that can usually only be taken by a Brazen Bull, and its base size is increased to 60mm.","Seal of Solomon":"Seal of Solomon (10 👑 ): This Formula greatly enhances the intelligence of the Homunculus and makes it painfully aware of its artificial existence. This Takwin Homunculus can have Equipment from the Iron Sultanate Armoury.","Startling Speed":"Startling Speed (10 👑 ): Add +1 DICE to the Risky Success Roll for this Takwin Homunculus when it takes a Dash ACTION.","Mirage of Time":"Mirage of Time (15 👑 ): Add -1 DICE to the Success Roll for attacks that target this Assassin. Warband Creation Special Rules Armoury Tables Battlekit Elite Warband Entries Troops Warband Entries Starting a Warband New Antioch Trench Pilgrims Heretic Legions Black Grail The Court Mercenaries Keywords Iron Sultanate Warband Variants Iron Sultanate-Trench Crusade 90","Additional Arm":"Additional Arm (15 👑 ): This Takwin Homunculus adds the CLEAVE 2 Keyword to attacks made with its Pummelling Blows Ability.","Plague Almoner":"Plague Almoner (10 👑 ): If you convert an Injury Roll into a Bloodbath Roll for an attack made by this Plague Knight, the cost in BLOOD MARKERS and/or INFECTION MARKERS of the Bloodbath Roll is reduced by 1.","Enslaved Mind":"Enslaved Mind (10 👑 ): Give this Takwin Homunculus and one other model in your Warband the FIRETEAM Keyword. The other model can only form a Fireteam with this Homunculus.","Hypnotic Eyes":"Hypnotic Eyes (15 👑 ): Add -1 DICE to rolls for Melee Attacks that target this Takwin Homunculus, unless the attack is made by a Sniper Priest or a model with the BLACK GRAIL Keyword. A Homunculus cannot have the Hypnotic Eyes Alchemical Formula if it has the Hawk Eyes Alchemical Formula unless it also has the T wo Heads Alchemical Formula.","Secret Paths":"Secret Paths (10 👑 ): At the start of the game, before deployment, you can say that this Assassin is using Secret Paths. If you do so, the Assassin is not deployed at the start of the game, and cannot be Activated in the first Turn of the game. Starting from the second Turn, you can Activate the Assassin using the Secret Paths. T o do so, deploy the Assassin in contact with any edge of the battlefield and more than 8” away from all enemy models. You can then carry on with the rest of its Activation normally.","Massive Size":"Massive Size (30 👑 ): The Homunculus’ size is increased into vast proportions. Give this Takwin Homunculus the TOUGH Keyword and increase its base size to 50mm. A Homunculus cannot have the Massive Size Alchemical Formula if it has the Wings Alchemical Formula.","Trench Mole":"Trench Moles: Trench Moles are scouts who use tunnels that criss-cross No Man’s Land to reach positions ahead of the main trench lines. Up to 2 Y eomen can be upgraded to Trench Moles with the INFIL TRATOR Keyword at a cost of +10 👑 each . You can include a 3rd Trench Mole in a Warband if the total cost of all of the other models in the Warband (including their Battlekit, etc) adds up to 1,000 👑 o r more. Keywords NEW ANTIOCH MF Warband Creation Special Rules Armoury Tables Battlekit New Antioch Elite Warband Entries Warband Variants Starting a Warband Trench Pilgrims Iron Sultanate Heretic Legions Black Grail The Court Mercenaries Keywords Troops Warband Entries 31 0-5 Shock Troopers - Cost: 45 👑 Highly trained in combined arms and fireteam tactics, these assault troops specialise in breaching enemy defences, and are masters of rapid assault and melee combat. Movement Ranged Melee Armour Base 6”/Infantry +0 DICE +1 DICE 0 25mm Battlekit A Shock T rooper can have any Battlekit from the New Antioch Armoury Tables. Abilities","Human Hands":"Human Hands (10 👑 ): This Takwin Homunculus can have Ranged and Melee Weapons from the Iron Sultanate Armoury. It can also have a Trench Shield or a Fire Shield. A Homunculus cannot have the Human Hands Alchemical Formula if it has the Wings Alchemical Formula. It cannot use its Pummelling Blows ability if it is armed with any Melee Weapons If a Takwin Homunculus with Human hands also has an Additional Arm, then it can have three 1-Handed Melee Weapons or one 1-Handed Melee Weapon and one 2-Handed Melee Weapon, and it can have three 1-Handed Ranged Weapons or one 1-Handed Ranged Weapon and one 2-Handed Ranged Weapon. If it takes a Shield, then the Shield replaces one of the Melee Weapons it can have but the Shield Combo rule cannot be used for any of its weapons. In addition, when it takes a Fight ACTION it can make 1 Melee Attack with each Melee Weapon that it has, one after the other. If it makes more than 1 attack, the Off-Hand Melee Modifier applies to the last Melee Attack that it makes. When it takes a Shoot ACTION it can make 1 Ranged Attack with up to two Ranged Weapons that it has, one after the other. Warband Creation Special Rules Armoury Tables Battlekit Elite Warband Entries Troops Warband Entries Starting a Warband New Antioch Trench Pilgrims Heretic Legions Black Grail The Court Mercenaries Keywords Iron Sultanate Warband Variants Iron Sultanate-Trench Crusade 97","Hawk Eyes":"Hawk Eyes (10 👑 ): The eyesight of the Homunculus is based on that of a predatory bird. Change the Ranged Characteristic of this Takwin Homunculus to +1 DICE. A Homunculus cannot have the Hawk Eyes Alchemical Formula if it has the Hypnotic Eyes Alchemical Formula unless it also has the T wo Heads Alchemical Formula.","Two Heads":"T wo Heads (5 👑 ): This Takwin Homunculus can have both the Hawk Eyes and Hypnotic Eyes Alchemical Formulas.","Medicine":"Medicine (15 👑 ): ThisAlchemist is a student of Ibn Sina’s School of Medicine. This Alchemist cannot have a Medi-kit. Instead, when you Activate this Alchemist it can take a School of Medicine ACTION as part of the Activation. If it does so, take a Success Roll for the Alchemist and add +1 DICE to the roll. If the roll is a Failure, nothing happens. If it is a Success or a Critical Success, you can do one of the following things: Remove 2 BLOOD MARKERS or 1 INFECTION MARKER from the Alchemist or a friendly model within 1” of the Alchemist. Stand up a friendly model that is Down and which is within 1” of the Alchemist.","Unarmed":"unarmed). Abilities Chattel: In a campaign, W retched can be sold in the Quartermaster Step for 25 👑 plu s half the cost in 👑 of any Battlekit they have.","Kavass":"Kavasses: Kavasses are sworn guardians of the House of Wisdom. You can change the Melee Characteristic of up to 3 Azebs in a House of Wisdom Warband from -1 DICE to +0 DICE at a cost of +5 👑 each . However, these Azebs lose the Light Skirmisher ability.","Gear":"gear, Limit: 2 2 ☼ Knighthood ELITE only, Limit: 1 4 ☼ Koraktor, the Great T ome of Hell Sorcerer only, Limit: 1 8 ☼ Lordship of This W orld Praetors & Sorcerers only, Limit: 1 9 ☼ Piece of Silver ELITE only, Limit: 1 12 ☼ Restraining Muzzle Y oke Fiends only, Limit: 33 1 ☼ Rocket-Propelled Grenade Consumable, Limit: 1 2 ☼ Trench Dog Limit: 1 1-3 ☼ 3. A Warband can have up to 3 Restraining Muzzles purchased with ☼ in addition to up to 3 Restaining Muzzles purchased with 👑 . VP Campaign Games Campaign Phase Patrons Trauma Step Exploration Step Promotions & Experience Step Quartermaster Step Reinforcements Step Glory Item Cartulary Introduction The World in Flames Core Rules Comprehensive Rules Keywords T errain Battlekit Campaign Rules Scenarios Glory Item Tables 128 Campaign Rules-Trench Crusade Glory Item Cartulary This section of the rules presents descriptions and rules for all of the Glory Items in the Glory Items Tables. These descriptions work in exactly the same way as they do for Battlekit in the standard Battlekit section of the rulebook (▶ see Battlekit). Armour of Cobar A suit of armour fashioned after the mail worn by Cobar the Betrayer, the first Lord of the Sixty-Six. This black iron armour is forged in the death-factories of Hell from the souls of those who betrayed their friends in life. It rewards those who lead their followers and friends to ruin and death. Type Range Keywords Armour - -3 INJURY MODIFIER Lead to Death: Place 1 BLESSING MARKER next to a model that has the Armour of Cobar each time a friendly model is taken Out of Action. Weight of Sins: Add -1 DICE to the Risky Success Roll for a model that has the Armour of Cobar that is taking a Dash ACTION. In addition, a model wearing the Armour of Cobar cannot have a Shield. Armour of the Fly This suit of armour, crafted from black metal, embodies the visage of Beelzebub himself. It includes wings that propel its wearer into the skies at astonishing speed, and once it latches onto its opponent, its filth-ridden proboscis will suck the target dry. Type Range Keywords Armour - -2 INJURY MODIFIER, FLYING, NEGATE SHRAPNEL Insect"};
Object.assign(BOOK_RULES.named, {"Vengeful Scripture ACTION":"Vengeful Scripture ACTION: The Scripture Guardian reads words from the holy (or unholy) text it carries. A Scripture Guardian can take a Vengeful Scripture ACTION. If they do so, pick 1 enemy model within 18” of the Scripture Guardian and in its Line of Sight. Then take a Success Roll for the Scripture Guardian, with +2 DICE if the enemy model is within 9” of the Scripture Guardian and +1 DICE otherwise. If the roll is a Failure, nothing happens. If the roll is a Success, make an Injury Roll for the enemy model, with a +1 INJURY MODIFIER for each BLOOD MARKER the enemy model has (in addition to any benefits you receive if you then spend them to affect the Injury Roll). If the roll is a Critical Success, make an Injury Roll for the enemy model with IGNORE ARMOUR, and +1 INJURY DICE and a +1 INJURY MODIFIER for each BLOOD MARKER the enemy model has.","Devour the Guilty ACTION":"Devour the Guilty ACTION: A Sin Eater can take a Devour the Guilty ACTION. If they do so, pick 1 model (friend or foe) that is within 1” of the Sin Eater and is mounted on a base that is 40mm or smaller. If the model is an enemy, take a Risky Success Roll for the Sin Eater. If the model is friendly, take a Success Roll for the Sin Eater with +1 DICE. If the roll is a Failure, the Sin Eater’s Activation ends, if it was a Risky Success Roll, and nothing happens if it was a normal Success Roll. If the roll is a Success or a Critical Success, the model you picked is devoured, and the following rules apply to it: Place the model to one side, along with any MARKERS it may have. It is inside the Sin Eater and cannot be affected in any way or carry out any ACTIONS except as described below. While it is in the Sin Eater it is considered to be Down for the purposes of Morale Checks. A Sin Eater can only have 1 devoured model at a time. When it is Activated, it can take a Fight ACTION and must target the Sin Eater. Add -3 DICE to the roll for the Melee Attack, and do not use any of the model’s abilities or any of the special rules for its weapons. If the Sin Eater is taken Out of Action, before removing them from the battlefield, deploy the devoured model within 1” of the Sin Eater and place it Down. If this is impossible, the model is taken Out of Action. In either case, the Sin Eater is then removed from the battlefield. If a devoured model is still inside a Sin Eater when the game ends, it is considered to have been taken Out of Action. Each time the Sin Eater is Activated, place 1 BLOOD MARKER next to the devoured model. As soon as a devoured model has 6 BLOOD MARKERS, it is immediately taken Out of Action (ignoring any rules that would prevent this) and is no longer considered to be inside the Sin Eater. A Sin Eater that has a devoured model inside it can take a Purge ACTION.If it does so, take a Success Roll for the Sin Eater with +4 DICE. If the roll is a Failure, nothing happens. If the roll is a Success or Critical Success, deploy the devoured model within 1” of the Sin Eater and place it Down. If this is impossible, the devoured model remains inside the Sin Eater. Once released the model can be Activated normally.","Elemental Change ACTION":"Elemental Change ACTION: A Jabirean Alchemist can take an Elemental Change ACTION. If they do so, take a Risky Success Roll for the model. If the roll is a Failure, nothing happens and the Jabirean Alchemist’s Activation ends. If the roll is a Success or a Critical Success, you can change the Master of the Elements Keyword on all of the Jabirean Alchemist’s Weapons to one of the other two choices.","Divine Judgement ACTION":"Divine Judgement ACTION: A Witchburner can take a Divine Judgement ACTION. If they do so, take a Risky Success Roll for the Witchburner. If the roll is a Failure, the Witchburner’s Activation ends. If the roll is a Success or a Critical Success, pick 1 enemy model within 24” of the Witchburner (no Line of Sight is required) and place 1 BLOOD MARKER next to them. If the enemy model has the BLACK GRAIL, DEMONIC, or HERETIC Keyword, place 2 BLOOD MARKERS next to it instead of 1.","Hold Your Fire! ACTION":"Hold Your Fire! ACTION: The Lieutenant orders their warband to stop shooting, forcing the enemy to move first. T o represent this, a Lieutenant can take a Hold Your Fire! ACTION. If they do so, pick 1 enemy model that is in the Lieutenant’s Line of Sight and that the opponent is allowed to Activate. The Lieutenant’s Activation then ends, and the opponent must Activate the model you picked.","The Communicant Cross":"The Communicant Cross: A sacred cross is nailed on the face of the Communicant. A Communicant counts as having the following pieces of Equipment at no cost in 👑 : Iron Capirote (Headgear); Gas Mask. It cannot be removed or lost for any reason.","Symphony of Slaughter":"Symphony of Slaughter: An Anchorite Shrine is armed with two 1-Handed Melee Weapons (the Catherine Wheel and Bonebreaker Mace). When it makes a Melee Attack, it can either attack once using either its Catherine Wheel or the Bonebreaker Mace, or twice, first with the Catherine Wheel and second with its Bonebreaker Mace (the Off- Hand Weapon modifier applies to the attack made with the Bonebreaker Mace).","Puppet Master ACTION":"Puppet Master ACTION: A Heretic Priest can take a Puppet Master ACTION. If they do so, take a Risky Success Roll for the model. If the roll is a Failure, the Heretic Priest’s Activation ends immediately. If the roll is a Success or Critical Success, pick 1 model (friend or foe) that is within 12” of the Heretic Priest and in their Line of Sight, apart from the Heretic Priest themselves. You can move the model D6” . The move must be in a straight line, but can be in any direction, and can be used to make the model move within 1” of an enemy, make a retreat move, Climb, Jump, or Jump Down. The model cannot make a Diving Charge and does not count as charging if it finishes the move within 1” of an enemy model.","Heretic Legionnaires":"Heretic Legionnaires: You can upgrade Heretic T roopers in your Warband to Heretic Legionnaires, at a cost of +10 👑👑 each. You cannot upgrade a Heretic T rooper if doing so would result in there being more Heretic Legionnaires in your Warband than there are Heretic T roopers. When you upgrade a Heretic T rooper to a Heretic Legionnaire, you can change either their Ranged Characteristic or their Melee Characteristic from 0 to +1.","Goetic Portal ACTION":"Goetic Portal ACTION: A Goetic W arlock can take a Goetic Portal ACTION. If they do so, take a Risky Success Roll for the Goetic W arlock with +1 DICE. If the roll is a Failure, the Goetic W arlock’s Activation ends. If the roll is a Success or Critical Success, you can pick up the Goetic W arlock and redeploy them on the battlefield anywhere within 6” of the location they originally occupied (measured from the centre of its base to the centre of its base). If this is impossible for any reason, the Goetic W arlock must stay in their original position. Note that the Goetic W arlock can redeploy even if they are down or within 1” of an enemy model (in which case the enemy model cannot make a Melee Attack before the Goetic W arlock is redeployed), and can redeploy within 1” of an enemy model. In addition, if the roll is a Success or Critical Success and the Goetic W arlock is within 1” of any enemy models mounted on a 32mm base or smaller, then the Goetic W arlock can take 1 of the enemy models with them. If they do so, you must redeploy the Goetic W arlock first and then redeploy the enemy model within 1” of the Goetic W arlock. If you cannot redeploy the enemy model within 1” of the Goetic W arlock, then the enemy model stays in its original position.","Voice of God ACTION":"Voice of God ACTION: An Observer can take a V oice of God ACTION. If they do so, take a Risky Success Roll for the Observer. If the roll is a Failure, the Observer’s Activation ends. If the roll is a Success or Critical Success, pick 1 model (friend or foe), anywhere on the battlefield, that has not been Activated this Turn. The Observer’s Activation then ends, and the other model’s Activation immediately begins.","Faithful Followers":"Faithful Followers: When you Activate a model within 1” of a Mendelist Ammo Monk, you can also Activate the Mendelist Monk if they have not yet been Activated during the Turn. If you do so, the two models can take their ACTIONS in any order you wish, and you can switch between the two models freely. If the Activation of either model ends (due to a failed Risky Success Roll, for example), the other model can carry on with its Activation normally.","Finish the Fallen":"Finish the Fallen: Due to their knowledge of anatomy and physiology, the Sisters are experts at inflicting debilitating injuries and excruciating pain. Add +1 INJURY DICE to Injury Rolls for Melee Attacks made by a Sister of Saint Cosmas if the target is Down and does not have the BLACK GRAIL or DEMONIC Keywords.","Forward Positions":"Forward Positions: When you deploy a Sultanate Sapper for the first time in a game, you must deploy them up to 6” away from your deployment zone and in contact with a terrain piece that is at least ½” high.","Maddening Buzzing":"Maddening Buzzing: Up to 1 Herald of Beelzebub model can have the Maddening Buzzing ability at a cost of +10 👑 . Success Rolls taken for enemy models within 8” of a model with this ability become Risky Success Rolls (there is no additional effect if they are Risky Success Rolls already).","Blessed Stigmata":"Blessed Stigmata: Each time you remove a BLOOD MARKER from a Stigmatic Nun because of the REGENERATE 1 Keyword, place 1 BLESSING MARKER next to the Stigmatic Nun.","Undead Fortitude":"Undead Fortitude: Add -1 INJURY DICE to Injury Rolls for a Hound of the Black Grail unless the attack has the FIRE Keyword.","Prize Specimens":"Prize Specimens: When a Combat Biologist takes any enemy model with the Keyword DEMONIC or BLACK GRAIL Out of Action with a Melee attack, place 1 BLESSING MARKER beside the Combat Biologist.","Zealot Strength":"Zealot Strength: Up to 1 Trench Pilgrim or Martyr Penitent can have the STRONG Keyword at a cost of +5 👑 . In addition, change the base size of the model to 32mm.","Fortify ACTION":"Fortify ACTION: A Sultanate Sapper can take a Fortify ACTION. If they do so, take a Risky Success Roll for the Sultanate Sapper. If the roll is a Failure, the Sultanate Sappers Activation ends. If the roll is a Success or a Critical Success, the Sultanate Sapper has the COVER Keyword until they move away from their current position.","Counter-Charge":"Counter-Charge: If the first ACTION a Janissary makes during their Activation is a Charge, add +1 DICE to Melee Attacks made by the Janissary for the rest of the Activation.","Trample ACTION":"T rample ACTION: A Brazen Bull can take a T rample ACTION. If it does so, it can make a Melee Attack that must target an enemy model that is Down. A T rample Melee Attack does not use a Melee Weapon and has the IGNORE ARMOUR Keyword.","Sworn Brethren":"Sworn Brethren: When you recruit a Mamluk Faris to your Warband, before adding it to your roster, you can say it will form a FIRETEAM with 1 other model from your Warband that has the ELITE Keyword. Both of the models gain the FIRETEAM Keyword. Note that the Mamluk Faris’s FIRETEAM is in addition to any other FIRETEAMS your Warband can have, and that if a Mamluk Faris is in a FIRETEAM with a model from a New Antioch Warband, then only the model from the New Antioch Warband can use the Concentrated Attack special rule.","Shock Charge":"Shock Charge: When you roll the Charge Bonus for a Shock T rooper, roll 1 extra D6 and use the single highest die to determine the bonus.","Memento Mori":"Memento Mori: The W ar Prophet is touched by a higher power, and the revealed truth allows them a degree of protection against premature death. The first time the W ar Prophet suffers an Out of Action result on the Injury Table, it is treated as a No Effect result instead. A W ar Prophet cannot have the TOUGH Keyword.","Unholy Hymns":"Unholy Hymns: Add -1 DICE to Success Rolls taken for enemy models that are within 8” of one or more Choristers.","Re-creation":"Re-creation: If a Takwin Homunculus is killed in the post-battle sequence, you do not have to remove it from your roster. Instead, you can spend 40 👑 i n the following Quartermaster Step to leave it on the Roster.","Hide ACTION":"Hide ACTION: A Death Commando can take a Hide ACTION if they are in contact with a terrain piece that is at least ½” high. If they do so, take a Risky Success Roll for the model and add +1 DICE to the roll. If the roll is a Failure, the Death Commando’s Activation ends immediately. If the roll is a Success or Critical Success, enemy models cannot choose the Death Commando as the target for a Ranged Attack or Charge until the Death Commando moves, charges, retreats, makes a Ranged Attack, or an enemy model moves within 1.5” of them. The Death Commando can be hit if they are within the blast radius of a Weapon with the BLAST Keyword.","Loping Dash":"Loping Dash: Add +1 DICE to the Risky Success Roll for a W ar W olf that is taking a Dash ACTION.","Law of Hell":"Law of Hell: If an attack made by a W retched takes an enemy model with the ELITE Keyword out of Action, the W retched model gains its freedom and is immediately removed from the game. It no longer counts as being part of the Warband for the purposes of Morale Checks, and is removed from the Warband Roster.","Unstoppable":"Unstoppable: Enemy models that are mounted on a base of 32mm or less are not allowed to make a Melee Attack when an Amalgam that is within 1” of them retreats. In addition, an Amalgam can take a Move or Charge ACTION if all enemy models within 1” of it are mounted on bases of 32mm or less.","Aim ACTION":"Aim ACTION: A Sniper Priest can take an Aim ACTION. If they do so, take a Risky Success Roll for the model and add +2 DICE to the roll. If the roll is a Failure, nothing happens and the Sniper Priest’s Activation ends. If the roll is a Success or Critical Success, for the rest of the Activation, add +2 DICE to the Success Rolls for Ranged Attacks that are made by the Sniper Priest.","Iron Fists":"Iron Fists: The flesh of a Communicant Anti-T ank Hunter is as hard as iron, which makes their fists deadly weapons in their own right. A Communicant Anti-T ank Hunter can make a Melee Attack with the CLEAVE 2 Keyword even though it does not have a Melee Weapon. In addition, the Off-Hand Weapon modifier applies to the second attack.","Mubarizun":"Mubarizun: A Y üzbaşı is expected to face the mightiest of their enemies in personal combat, inspiring the troops to victory with their personal prowess. Add +1 INJURY DICE for attacks made by a Y üzbaşı if the target model has the TOUGH Keyword.","Time Slip":"Time Slip: If your opponent fails their Success Roll for an attack targeting a Sultanate Assassin, you can say the Sultanate Assassin will slip into a moment in the future. If you do so, you can redeploy it anywhere within 6” of its original location (measured from the centre of its base to the centre of its base), and more than 1” away from any enemy models. If the failed attack took place because the Sultanate Assassin is retreating, the retreat move ends after you redeploy the model.","Mad Dash":"Mad Dash: Add +1 DICE to the Risky Success Roll for an Ecclesiastic Prisoner that is taking a Dash ACTION.","Levitate":"Levitate: You do not have to take a Risky Success Roll for an Artillery Witch when they Climb or Jump, or an Injury Roll if they Fall.","Torturer":"T orturer: When a Y oke Fiend makes a Melee Attack, it can target a friendly model that does not have the DEMONIC Keyword. If it does so, it cannot attack again during the same Activation.","Pin":"Pin: Enemy models that are Down and that are mounted on a base of 40mm or less are not allowed to stand up if a Lion of Jabir is within 1” of them (even if the Lion of Jabir is also Down).","Knight of the Rotten Cross":"Knight of the Rotten Cross (5 👑, Limit: 1): You can purchase 1 Ranged Weapon or 1 Melee Weapon from the New Antioch or Heretic Legions Armoury Tables for this model. Any stipulations that apply to the Weapon must be followed (so there is no point in taking a Weapon that can only be used by a specific model). The Weapon cannot be sold or reallocated in the Quartermaster Step of the Campaign Phase, but can be replaced if it is lost for any reason.","Chemistry & Alchemy":"Chemistry & Alchemy (25 👑 ): At the start of the first Turn of the game, before any models have been Activated, you can set up an Elemental Obstacle terrain piece that is up to 2” wide and 6” long anywhere on the battlefield. It must be set up more than 1” away from any other terrain pieces and more than 6” from any models. The Elemental Obstacle has the DIFFICUL T TERRAIN and DANGEROUS TERRAIN (X) Keywords. After setting it up, you must say if X is the FIRE, GAS, or SHRAPNEL Keyword.","Light Skirmisher":"Light Skirmishers: Any number of Azebs can have the SKIRMISHER Keyword at a cost of +5 👑👑 each.","Mirage of Time":"Mirage of Time (15 👑 ): Add -1 DICE to the Success Roll for attacks that target this Assassin.","Trench Mole":"Trench Moles: Trench Moles are scouts who use tunnels that criss-cross No Man’s Land to reach positions ahead of the main trench lines. Up to 2 Y eomen can be upgraded to Trench Moles with the INFIL TRATOR Keyword at a cost of +10 👑 each . You can include a 3rd Trench Mole in a Warband if the total cost of all of the other models in the Warband (including their Battlekit, etc) adds up to 1,000 👑 o r more.","Command Bereaved ACTION":"Command Bereaved ACTION: An Executor or Plague Knight in a Dirge of the Great Hegemon Warband can take a Command Bereaved ACTION. If it does so, you can remove any number of INFECTION MARKERS from enemy models. For each INFECTION MARKER you remove, you can then carry out one of the following Commands with a Bereaved (Grail Thrall or Fly Thrall) that is within 18” of the model taking the Command Bereaved ACTION. A Bereaved cannot be given more than 1 Command each Turn, but carrying out a Command does not stop it from also being Activated in the same Turn (before or after the Command was issued). Charge Command: The Bereaved carries out a charge move. Fight Command: The Bereaved carries out a Melee Attack. Move Command: The Bereaved carries out a Move (it cannot Charge or Retreat). Shoot Command: The Bereaved carries out a Ranged Attack.","Blessing of the Serpent Moon":"Blessing of the Serpent Moon | Spell (Cost 2/4/6) | Sorcerers Only: You can cast this spell before an Injury Roll is made for the spellcaster. If you do so, add a -1 INJURY MODIFIER to the roll for every 2 BLOOD MARKERS that were paid to cast the spell."});
FORMULAS.forEach(f => { delete BOOK_RULES.named[f[1]]; });
BOOK_RULES.itemRules = {"auto_rifle":"Focused Fire: When this Weapon is used to make 2 Ranged Attacks, the same enemy model must be the target of both attacks.","heavy_shotgun":"T ungsten-orichalcum Alloy Shot: Add +1 INJURY DICE to rolls for Ranged Attacks made by this Weapon at Short Range.","silenced_pistol":"Silent: Add +1 DICE to the roll if the attacker is in contact with a terrain piece that is at least ½” tall and that lies in between it and the target model.","sniper_rifle":"Bull's Eye: If the Success Roll for a Ranged Attack made with a Sniper Rifle is a Critical Success then the Injury Roll for the attack has the IGNORE ARMOUR Keyword.","smg":"Quick Bursts: A model armed with a Submachine Gun can take two Shoot ACTIONS during the same Activation, as long as the Submachine Gun is used to make both attacks. The Shoot ACTIONS can be taken one after the other, or other ACTIONS can be taken between the Shoot ACTIONS.","at_hammer":"Dangerous: Place 1 BLOOD MARKER next to the model using this Weapon if it makes a Melee Attack and the Success Roll is a Success or a Critical Success.","flail":"Unwieldy: The +1 DICE Keyword does not apply when this Weapon is used as an Off-Hand Weapon.","misericordia":"Despatch: This weapon has the IGNORE ARMOUR Keyword if the target is Down.","incendiary":"Liquid Fire: If the Success Roll for a Ranged Attack made with an Incendiary Grenade is a Critical Success then the Injury Roll for the attack has the IGNORE ARMOUR Keyword. Ranged Weapons","molotov":"Liquid Fire: If the Success Roll for a Ranged Attack made with a Molotov Cocktail is a Critical Success then the Injury Roll for the attack has the IGNORE ARMOUR Keyword.","satchel":"Heavy Explosive: Once during a game, a model with a Satchel Charge can use it to make a Ranged Attack. PW Ranged Weapons","binoculars":"Survey the Land: Enemy models cannot use the INFILTRATOR Keyword to deploy within 16” of a model with this Keyword unless they are in their own side's deployment zone.","blessed_icon":"Talisman: Once during a game, when a Risky Success Roll for a model with a Blessed Icon is a Failure, you can say that the model will use its T alisman. If you do, the model's Activation does not end. Ranged Weapons","field_shrine":"Site of Worship: After you deploy a model that has Field Shrine, you can also deploy their Field Shrine anywhere wholly within their deployment zone. In the Morale Phase, each friendly Field Shrine on the battlefield adds 3 to the number of models you have in your Warband that are not Down or Out of Action, up to a maximum bonus of 9 extra models. Once deployed, the model that had the Field Shrine is not considered to be carrying it for the rest of the game. T ear It Down!: Models can attack a Field Shrine as if it were an enemy model. If it is hit by an attack or is in the blast radius of an attack made with a Weapon that has the BLAST Keyword, it is removed from the battlefield and is removed from the Warband Roster (no Injury Roll is required).","soul_contract":"Fiery Exodus: If a model with a Hellbound Soul Contract is taken Out of Action, before removing it from the battlefield add 1 BLOOD MARKER to each enemy model that is within 1” of it. Models that have the NEGATE FIRE Keyword are not affected by this special rule.","martyrdom_pills":"Inured to Pain: When you deploy a model that has Martyrdom Pills you can say that they will consume them. If you do so, until the end of the game the model has the NEGATE FEAR Keyword. In addition, add -1 INJURY DICE to rolls for attacks that hit the model.","medikit":"T reat ACTION: A model with this Keyword can take a T reat ACTION. If it does so, take a Risky Success Roll for the model. If the roll is a Failure, the model's Activation ends immediately. If it is a Success or a Critical Success, you can do one of the following things: Remove 1 BLOOD MARKER from the model or a friendly model within 1” of the model. Stand up a friendly model that is Down and within 1” of the model.","mountaineer":"Ropes and Pitons: Add +1 DICE to Risky Success Rolls for friendly models with this special rule that are attempting to climb a sheer surface. Ranged Weapons","musical_instrument":"Fanfare: Add +1 DICE to Risky Success Rolls for friendly models that are taking a Dash ACTION and are within 4” of one or more models with a Musical Instrument.","shovel":"Dug In: A model equipped with a Shovel that starts the game on Open terrain has the COVER Keyword until it moves away from its starting position. In addition, a model equipped with a Shovel can use it as a 2-Handed Melee Weapon instead of using any other Melee Weapons it has.","unholy_trinket":"Talisman: Once during a game, when a Risky Success Roll for a model with an Unholy T rinket is a Failure, you can say that the model will use it. If you do, the model's Activation does not end. GD Ranged Weapons","eng_armour":"Ballistic Box Armour: Add -1 INJURY DICE to Injury Rolls for a model that has Engineer Body Armour that has been hit by an attack with the SHRAPNEL Keyword even if the attacking weapon has the IGNORE ARMOUR Keyword.","machine_armour":"Bulky: Change the base size of a model that has Machine Armour to 40mm unless it is already 40mm or larger. In addition, a model with Machine Armour cannot be equipped with a Trench Shield and has a Charge Bonus of D3” instead of D6”. Standfast: When a model that has Machine Armour suffers a Down result on the Injury table, it is treated as a Minor Hit result instead.","tank_splitter":"Melt Armour: When you make an Injury Roll for an attack made with a T ank- Splitter Sword, determine if the target has an Armour Characteristic that is -1 or greater, or if it is wearing Armour or carrying a Shield. If it does, before rolling the dice for the Success Roll, put one dice aside and turn it so that it shows a roll of '6'. Roll the rest of the dice, and then return the dice you put to one side; it counts as having rolled a 6. In addition, attacks made with a T ank-Splitter Sword are not affected by the Dragonslayer Patron Skill ( ▶ see Patrons in the Trench Crusade Digital Rulebook).","holy_smoke":"Chemical Incense: When you deploy a model that has Holy Smoke, you can say that they will consume it. If you do so, until the end of the game, the model has the NEGATE FEAR Keyword if it doesn't already have it, and -1 INJURY DICE is added to Injury Rolls for attacks that hit it.","shotel":"Bypass Shield: The Shotel is specifically designed to overcome enemy shields. Ignore -INJURY DICE or -INJURY MODIFIERS for Shields against Melee Attacks made with a Shotel. Any other Keywords or special rules that apply to the Shield are used normally.","holy_water":"Healing Waters: Add +1 DICE when a model with the Holy W ater of Lalibela takes a Success Roll for an ACTION that can remove BLOOD MARKERS and/or INFECTION MARKERS from another model or itself.","anfarro":"T oken of Honour: Add +1 DICE to the Melee Characteristic of a model with an Anfarro.","tabot":"Virtuous Rewards: Place 1 BLESSING MARKER next to a model that has a T abot each time that an ACTION carried out by a friendly model results in one or more BLOOD MARKERS and/or INFECTION MARKERS being removed from one or more friendly models.","punt_gun":"Overcharge: Before making a Ranged Attack with a model armed with a Punt Gun, you can say that the model will Overcharge the weapon. To do so, the model has to either have the STRONG Keyword or be in contact with a friendly model. An Overcharged Ranged Attack gains the BLAST 3” and RELOAD Keywords. After an Overcharged attack has been carried out, place 1 BLOOD MARKER next to the model that made the attack, and its activation immediately ends.","autocannon":"Full Auto: Each time you take a Shoot ACTION with an Autocannon, you must choose to either fire it using the Bursts Weapon Profile or the Full Auto Weapons Profile.","gas_censer":"Cloud of Gas: When you take a Shoot ACTION with this model, instead of making a Ranged Attack, you can unleash a cloud of gas. If you do so, do not make a Success Roll. Instead, all other models within 6” of the model using the Gas Censer are hit, and an Injury Roll must be made for each one. Note that the attack hits all models, friend or foe, apart from the model making the attack, regardless of Line of Sight.","trench_mortar":"High T rajectory: When a Trench Mortar is used to make a Ranged Attack, the target model (or target point, if targeting a point on the ground) cannot be within 6” of the attacking model. Note that if the attack Scatters it may end up landing within 6” of the attacking model.","grand_anchorite":"Impossible to Stop: Enemy models are not allowed to make a Melee Attack when a Grand Anchorite Shrine that is within 1” of them retreats. In addition, a Grand Anchorite Shrine can take a Move or Charge ACTION if it starts within 1” of any enemy models.","hallowed_anchorite":"Manifold Blessings: A Hallowed Anchorite Shrine can be promoted to ELITE status in the Promotions & Experience Step of the Campaign Phase (▶ see Campaign in the Trench Crusade Digital Rulebook).","holy_diesel":"Advanced Design: When you take a Dash ACTION with this Anchorite Shrine, you can choose to add +2 DICE to the Risky Success Roll. If you do so, you must place 1 BLOOD MARKER next to the model.","piston_legs":"Grind to Dust ACTION: This Anchorite Shrine can take a Grind to Dust ACTION. If it does so, it makes a Melee Attack but must target an enemy model within 1” that is Down and is mounted on a base that is 32mm or smaller. The attack does not use a Melee Weapon.","sacred_geometry":"Divine Accuracy: Add +1 DICE to the Ranged Characteristic of this Anchorite Shrine.","cherub_face":"Cower Before The Lord: An enemy model that does not have the FEAR keyword and that starts an Activation within 1” of this Anchorite Shrine must take a Retreat ACTION as part of the Activation. It cannot take any ACTIONS that require a Risky Success Roll while it is within 1” of this Anchorite Shrine.","sacrificial_lamb":"Warded by Blood: When you deploy a model that has a Sacrificial Lamb, you can say that they will sacrifice it and anoint themselves with its blood. If you do so, the first BLOOD MARKER placed on the model is ignored.","alch_ammo":"Guiding Path: Alchemical Ammunition can only be used with an Alaybozan, Halberd-Gun, Jezzail or Siege Jezzail (even though the Alaybozan has the SHRAPNEL Keyword). In a campaign, you cannot reallocate Alchemical Ammunition to another model.","alch_armour":"Protection From Harm: Add -1 INJURY DICE to Injury Rolls for attacks made by Weapons with the FIRE or GAS Keywords that target a model that has Alchemist Armour, even if the attacking weapon has the IGNORE ARMOUR Keyword.","assassin_dagger":"Slashing Attack: If an Assassin's Dagger causes at least one BLOOD MARKER to be placed next to the target model, the Assassin can use a Dash ACTION to Retreat in the same Activation. In addition, if the Assassin Retreats (by Dashing or using the normal Retreat ACTION) during the same Activation, enemy models within 1” cannot make a Melee Attack against it before it is moved as they would normally be able to do.","cloak_alamut":"Blend In: The Ranged Attack Modifier for a target being in Cover is -2 DICE instead of -1 DICE if the target has a Cloak of Alamut.","flame_cannon":"Greek Fire: When a Flame Cannon is used to make a Ranged Attack, do not make a Success Roll for the attack. Instead, measure a straight line 1mm wide and up to 12” long from the attacking model to a point on the ground or a model's base. The line stops if it reaches a terrain piece that is taller than the model making the Attack. Make an Injury Roll for every model (friend or foe) that is touched by the line, apart from the attacking model itself.","marid_shovel":"Industrial T ool: A Brazen Bull equipped with a Marid Shovel that starts the game on Open terrain has the COVER Keyword until it moves away from its starting position. In addition, a Brazen Bull equipped with a Marid Shovel can use it as if it were a Trench Club (▶ see Battlekit in the Trench Crusade Digital Rulebook).","murad":"Echoing Blast: If the Success Roll for a Ranged Attack with an M.U.R.A.D Bombard that targets an enemy model is a Success or a Critical Success, or if the attack is a Failure and the target point scatters onto a model's base, apply the effect of the DEADLY Keyword to the Injury Roll for that model. All other models caught in the M.U.R.A.D. Bombard's blast radius, or that are in the M.U.R.A.D. Bombard's blast radius if it did not hit the target model or scatter onto a model's base, are taken Down (do not make an Injury Roll for them).","anqa_bird":"Cause Confusion: Success Rolls taken for Melee Attacks that target a model with a Takwin Anqā Bird become Risky Success Rolls (there is no additional effect if they are Risky Success Rolls already). In addition, before an enemy model within 1” of a model with Takwin Anqā Bird makes a retreat, the opposing player must take a Risky Success Roll for the model. If the Roll is a Failure the enemy model cannot retreat and its Activation ends. If the Roll is a Success or a Critical Success, the enemy model can retreat normally.","wind_amulet":"Gusts of Wind: Once per game, when you Activate a model that has a Wind Amulet you may declare that it will use the amulet before it takes any ACTIONS. Using the Wind Amulet adds 3” to the model's Movement Characteristic for the rest of the Activation.","bow_alamut":"T emporal Slipstream: If a Ranged Attack made with this Weapon causes any BLOOD MARKERS to be placed on the target model, you can immediately redeploy the attacking model within 1” of the target model, regardless of the distance or any intervening obstacles. Note that if the attack takes the target Out of Action, no BLOOD MARKERS are placed and this ability cannot be used.","hashashin_leaf":"Enhanced Strength: When you deploy a model with a Hashashin Leaf for the first time in a game, you can say that the model will consume the Hashashin Leaf. If you do so, the model has the STRONG Keyword for the rest of the game.","elixir":"Fountain of Life: When deploying a model with an Elixir of Al-Khidr for the first time in a game, you can say that the model will consume the Elixir of Al-Khidr. If you do so, the model has the TOUGH Keyword for the rest of the game. An Elixir of Al- Khidr cannot be used by models with the ARTIFICIAL Keyword.","fire_shield":"Flame Repellent: Add -1 INJURY DICE to Injury Rolls for attacks with the FIRE Keyword that targets a model that has a Fire Shield, even if the attacking weapon has the IGNORE ARMOUR Keyword. DEFENDERS OF THE IRON W ALL Since assuming the throne in the year 1902, Sultan Malik, affectionately nicknamed the Lion Padishah by his troops, has demonstrated a more aggressive policy in waging the Great War. Though the Iron Wall endures continuous attacks as the forces of Shaitan ceaselessly test the Believer's defences, the Sultan refuses to engage in a war of mere resistance. The Sultanate has never relinquished its claim to the formerly Muslim lands lost to the Heretics, and as a result, regular troops are now deployed on offensive missions far more frequently than in the past, hardening raw recruits into veterans. When the Defenders of the Iron Wall advance into No Man's Land, they employ their unique art of war with precision. All warriors have been drilled relentlessly in marksmanship that takes advantage of elevated positions and using siege jezzails in two- man teams. These skills are honed into perfection, and it is almost impossible to dislodge these troops from a well-prepared high ground. Mighty Brazen Bulls form a lynchpin of defence in close quarters, and can push back even the greatest of enemy champions. The core of any such warband is often formed around the Sultanate Sappers, experts at demolition and mine-setting, and veterans of the bitter battles above and below the Wall. They are superb in the transportation and use of field artillery, erecting defensive positions at a speed that borders on supernatural. Their explosive charges disrupt enemy advances, whittling down attackers long before they reach the lines of Sultanate defenders, who wait to dispatch those remaining with ruthless efficiency.","anqa_guard":"An Anqā Guard is represented by a terrain piece that is about ½” high and which is mounted on a 40mm base. It is Impassable terrain. Pre-battle Deployment: After you deploy a model with an Anqā Guard, you can also deploy their Anqā Guard. If you do so, deploy the Anqā Guard anywhere wholly within your deployment zone. Once deployed, the model that had the Anqā Guard is not considered to be carrying it for the rest of the game. Combat Deployment ACTION: A model that has an Anqā Guard can take a Combat Deployment ACTION. If it does so, take a Risky Success Roll for the model and add +2 DICE to the roll. If the roll is a Failure, nothing happens and the model's Activation ends. If the roll is a Success or Critical Success, you can deploy the Anqā Guard within 1” of the model. Once deployed, the model that had the Anqā Guard is not considered to be carrying it for the rest of the game.","banner_desert":"Sandstorm: Models that start an Activation within 24” of an enemy model that has the Banner of Desert Wind have 1 subtracted from their Movement Characteristic until the end of the Activation. This rule does not apply if the model with the Banner of Desert Wind is Down.","explosive_charges":"Hidden Explosives: At the start of the game, after Deployment, you can say that a model that has Explosive Charges is going to plant them on the battlefield. If you do so, secretly write down their location on a piece of paper. The Explosive Charges must be planted on a terrain piece that measures up to 8” by 8”, is not fully or partially within the enemy deployment zone or within 1” of a model, and which is not a scenario objective that is worth any Victory Points. Detonating the Explosives: When you Activate a friendly model, before you carry out any ACTIONS you can say that the model is going to detonate any hidden explosives you set up at the start of the game. If you do so, show your opponent the piece of paper saying where the explosives are hidden, and then make an Injury Roll with the SHRAPNEL Keyword for each model (friend or foe) that is in on or in contact with the terrain piece. The terrain piece is then removed from the game. Models that were on top of the terrain piece Fall directly down to the battlefield, and an additional Injury Roll may have to be made for them if they Fall 3” or more.","kalkan":"Othismos: When a Brazen Bull that has an Iron W all Kalkan takes a Move ACTION (not a Dash or Charge) and is in contact with 1 enemy model that is mounted on a base of 40mm or less, then the Brazen Bull can use the Iron W all Kalkan to push the enemy model when it moves. The Brazen Bull must move in a straight line, directly towards the enemy model. The enemy model is pushed in front of the Brazen Bull as the Brazen Bull moves along. The move can also be used to push a model off a terrain piece, so that it Falls (▶ see Comprehensive Rules in the Trench Crusade Digital Rulebook). If the move pushes the enemy model into contact with another model, both the enemy model and the Brazen Bull must stop moving. If it pushes the enemy into contact with a terrain piece that is more than ½” high, the enemy model and the Brazen Bull must stop moving and an Injury Roll is made for the enemy model.","grand_cannon":"Mobile Grand Cannon: A Grand Cannon carried by a Brazen Bull is treated as a 1-Handed Ranged Weapon that uses the profile above for all rules purposes. If it is removed from the Brazen Bull for any reason, or if the Brazen Bull is removed from the Warband for any reason, then the Grand Cannon is lost (it cannot be fielded as a stationary gun battery). Deploying a Gun Battery: A Grand Cannon that is included in the Armoury on a Warband's roster as a gun battery is deployed in the same way as a unit when the Warband is deployed. Firing a Gun Battery: Each Grand Cannon gun battery can be used once per Turn by a friendly model that is within 1” of it, as long as both the friendly model and the Grand Cannon are not within 1” of an enemy model, and as long as the friendly model does not move as part of the same Activation. The friendly model must take a Shoot ACTION, and can then use the Grand Cannon as the Ranged Weapon for the attack using the profile above (if the model is an Alchemist, then its Mastery of the Elements ability will apply to the attack). Measure the range and check the Line of Sight using the Grand Cannon instead of the attacking model. In a campaign the Grand Cannon gun battery is assumed to have been returned to the Warband's Armoury at the end of the game, and will be available to be deployed in the Warband's next game. Unstoppable Object: If a model that has been hit by a Sultanate Grand Cannon is not taken Out of Action by the Injury Roll, it is pushed D6” in a straight line directly away from the attacking model. The model stops if it is pushed into another model, Impassable terrain or a terrain piece it cannot cross without having to Climb.","blasphemous_staff":"Evil Power: Add +1 DICE to Success Rolls or Risky Success Rolls for a model with a Blasphemous Staff, apart from the Success Rolls for a Ranged or Melee Attack, or the Risky Success Roll to take a Dash ACTION.","tartarus_claws":"Harrowing Assault: If the target is taken Down or Out of Action by a Melee Attack made with T artarus Claws, you can immediately move the model up to 3”. You can use this move to move within 1” another enemy model, and if you do so, this model can take another Fight ACTION. However, it cannot make the 3” move if the second attack takes the target Down or Out of Action. MM","gas_bombs":"Choking Gas: If a model that has been hit by a Gas Bomb is not taken Out of Action by the Injury Roll, it staggers D3” in a straight line trying to get away from the gas cloud. Roll separately for each model to see how far it staggers. If the model was the target of the attack, it staggers in a direction chosen by the player making the attack. If the model was caught in the Blast of the weapon, it staggers directly away from the target point. The model stops if it staggers into another model, Impassable terrain, or a terrain piece it cannot cross without having to Climb.","sarcophagus":"Walking Bomb: A model that has a Sarcophagus Mine cannot have any other Battlekit. A model with a Sarcophagus Mine can take a Trigger ACTION (▶ see below). In addition, if an enemy model finishes a move within 3” of a model with a Sarcophagus Mine, you can interrupt its Activation and detonate the Sarcophagus Mine without having to take a Trigger ACTION. Trigger ACTION: When a model with a Sarcophagus Mine takes a Trigger ACTION, you must take a Risky Success Roll for the model with +1 DICE. If the roll is a Failure, nothing happens (but you can try again the next time the model is Activated). If the roll is a Success or Critical Success, the Sarcophagus Mine detonates as described below. Detonation: When a Sarcophagus Mine detonates, all models (friend or foe) within 3” of the model carrying the Sarcophagus Mine and in its Line of Sight are hit by a Ranged Attack with the SHRAPNEL Keyword. Add +1 INJURY DICE to the Injury Rolls for models that are within 1” of the model carrying the Sarcophagus Mine. The model carrying the Sarcophagus Mine is then taken Out of Action.","tank_palanquin":"Bulky: A model that has a T ank Palanquin must be mounted on a 50mm base and cannot be equipped with a Shield. In addition, it has a Charge Bonus of D3” instead of D6”. Death From On High: Add 3” to the height of a model that has a T ank Palanquin when determining if it receives the Elevated Position modifier for any Ranged Attacks that it makes. Standfast: When a model that has a T ank Palanquin suffers a Down result on the Injury table, it is treated as a Minor Hit result instead.","coin_hammer":"Rune of Mammon: If the Injury Roll for an attack made by a Coin Hammer results in 1 or more BLOOD MARKERS being placed next to the target, place 1 BLESSING MARKER next to the model using the Coin Hammer.","golden_calf":"Illusions: Enemy models treat Open ground and all terrain within 3” of a model with a Golden Calf Altar or a Golden Calf Altar terrain piece as being Difficult terrain (if it is not already), even if they have the FLYING Keyword. Place Altar ACTION: A model with a Golden Calf Altar can take a Place Altar ACTION. If they do so, deploy the Golden Calf Altar anywhere within 1”of the model. Once deployed, the model that had the Golden Calf Altar is not considered to be carrying it for the rest of the game. In addition, the Golden Calf Altar is lost at the end of the game and removed from your Warband Roster.","standard_mammon":"Kneel Before Me: An enemy model that is Down and within 1” of a model with the Standard of Mammon cannot stand back up. In addition, the opposing player must take a Success Roll for any of their models that finish a charge within 1” of a model with the Standard of Mammon. If the roll is a Failure, the enemy model is marked as being Down. If the roll is a Success or a Critical Success, the enemy model stays on its feet.","tarnished_armour":"Target of Wrath: An enemy model must choose a model that has T arnished Armour as the target of the charge if the model is in its Line of Sight, not already within 1” of an enemy model, and can be reached without the charging model having to Climb, Jump, make a Diving Charge, or move across Dangerous terrain.","bg_shield":"Power of the Cult of the Black Grail: When a model with a Black Grail Shield is chosen as the target for a Ranged Attack, it will draw on the Power of the Black Grail before the Success Roll is made for the attack. T ake a Success Roll for the model with the Black Grail Shield. If the roll is a Failure, nothing happens and the attack is carried out as normal. If the roll is a Success, add -2 DICE to the roll for the Ranged Attack. If the roll is a Critical Success, the attack is automatically a Failure (do not make a Success Roll for the attack).","compound_eyes":"Enhanced Vision: Add +1 DICE to the Success Roll of Ranged Attacks taken for a model that has a Compound Eyes Helmet.","grail_devotee":"Grovelling Followers: Up to 2 models can have up to 2 Grail Devotees each. Add +1 INJURY MODIFIER to Injury Rolls for Melee attacks made by the model for each Grail Devotee that it has. Each Grail Devotee can be represented by a model if you wish. Place them adjacent to the model that they are following but note that Grail Devotees are not treated as models for any rules purposes, just move them out of the way if they get in the way of a “proper” model. Jealous Obsession: The Limit of 2 is the number of models that can have Grail Devotees; each model can have up to 2 Grail Devotees. The cost of the second Grail Devotee taken for a model is paid in ☼ instead of 👑. Grail Devotees cannot be reallocated unless the model that had them is removed from the Warband Roster.","parasite_gren":"T errifying Hallucinations: If a Parasite Grenade hits a target, after resolving the Injury Roll, you can move the target model 3”. The move must be in a straight line, but can be in any direction, and can be used to make the model move within 1” of an enemy, make a retreat move, Climb, Jump, or Jump Down. The model cannot make a Diving Charge and does not count as charging if it finishes the move within 1” of an enemy model.","viscera_cannon":"Self Sacrifice: If a Viscera Cannon hits a target, after resolving the Injury Roll, you can place up to 3 BLOOD MARKERS next to model that made the Attack (until it has a maximum of 6 markers). Then place 1 INFECTION MARKER next to the target for each BLOOD MARKER that you placed on the attacking model. GD","broken_crown":"Locus of Despair: Each time the model with the Broken Crown is Activated, before carrying out any ACTIONS with the model, place 1 INFECTION MARKER next to each enemy model within 1” of the model with the Broken Crown.","urn_ashes":"Sinister Whispers: Add -1 DICE to the roll for Ranged Attacks that target a model that has the Urn of Bitter Ashes or that is within 3” of the model with the Urn of Bitter Ashes.","arquebus":"Batter: A model that has an Arquebus can use it as a 2-Handed Melee Weapon.","crown_hellfire":"Searing Flames: When a model with a Crown of Hellfire ends an Activation, place 1 BLOOD MARKER next to each enemy model within 1” of the model with a Crown of Hellfire, except for enemy models that have the NEGATE FIRE Keyword.","headtaker":"Ambush Weapon: Add a +2 INJURY MODIFIER to rolls made for this weapon if the target has not yet been Activated this Turn.","ophidian_rifle":"Unnatural Inversion: Add +1 DICE to roll for attacks made with this weapon if the Cover or Long Range modifiers apply to the attack, instead of adding -1 DICE. Note that this means you add +2 DICE to the roll if both modifiers apply to the attack.","restraining_muzzle":"Brought to Heel: Add +1 DICE to rolls made for a Ranged Attack made by a Y oke Fiend that has a Restraining Muzzle. In addition, the Hateful ability does not apply to a Y oke Fiend that has a Restraining Muzzle.","torture_instrument":"Agonising Injuries: When you make an Injury Roll for an attack made with a Torture Instrument, roll 1D6 instead of 2D6, but then double the number of BLOOD MARKERS that are caused by the roll (if there are any). Any +INJURY DICE or -INJURY DICE that applied to the Injury Roll will apply normally, except that you pick the single highest or lowest dice in the roll instead of the 2 highest or lowest. Note that when you make a Bloodbath Roll for an attack made with a Torture Instrument, you only roll 2D6 instead of 3D6, but you can then double the number of BLOOD MARKERS that are caused by the roll.","bow_lethe":"Special Ammunition: Before making an Injury Roll for an attack made with a Bow of Lethe, you must choose if the roll will have the +2 INJURY DICE Keyword or the IGNORE ARMOUR Keyword.","vivisector":"Pain Amplifier: Lower the roll needed to achieve a Critical Success for a Melee Attack made by this weapon by 1 for each BLOOD MARKER next to the target (so an enemy with 1 BLOOD MARKER will suffer a Critical Success on a roll of 11+). Inflict Pain: If an attack made by this weapon against a target without the ARTIFICIAL Keyword and mounted on a 40mm base or smaller is a Critical Success, but the target is not taken Out of Action, then the target will move D3” in a straight line directly away from the attacking model. It will stop if it moves into a friendly model, Impassable terrain, a terrain piece it cannot cross without having to Climb, or immediately before it would move within 1” of an enemy model other than the attacker. If the target model would finish the move more than 1” from the attacking model, then the attacking model and any other models within 1” of the target model can make an additional Melee Attack on it before it is moved, as if the target were carrying out a retreat move. If this causes the model to move a second time, add D3” to the distance it is moved but do not attack it again. Mercenary","tenderiser":"Swinging Blow: When a model armed with a Tenderiser Maul takes a Fight ACTION, you can make 1 Melee Attack against each enemy model with 1” of the attacking model. Resolve each Melee Attack one at a time in the order of your choice.","gavel":"Found Guilty: After making the Injury Roll for a Gavel of Justice, place 1 extra BLOOD MARKER next to the target model (even if the Injury Roll has No Effect). If the target has the BLACK GRAIL, DEMONIC, or HERETIC Keyword, place 2 BLOOD MARKERS next to it instead of 1. Mercenary","battle_title":"Privileged Access: Pick 1 Weapon or suit of Armour from your Armoury Tables that has the Limit special rule. Note on your Warband Roster that the Limit is increased by 1. The increase will remain in place even if the model that has the Battlefield Title is removed from your Roster later during the campaign. You are encouraged to come up with a special title for the Weapon or Armour that you have gained access to.","book_prayers":"Continuous Litany of Prayers: A model that has the Book of Battle Prayers cannot take a Dash ACTION. Speak a Blessing ACTION: A model that has the Book of Battle Prayers can take a Speak a Blessing ACTION. If they do so, take a Success Roll for the model. If the roll is a Failure nothing happens. If the roll is a Success or Critical Success, you can place 1 BLESSING MARKER next to a friendly model that is within 12” of the model with the Book of Battle Prayers.","ducal_armour":"Myrmidon Wings: Change the Movement Characteristic of a model that has the Ducal Winged Armour to 10”/Flying. Steadfast: When a model that has Ducal Winged Armour suffers a Down result on the Injury table, it is treated as a Minor Hit result instead.","field_hospital":"Battlefield Surgery: A Field Hospital cannot be allocated to a model, but is added to your Arsenal. If your Warband also includes a Combat Medic, a Jabirean Alchemist, or a Sister of Saint Cosmas, at the end of the T rauma Step in the Campaign Phase you can use a Field Hospital to treat 1 model from your Warband that has 1 or more Battle Scars. If you do so, roll 2D6. On a roll of 7+ you can remove 1 of the model's Battle Scars; on a roll of 3-6 nothing happens; on a roll of 2 the model receives 1 extra Battle Scar.","great_banner":"Rally to the Flag: If a model with a Great Banner of New Antioch is on the battlefield when you take a Morale Check (even if they are Down), you can choose for the Morale Check to be a Success or for your Warband to flee.","knighthood":"Famous Deeds: At the end of each game, your Warband receives 1 ☼ for each model with a Knighthood that is on the battlefield.","resurrection_engine":"Holy Machine: A Resurrection Engine is not allocated to a model (just add it to your Arsenal instead). Once during the campaign, you can use the Resurrection Engine to change the result rolled on the T rauma T able to a Full Recovery result. The Resurrection Engine is Consumed when it is used.","rpg":"Disposable Rocket: A Rocket-Propelled Grenade can be used once during a campaign as a Ranged Weapon. If a model that has been hit by a Rocket- Propelled Grenade is not taken Out of Action by the Injury Roll, it is blown D6” in a straight line directly away from the attacking model. It stops if it is blown into another model, Impassable terrain or terrain it cannot cross without having to Climb.","salvage_golem":"Helpful Servitor: A Salvage Golem is not allocated to a model (just add it to your Arsenal instead). At the end of each game, your Warband receives an extra D6x5 👑 for each Salvage Golem it has in its Arsenal.","smokescreen":"Swathed in Smoke: At the start of a game, after deployment, if you have a model with a Smokescreen, you can say they will use it. If you do so, divide the battlefield into 4 equal quarters and say which one is swathed in smoke. Add -1 DICE to Ranged Attacks if the Line of Sight for the attack crosses any part of the quarter that is swathed in smoke.","sniper_scope":"Enhanced Accuracy: When this Glory Item is given to a model, you must choose 1 Ranged Weapon that the model already has and which has the word “Rifle” as part of its name. That Weapon gains the IGNORE LONG RANGE Keyword. A Sniper Scope cannot be reallocated during the Quartermaster Step.","trench_dog":"Loyal Hound: When you give a Trench Dog to a model, you can give the model and the Trench Dog the FIRETEAM Keyword at a Cost of +1 ☼. The Dogs of War: After you deploy a model with a Trench Dog, you can also deploy their Trench Dog. The Trench Dog is treated as if it were a model in the Warband, except that it is not counted as part of the Warband for the purposes of Morale Checks. If a Trench Dog is taken Out of Action, roll for its survival in the same way as you would for a Troops model. Trench Dogs cannot, of course, be Promoted. Special Training: When you give a Trench Dog to a model, you can give the Trench Dog one of the following special abilities at a Cost of +1 ☼. Guard Dog (not Black Grail or The Court): These dogs warn their masters of impending danger and fight fiercely for their company. Models cannot use the INFILTRATOR Keyword to deploy within 12” of an enemy Guard Dog. Hellhound (Fallen Warbands only): This horrifying infernal canine is the size of a small pony, and within its tortured belly rage the flames of Hell itself. It howls in constant agony and rage in combat. All Hellhounds gain the NEGATE FIRE Keyword. Attacks made by a Hellhound that is part of a Black Grail or Knights of Avarice Warband have the +1 DICE and GAS Keywords. Attacks made by a Hellhound that is part of any other Warband have the +1 DICE and FIRE Keywords. Martyrdom Dog (Trench Pilgrims only): Trench Pilgrims often enthusiastically strap their dogs with explosives so they can partake in a glorious martyrdom operation. A Martyrdom Dog has a Martyrdom Device and can trigger it like an Ecclesiastic Prisoner. Mercy Dog (New Antioch only): Mercy Dogs have and can use a Medi-kit (▶ see Medi-kit). In addition, when you move a Mercy Dog that starts the move in contact with a friendly model that is Down that is more than 1” from any enemy models, it can drag the friendly model along with itself. If it does so, halve the Mercy Dog's Movement Characteristic. A Mercy Dog cannot drag a friendly model when it retreats or charges. Trench Dog Profile — Movement: 8”/Infantry; Ranged: -; Melee: +0 DICE; Armour: 0; Base: 25mm. Battlekit: A Trench Dog cannot have any Battlekit. Four Paws: Add +1 DICE to Risky Success Rolls for a Trench Dog when they Climb, Jump or take a Dash ACTION. Pack Loyalty: A Trench Dog has the same Faction Keyword as the model that has it. For example, if the owner of a Trench Dog had the NEW ANTIOCH Faction Keyword, then the Trench Dog will have the NEW ANTIOCH Faction Keyword too. Teeth and Claws: A Trench Dog can make a Melee Attack even though it doesn’t have a Melee Weapon. Keywords: see the special training selected above.","holy_grenade":"Spirit of Vengeance: Add +1 INJURY DICE to rolls against models that have the BLACK GRAIL or DEMONIC Keyword.","horn_joshua":"Blow Thy Horn ACTION: A model with the Horn of Joshua can take a Blow Thy Horn ACTION. If they do so, take a Risky Success Roll for the model and add +1 DICE to the roll. If the roll is a Failure, nothing happens and the models Activation ends. If the roll is a Success or Critical Success, pick 1 terrain piece that is within 12” of the model with the Horn of Joshua and that measures up to 8” by 8”. Make an Injury Roll for each model (friend or foe) that is on or in contact with the terrain piece, and then remove the terrain piece from the game. Models that were on top of the terrain piece Fall directly down to the battlefield, and an additional Injury Roll may have to be made for them if they Fall 3” or more. Once a model has successfully taken a Blow Thy Horn ACTION, it cannot be used again in the same game.","damascus":"Inspiring Gift: A model that has a suit of Damascus Armour is not sent back home until they suffer their 4th Battle Scar. In addition, a suit of Damascus Armour cannot be removed from a model during a campaign unless the model wearing it has been killed or been declared Unfit for Duty.","masterwork_jezzail":"Enhanced Bullets: If the target of an attack made with a Masterwork Jezzail is within 1” of a friendly model, you do not have to roll a D6 to see if the friendly model is hit by the attack. In addition, if the Success Roll for an attack made with a Masterwork Jezzail is more than 7, after making the Injury Roll for the target, subtract 7 from the Success Roll. Then make an Injury Roll for the closest enemy model that is within this distance in inches of the target model and has a Line of Sight to it (no Success Roll is taken). For example, if you roll a 9 for the Success Roll, you could make an Injury Roll for a second enemy model that was within (9-7=) 2” of the target model and in its Line of Sight. Note that if the original attack was a Critical Success, you only add the extra INJURY DICE to the first Injury Roll; the extra dice do not apply to any subsequent models that are hit.","mobile_cannon":"Brazen Bull Grand Cannon: A Grand Cannon that is found as a Glory Item must be carried by a Brazen Bull and uses the profile above for all rules purposes. Unstoppable Object: If a model that has been hit by a Mobile Sultanate Grand Cannon is not taken Out of Action by the Injury Roll, it is pushed D6” in a straight line directly away from the attacking model. The model stops if it pushed into another model, Impassable terrain or a terrain piece it cannot cross without having to Climb.","armour_cobar":"Lead to Death: Place 1 BLESSING MARKER next to a model that has the Armour of Cobar each time a friendly model is taken Out of Action. Weight of Sins: Add -1 DICE to the Risky Success Roll for a model that has the Armour of Cobar that is taking a Dash ACTION. In addition, a model wearing the Armour of Cobar cannot have a Shield.","demonic_grenade":"Deadly Light: Double the number of BLOOD MARKERS placed next to a model by an Injury Roll for an attack made with a Demonic Aura Grenade. In addition, an Injury Roll is made for all models that are within 3” of the target point when the Demonic Aura Grenade explodes, even if interposing terrain blocks the line of sight.","mark_cain":"Retribution: If an ACTION taken by a model causes one or more BLOOD MARKERS to be placed next to a model with the Mark of Cain, then place an equal number of BLOOD MARKERS next to the model that took the ACTION.","tormentor_chain":"Dragged Forwards: If an attack made with a Tormentor Chain is a Su
