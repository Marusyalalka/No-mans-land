<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover"><style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style></head><body>
<title>Trench Warband Roster</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=EB+Garamond:ital,wght@0,400;0,500;0,600;0,700;1,400&family=UnifrakturMaguntia&display=swap">
<style>
/* Layout: single book-like column (max 760px), sticky top bar, model entries laid out like the Warband Entries pages */
:root{
  --paper:#fbfaf6; --page:#ffffff; --ink:#1f1b17; --muted:#6c645b; --red:#a8141c; --red-soft:#f6e7e5;
  --rule:#d8d2c8; --head:#ebe9e5; --chip:#f2efe9; --ok:#2f6b3a; --shadow:0 1px 0 rgba(0,0,0,.04),0 6px 24px rgba(40,20,10,.08);
  --fr:"UnifrakturMaguntia","Old English Text MT",serif; --serif:"EB Garamond",Garamond,"Times New Roman",serif;
  color-scheme:light;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --paper:#15120f; --page:#1d1915; --ink:#ece5d9; --muted:#a69c8f; --red:#e0524a; --red-soft:#3a1d1a;
  --rule:#3b342d; --head:#2a2520; --chip:#28231e; --ok:#7fbf8a; --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35); color-scheme:dark}}
:root[data-theme="dark"]{--paper:#15120f; --page:#1d1915; --ink:#ece5d9; --muted:#a69c8f; --red:#e0524a; --red-soft:#3a1d1a;
  --rule:#3b342d; --head:#2a2520; --chip:#28231e; --ok:#7fbf8a; --shadow:0 1px 0 rgba(0,0,0,.3),0 6px 24px rgba(0,0,0,.35); color-scheme:dark}
html,body{background:var(--paper)}
body{color:var(--ink);font-family:var(--serif);font-size:17px;line-height:1.4;-webkit-text-size-adjust:100%}
*{box-sizing:border-box}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--red);outline-offset:2px}
.fr{font-family:var(--fr);font-weight:400;color:var(--red);letter-spacing:.01em}
.wrap{max-width:760px;margin:0 auto;padding-inline:16px;padding-block:0 96px}
/* top bar */
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:20;background:color-mix(in srgb,var(--paper) 92%,transparent);backdrop-filter:blur(8px);border-bottom:1px solid var(--rule)}
.bar-in{max-width:760px;margin:0 auto;padding:10px 16px;display:flex;align-items:center;gap:12px}
.brand{font-family:var(--fr);color:var(--red);font-size:24px;line-height:1;flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis;background:none;border:0;padding:0;text-align:left}
.tabs{display:flex;gap:4px}
.tab{border:1px solid transparent;background:none;padding:6px 10px;border-radius:6px;color:var(--muted);font-weight:600;font-size:15px}
.tab[aria-current="true"]{color:var(--red);border-color:var(--rule);background:var(--page)}
/* generic */
h1.title{font-family:var(--fr);color:var(--red);font-weight:400;font-size:36px;line-height:1.05;margin:22px 0 4px;text-wrap:balance}
h2.sec{font-family:var(--fr);color:var(--red);font-weight:400;font-size:26px;margin:26px 0 8px;text-wrap:balance}
.sub{color:var(--muted);font-style:italic;margin:0 0 14px}
.btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--rule);background:var(--page);border-radius:8px;padding:9px 14px;font-weight:600;font-size:16px}
.btn.red{background:var(--red);color:#fff;border-color:var(--red)}
.btn.ghost{background:none}
.btn.sm{padding:5px 10px;font-size:14px;border-radius:6px}
.btn:disabled{opacity:.45;cursor:not-allowed}
.row{display:flex;gap:8px;flex-wrap:wrap;align-items:center}
.grow{flex:1;min-width:0}
.muted{color:var(--muted)}
.tiny{font-size:13px}
.num{font-variant-numeric:tabular-nums}
.coin{display:inline-block;width:.95em;height:.95em;vertical-align:-.12em;margin-left:2px}
.glory{color:var(--red);font-size:.95em;margin-left:2px}
hr.rule{border:0;border-top:1px solid var(--rule);margin:18px 0}
/* list */
.wb-list{display:grid;gap:10px;margin-top:12px}
.wb-card{display:grid;grid-template-columns:1fr auto;gap:4px 12px;text-align:left;border:1px solid var(--rule);background:var(--page);border-radius:10px;padding:14px 16px;box-shadow:var(--shadow)}
.wb-card .n{font-family:var(--fr);color:var(--red);font-size:24px;line-height:1.1}
.wb-card .f{color:var(--muted);font-style:italic;grid-column:1}
.wb-card .c{grid-row:1/3;grid-column:2;align-self:center;text-align:right;font-weight:600}
.empty{border:1px dashed var(--rule);border-radius:10px;padding:22px;text-align:center;color:var(--muted)}
.store-note{font-size:13px;color:var(--muted);margin-top:10px}
/* faction picker */
.fac-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(220px,1fr));gap:10px}
.fac{border:1px solid var(--rule);background:var(--page);border-radius:10px;padding:14px;text-align:left;display:flex;flex-direction:column;gap:6px}
.fac[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.fac .n{font-family:var(--fr);color:var(--red);font-size:22px;line-height:1.1}
.fac .al{font-size:12px;letter-spacing:.12em;text-transform:uppercase;color:var(--muted);font-weight:600}
.fac .b{font-size:15px;font-style:italic;color:var(--muted)}
.var-list{display:grid;gap:8px}
.var{display:flex;gap:10px;align-items:flex-start;border:1px solid var(--rule);background:var(--page);border-radius:8px;padding:10px 12px;text-align:left}
.var[aria-pressed="true"]{border-color:var(--red);box-shadow:inset 0 0 0 1px var(--red)}
.var .dot{width:16px;height:16px;border-radius:50%;border:2px solid var(--muted);flex:none;margin-top:3px}
.var[aria-pressed="true"] .dot{border-color:var(--red);background:radial-gradient(var(--red) 45%,transparent 50%)}
.var .n{font-weight:700}
.var .b{font-size:15px;color:var(--muted);font-style:italic}
.field{display:grid;gap:4px;margin:10px 0}
.field label{font-size:13px;letter-spacing:.1em;text-transform:uppercase;color:var(--muted);font-weight:600}
input[type=text],input[type=number],select,textarea{border:1px solid var(--rule);background:var(--page);border-radius:8px;padding:9px 10px;width:100%}
textarea{min-height:80px;resize:vertical}
/* warband header */
.wb-head{margin-top:16px}
.name-in{font-family:var(--fr);color:var(--red);font-size:34px;border:0;border-bottom:1px dashed var(--rule);border-radius:0;background:none;padding:2px 0;width:100%}
.name-in::placeholder{color:color-mix(in srgb,var(--red) 40%,transparent)}
.facline{color:var(--muted);font-style:italic;margin:4px 0 12px}
.stats{display:grid;grid-template-columns:repeat(4,1fr);border:1px solid var(--rule);border-radius:8px;overflow:hidden;background:var(--page)}
.stats div{padding:8px 10px;border-right:1px solid var(--rule)}
.stats div:last-child{border-right:0}
.stats .k{font-size:12px;letter-spacing:.1em;text-transform:uppercase;color:var(--red);font-weight:700}
.stats .v{font-size:20px;font-weight:600;font-variant-numeric:tabular-nums}
.stats .v.over{color:var(--red)}
.warn{margin:12px 0;border:1px solid var(--red);background:var(--red-soft);border-radius:8px;padding:10px 12px}
.warn b{color:var(--red)}
.warn ul{margin:4px 0 0;padding-left:20px}
.okmsg{margin:12px 0;color:var(--ok);font-weight:600}
.toolbar{display:flex;gap:8px;flex-wrap:wrap;margin:14px 0 4px}
/* model entry */
.grp{font-family:var(--fr);color:var(--red);font-size:24px;text-align:center;margin:28px 0 6px;display:flex;align-items:center;gap:10px}
.grp::before,.grp::after{content:"";flex:1;border-top:1px solid var(--rule)}
.entry{background:var(--page);border:1px solid var(--rule);border-radius:10px;padding:14px 14px 12px;margin:12px 0;box-shadow:var(--shadow)}
.entry.bad{border-color:var(--red)}
.e-top{display:flex;gap:10px;align-items:flex-start}
.e-name{font-family:var(--fr);color:var(--red);font-size:25px;line-height:1.1;margin:0}
.e-custom{border:0;border-bottom:1px dashed var(--rule);background:none;padding:2px 0;font-style:italic;width:100%;border-radius:0;font-size:16px}
.e-cost{font-weight:700;white-space:nowrap;text-align:right;font-variant-numeric:tabular-nums;font-size:18px}
.prof{width:100%;border-collapse:collapse;margin:10px 0 6px;font-variant-numeric:tabular-nums}
.prof th{background:var(--head);color:var(--red);text-align:left;font-weight:700;padding:4px 6px;font-size:14px}
.prof td{background:color-mix(in srgb,var(--head) 45%,transparent);padding:4px 6px;font-size:15px;border-top:1px solid var(--page)}
.tbl-wrap{overflow-x:auto}
.kv{display:grid;grid-template-columns:96px 1fr;gap:6px 12px;margin-top:8px;align-items:start}
.kv>.k{font-weight:700;padding-top:4px;font-size:15px}
.kv>.v{min-width:0}
.chips{display:flex;flex-wrap:wrap;gap:6px}
.chip{display:inline-flex;align-items:center;gap:4px;border:1px solid var(--rule);background:var(--chip);border-radius:999px;padding:3px 10px;font-size:15px;line-height:1.3;text-align:left}
.chip.kw{font-variant:small-caps;letter-spacing:.04em;text-transform:lowercase;font-size:16px;padding:1px 9px}
.chip.fixed{border-style:dashed}
.chip .x{border:0;background:none;color:var(--muted);padding:0 0 0 4px;font-size:16px;line-height:1}
.chip .cst{color:var(--muted);font-size:13px}
.abil{list-style:none;margin:0;padding:0;display:grid;gap:2px}
.abil button{border:0;background:none;padding:2px 0;color:var(--red);text-align:left;font-size:16px}
.abil button::before{content:"✠ ";font-size:12px;vertical-align:1px}
.opts{display:grid;gap:6px}
.up{display:flex;gap:8px;align-items:flex-start}
.up input{margin-top:5px;width:18px;height:18px;accent-color:var(--red);flex:none}
.up .info{border:0;background:none;color:var(--red);padding:0 2px;font-size:15px}
.e-actions{display:flex;gap:6px;flex-wrap:wrap;margin-top:12px;border-top:1px solid var(--rule);padding-top:10px}
.xptrack{display:flex;flex-wrap:wrap;gap:3px;margin:6px 0 0}
.xb{width:14px;height:14px;border:1.5px solid var(--muted,#777);border-radius:2px;display:inline-block;box-sizing:border-box}
.xb.adv{border-radius:50%;border-color:var(--red)}
.xb.on{background:var(--ink,#222);border-color:var(--ink,#222)}
.xb.adv.on{background:var(--red);border-color:var(--red)}
.xb.off{opacity:.25}
#hovertip{position:fixed;z-index:60;display:none;max-width:360px;background:var(--page);color:var(--ink);border:1px solid var(--rule);border-left:3px solid var(--red);border-radius:6px;box-shadow:var(--shadow);padding:10px 12px;pointer-events:none;font-size:15px}
#hovertip .ht-title{font-family:var(--fr);color:var(--red);font-size:20px;line-height:1.1;margin-bottom:4px}
#hovertip .rule-txt{margin:4px 0}#hovertip .prof{margin:2px 0}
.kwdefs{border-top:1px solid var(--rule);margin-top:6px;padding-top:2px;font-size:.94em}
.mw{color:var(--red);font-size:14px;margin:8px 0 0;padding-left:18px}
.addbar{position:fixed;left:0;right:0;bottom:0;z-index:15;background:color-mix(in srgb,var(--paper) 94%,transparent);backdrop-filter:blur(8px);border-top:1px solid var(--rule);padding:10px 16px calc(10px + env(safe-area-inset-bottom,0px))}
.addbar-in{max-width:760px;margin:0 auto;display:flex;gap:8px;align-items:center}
/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,10,5,.42);z-index:50;display:flex;align-items:flex-end;justify-content:center}
.sheet{background:var(--page);width:100%;max-width:640px;max-height:86vh;overflow:auto;border-radius:16px 16px 0 0;padding:6px 18px calc(22px + env(safe-area-inset-bottom,0px));box-shadow:0 -10px 40px rgba(0,0,0,.25)}
@media (min-width:700px){.scrim{align-items:center}.sheet{border-radius:14px;max-height:80vh}}
.sheet .grab{width:44px;height:5px;border-radius:3px;background:var(--rule);margin:6px auto 8px}
.sheet-h{display:flex;align-items:flex-start;gap:10px;position:sticky;top:-6px;background:var(--page);padding:6px 0 8px;z-index:2}
.sheet-h h3{font-family:var(--fr);color:var(--red);font-weight:400;font-size:28px;line-height:1.05;margin:0;flex:1;text-wrap:balance}
.close{border:1px solid var(--rule);background:var(--page);border-radius:50%;width:34px;height:34px;font-size:20px;line-height:1;flex:none}
.typeline{color:var(--muted);font-style:italic;margin:0 0 8px}
.rule-txt{margin:6px 0;font-size:17px}
.rule-txt .lk{border:0;background:none;padding:0;color:var(--red);font-variant:small-caps;text-transform:lowercase;letter-spacing:.03em;font-size:17px;text-decoration:underline dotted;text-underline-offset:3px}
.crumbs{display:flex;gap:6px;margin:0 0 6px}
/* picker */
.pk-cat{font-family:var(--fr);color:var(--red);font-size:21px;margin:16px 0 4px}
.pk{display:grid;grid-template-columns:1fr auto auto;gap:4px 10px;align-items:center;padding:7px 0;border-top:1px solid var(--rule)}
.pk .nm{border:0;background:none;padding:0;text-align:left;font-size:16px;font-weight:600;color:var(--ink)}
.pk .nm:hover{color:var(--red)}
.pk .st{grid-column:1;font-size:13px;color:var(--muted)}
.pk .pc{font-weight:600;font-variant-numeric:tabular-nums;white-space:nowrap;grid-row:1;grid-column:2}
.pk .ad{grid-row:1/3;grid-column:3}
.pk .why{grid-column:1/-1;font-size:13px;color:var(--red)}
.pk.has .nm::after{content:" ✓";color:var(--ok)}
.addrow{display:grid;grid-template-columns:1fr auto;gap:2px 10px;padding:10px 0;border-top:1px solid var(--rule);text-align:left;width:100%;border-left:0;border-right:0;border-bottom:0;background:none}
.addrow:disabled{opacity:.45}
.addrow .n{font-weight:700;font-size:17px}
.addrow .p{font-size:14px;color:var(--muted);font-variant-numeric:tabular-nums}
.addrow .c{grid-row:1/3;grid-column:2;align-self:center;font-weight:600;text-align:right}
/* rules view */
.search{position:sticky;top:calc(env(safe-area-inset-top,0px) + 56px);z-index:5;background:var(--paper);padding:8px 0}
.gl-item{display:block;width:100%;text-align:left;border:0;border-top:1px solid var(--rule);background:none;padding:9px 2px}
.gl-item .n{font-weight:700}
.gl-item .s{display:block;font-size:14px;color:var(--muted);white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.confirm{color:var(--red)}
.toast{position:fixed;left:50%;transform:translateX(-50%);bottom:calc(84px + env(safe-area-inset-bottom,0px));background:var(--ink);color:var(--page);padding:8px 14px;border-radius:8px;z-index:60;font-size:15px}
.foot{margin-top:40px;font-size:13px;color:var(--muted);text-align:center}
@media (max-width:480px){.stats{grid-template-columns:repeat(2,1fr)}.stats div:nth-child(2){border-right:0}.stats div:nth-child(-n+2){border-bottom:1px solid var(--rule)}
  .kv{grid-template-columns:1fr;gap:2px}.prof .dw{display:none}.prof th,.prof td{font-size:14px;padding:4px 5px}.kv>.k{padding-top:6px}.e-name{font-size:23px}h1.title{font-size:30px}.name-in{font-size:28px}}
@media (prefers-reduced-motion:no-preference){.sheet{animation:up .18s ease-out}@keyframes up{from{transform:translateY(24px);opacity:.6}to{transform:none;opacity:1}}}
</style>

<div class="bar"><div class="bar-in">
  <button class="brand" data-act="home" aria-label="Warband list">Warband Roster</button>
  <nav class="tabs">
    <button class="tab" data-act="home" id="tab-home">Warbands</button>
    <button class="tab" data-act="rules" id="tab-rules">Rules</button>
  </nav>
</div></div>
<main class="wrap" id="app"></main>
<div id="addbar"></div>
<div id="sheet-root"></div>
<div id="toast-root"></div>

<script>
// ---------- KEYWORDS (book-checked mechanical wording) ----------
const KEYWORDS = {
  "+/- DICE": "Adds dice to Success Rolls. Roll 2 dice plus the extra ones and keep the 2 best (for +) or the 2 worst (for -). On a weapon it only affects attacks made with that weapon.",
  "+/- INJURY DICE": "Same as +/- DICE but for Injury Rolls. On a weapon it only affects Injury Rolls from that weapon.",
  "+/- INJURY MODIFIER": "A flat number added to or subtracted from the Injury Roll total after the dice are picked. Total negative modifiers can never exceed -3.",
  "ACTION": "Something a model does when activated (Move, Dash, Shoot, Fight, plus special actions). Each kind of action can normally be taken once per activation.",
  "AMMUNITION": "Special ammo assigned to one ranged weapon when the model deploys; that weapon gains the listed keyword for the game. Can't go on BLAST, FIRE, GAS or SHRAPNEL weapons, and only one ammo type per weapon.",
  "ARMOUR PIERCING": "Reduces the target's total armour/shield injury modifier by 1 (never below 0).",
  "ARTIFICIAL": "Tag: the model is a construct, not a living creature.",
  "ASSAULT": "Shooting with this weapon does not stop the model from also charging or fighting in the same activation.",
  "AUTOMATIC": "AUTOMATIC (X): one Shoot action makes X separate attacks. Targets may differ but must be within 6\" of each other. Markers spent only affect the attack they are spent on.",
  "BLACK GRAIL": "Tag: member of the Cult of the Black Grail.",
  "BLAST": "BLAST (X\"): target a model or a visible point. On a hit, everything within X\" of that point that can see it is hit, plus your own models within 1\" of a hit enemy. Critical bonus applies only to the chosen target.",
  "BLESSED": "BLESSED (X): the model starts each game with X Blessing Markers.",
  "BLESSING MARKER": "A beneficial marker. Spend one for +1 DICE on the model's Success Roll, or for -1 INJURY DICE on an Injury Roll against it. Max 6 per model.",
  "BLOCK": "Melee attacks against this model (or its weapon's wielder) get -1 DICE if the attacker charged this turn.",
  "BLOOD MARKER": "A wound marker. The opponent may spend them for -1 DICE on this model's Success Rolls or +1 INJURY DICE against it; 6 (or 3 if Down) convert an Injury Roll to a Bloodbath (3D6). Max 6 per model.",
  "CLEAVE": "CLEAVE (X): one Fight action with this weapon makes X separate melee attacks, at the same or different targets.",
  "CONSUMABLE": "In a campaign the item is lost after the game in which it was used.",
  "COVER": "The model always counts as being in cover (ranged -1 DICE, or the Defended Obstacle penalty in melee).",
  "CRITICAL": "A Critical Success (12+) with this weapon adds +2 INJURY DICE instead of +1.",
  "CUMBERSOME": "Always needs two hands, even for a STRONG model. Can still be paired with a Shield Combo shield.",
  "DANGEROUS TERRAIN": "Entering or activating in it forces a Risky Success Roll. Fail and the model takes an Injury Roll and its activation ends.",
  "DEADLY": "Injury Rolls for this attack use 3D6 added together (keep the best/worst 3 when extra dice apply).",
  "DEMONIC": "A model with this Keyword has the NEGATE FIRE Keyword.",
  "DEPLOYABLE": "Battlekit represented by its own model or terrain piece that is set up during the game.",
  "DIFFICULT TERRAIN": "Every inch moved through it costs 2\".",
  "ELITE": "Tag: the most senior and heroic models in a Warband. A Warband can never include more than 6 models with the ELITE Keyword. This limit applies at all times, including recruited models, Mercenaries and models promoted during a campaign.",
  "FEAR": "Melee attacks against this model get -1 DICE. A model with FEAR ignores FEAR on others.",
  "FIRE": "After the Injury Roll, add 1 extra Blood Marker to the target even if the roll had no effect.",
  "FIRETEAM": "Two models linked in a fireteam may be activated together, taking actions in any order. If either one's activation ends, both end.",
  "FLAMETHROWER": "Ranged attacks hit automatically (no Success Roll, so no criticals).",
  "FLYING": "Moves are measured through the air; must end on the ground or a terrain piece. No Injury Roll when falling. Dangerous terrain still requires a Risky roll.",
  "GAS": "After the Injury Roll, add 1 extra Blood Marker to the target even if the roll had no effect.",
  "GOLEM": "Out of Action becomes Down unless it came from a Bloodbath. You can't remove your own Blood Markers from it. Has NEGATE FEAR and NEGATE GAS, can't be TOUGH.",
  "HEAVY": "Max one HEAVY item per model, and no charge bonus. A HEAVY ranged weapon or grenade can't be fired in an activation where the model moved, charged, retreated or dashed.",
  "HELD": "Takes a hand and can't be put down: the model can only use a 1-handed weapon or a shield alongside it, never a 2-handed weapon or weapon + shield. Grenades are fine.",
  "HERETIC": "Tag: member of the Heretic Legions.",
  "IGNORE ARMOUR": "The attack ignores the target's armour characteristic and armour/shield injury modifiers.",
  "IGNORE": "IGNORE [modifier]: the named roll modifier (Cover, Long Range, Off-Hand, etc.) does not apply.",
  "IMPASSABLE TERRAIN": "Models can't move onto or through it.",
  "IMPERVIOUS": "This armour/shield keeps its protection against ARMOUR PIERCING and IGNORE ARMOUR.",
  "INFECTION MARKERS": "Black Grail markers: used like Blood Markers, but a model with any adds one more each time it activates. Normal healing can't remove them.",
  "INFILTRATOR": "May deploy anywhere out of sight of all enemies and at least 8\" from them, after other models are set up.",
  "LEADER": "+1 DICE to the warband's Morale Checks while at least one LEADER is on the table and not Down.",
  "MINED": "Moving into contact detonates it: Injury Roll with SHRAPNEL, then the mine is gone. FLYING models only trigger it by ending a move on it.",
  "NEGATE": "NEGATE [keyword]: the model is unaffected by that keyword's effect.",
  "NEW ANTIOCH": "Tag: member of the Principality of New Antioch.",
  "PILGRIM": "Tag: member of the Trench Pilgrims.",
  "PISTOL": "Usable as ranged or melee weapon, even both in one activation. In melee it may use the Ranged or Melee characteristic and can be the off-hand weapon.",
  "RELOAD": "The model's activation ends after the action in which it attacked with this weapon.",

<script>
// Variant patches. apply(F) mutates a deep clone of the base faction.
const VARIANTS = {};
function V(o) { VARIANTS[o.id] = o; }

const dropModel = (F, ...ids) => { F.models = F.models.filter(m => !ids.includes(m.id)); };

        W.models.forEach(md => X.items(md).forEach(i => { if (itemCat(i) === "ranged" && ITEMS[i].k.includes("HEAVY")) out.push("Charge and Rend: no HEAVY ranged weapons (" + ITEMS[i].n + ")."); }));

<script>
// ================= ENGINE =================
const HEADGEAR = new Set(["combat_helmet","iron_capirote","anfarro","compound_eyes"]);
const CATS = ["ranged","melee","grenade","shield","armour","equipment"];
const CAT_LABEL = { ranged:"Ranged Weapons", melee:"Melee Weapons", grenade:"Grenades", shield:"Shields", armour:"Armour", equipment:"Equipment" };
const FAC = id => FACTIONS.find(f => f.id === id);
const _facCache = {};

function buildFaction(facId, variantId) {
  const key = facId + "|" + (variantId || "");
  if (_facCache[key]) return _facCache[key];
  const base = FAC(facId);
  const F = JSON.parse(JSON.stringify(base));
  F.validate = []; F.variant = null; F.foreign = []; F.mercBan = []; F.noKeywords = []; F.mercOverride = {};
  F.budget = { d: 700, g: 0 };
  if (variantId && VARIANTS[variantId]) {
    const v = VARIANTS[variantId];
    F.variant = v; v.apply(F);
    if (v.budget) F.budget = Object.assign({}, v.budget);
    if (v.coldSteel) F.coldSteel = true;
  }
  F.models.forEach(m => { m.ups = m.ups || []; m.opts = m.opts || []; m.kit = m.kit || {}; m.ab = m.ab || []; });
  _facCache[key] = F;
  return F;
}

function itemCat(itemId) {
  const it = ITEMS[itemId];
  if (!it) return "equipment";
  if (it.t === "GR") return "grenade";
  if (it.t === "SH") return "shield";
  if (it.t === "AR") return "armour";
  if (it.t === "EQ") return "equipment";
  if (it.t === "SP") return it.r === "Melee" ? "melee" : "equipment";
  if (/^Melee/.test(it.r)) return "melee";
  return "ranged";
}
function hands(itemId) { const t = ITEMS[itemId] && ITEMS[itemId].t; return t === "2H" ? 2 : t === "1H" ? 1 : 0; }

function newUid() { return Math.random().toString(36).slice(2, 10); }

// Context over a warband
function Ctx(W) {
  const F = buildFaction(W.fac, W.variant);
  const X = { W, F };
  X.def = m => {
    if (m.merc) {
      const d = MERCS.find(x => x.id === m.type);
      if (!d) return null;
      const o = F.mercOverride[m.type];
      return o ? Object.assign({}, d, o) : d;
    }
    return F.models.find(x => x.id === m.type) || null;
  };
  X.camp = !!(W.camp && W.camp.on);
  X.ledger = X.camp && !W.camp.manual;
  X.hasSkill = id => X.camp && W.models.some(m => m.camp && (m.camp.skills || []).includes(id));
  X.injured = (m, id) => X.camp && m.camp && (m.camp.inj || []).includes(id);
  X.eliteCount = () => W.models.filter(m => X.def(m) && X.eff(m).elite).length;
  X.promotionEliteCount = () => W.models.filter(m => X.def(m) && X.eff(m).elite && !(X.camp && m.camp && (m.camp.skills || []).includes("bad_company"))).length;
  X.glory = () => (typeof gloryEntries === "function" ? gloryEntries(F, W.fac, W.variant) : []);
  X.entry = key => {
    if (key.startsWith("g:")) return X.glory().find(e => e.key === key) || null;
    if (key.includes("/")) { const [fac, item] = key.split("/"); const e = FAC(fac).armoury.find(a => a.item === item); return e ? Object.assign({}, e, { foreign: fac }) : null; }
    return F.armoury.find(a => a.item === key) || null;
  };
  X.itemOf = key => key.startsWith("g:") ? key.slice(2) : key.includes("/") ? key.split("/")[1] : key;
  X.optChoice = (m, def, o) => { const id = (m.opts || {})[o.id]; return o.choices.find(c => c.id === id) || o.choices[0]; };
  X.fixed = m => {
    const def = X.def(m); if (!def) return [];
    let f = (def.kit.fixed || []).slice();
    def.opts.forEach(o => { const c = X.optChoice(m, def, o); if (c.fixed) f = f.concat(c.fixed); if (c.swap) f = f.map(i => i === c.swap[0] ? c.swap[1] : i); });
    def.ups.forEach(u => { if (m.ups && m.ups[u.id] && u.item) f.push(u.item); });
    return f;
  };
  X.bought = m => (m.items || []).map(X.itemOf);
  X.items = m => X.fixed(m).concat(X.bought(m));
  X.hasUp = (m, id) => !!(m.ups && m.ups[id]);
  X.eff = m => {
    const def = X.def(m);
    const e = { name: def.n, mv: def.mv, r: def.r, m: def.m, a: def.a, base: def.base, kw: def.kw.slice(), ab: def.ab.slice(), elite: !!def.elite || def.kw.includes("ELITE") || !!m.promoted };
    def.opts.forEach(o => { const c = X.optChoice(m, def, o);
      if (c.set) Object.assign(e, c.set); if (c.rename) e.name = c.rename; if (c.addKw) e.kw.push(...c.addKw);
      if (c.ab) e.ab.push(...c.ab); if (c.dropAb) e.ab = e.ab.filter(a => !c.dropAb.includes(a[0])); });
    def.ups.forEach(u => { if (!X.hasUp(m, u.id)) return;
      if (u.kw) u.kw.forEach(k => { if (!e.kw.includes(k)) e.kw.push(k); });
      if (u.set) Object.assign(e, u.set); if (u.base && parseInt(u.base) > parseInt(e.base)) e.base = u.base; if (u.ab) e.ab.push(...u.ab); if (u.dropAb) e.ab = e.ab.filter(a => !u.dropAb.includes(a[0])); if (u.elite) e.elite = true; });
    ((W.goetic && W.goetic[m.uid]) || []).forEach(pid => { const p = (typeof GOETIC !== "undefined") && GOETIC.find(x => x.id === pid); if (!p) return;
      (p.kw || []).forEach(k => { if (!e.kw.includes(k)) e.kw.push(k); }); (p.dropKw || []).forEach(k => { e.kw = e.kw.filter(x => x !== k); }); });
    const dog = m.dog && X.bought(m).includes("trench_dog") && typeof DOG_TRAINING !== "undefined" ? m.dog : null;
    if ((m.ft || (dog && dog.bond)) && !e.kw.includes("FIRETEAM")) e.kw.push("FIRETEAM");
    if (dog && dog.bond) e.ab.push(["Trench Dog: " + DOG_BOND.n, DOG_BOND.x]);
    if (dog && dog.train) { const t = DOG_TRAINING.find(x => x.id === dog.train); if (t) e.ab.push(["Trench Dog: " + t.n, t.x(W)]); }
    if (X.camp && m.camp) {
      const mods = (m.camp.skills || []).map(s => ALL_SKILLS[s]).concat((m.camp.inj || []).map(t => TRAUMA_BY[t])).filter(Boolean);
      mods.forEach(s => { const md = s.mod; if (!md) return;
        if (md.r && e.r !== null) e.r = (e.r || 0) + md.r; if (md.m && e.m !== null) e.m = (e.m || 0) + md.m;
        if (md.mv) e.mv = e.mv.replace(/^(\d+)/, n => String(Math.max(0, +n + md.mv)));
        (md.kw || []).forEach(k => { if (!e.kw.includes(k)) e.kw.push(k); }); (md.dropKw || []).forEach(k => { e.kw = e.kw.filter(x => x !== k); }); });
      (m.camp.skills || []).forEach(s => { const sk = ALL_SKILLS[s]; if (sk) e.ab.push(["Skill: " + sk.n, sk.x]); });
      (m.camp.inj || []).forEach(t => { const tr = TRAUMA_BY[t]; if (tr) e.ab.push(["Injury: " + tr.n, tr.x]); });
    }
    (m.custom || []).forEach(c => { e.ab.push([(c.kind === "item" ? "Item: " : "") + c.n, c.x || ""]); (c.kw || []).forEach(k => { if (!e.kw.includes(k)) e.kw.push(k); }); });
    if (e.elite && !e.kw.includes("ELITE")) e.kw.push("ELITE");
    const its = X.items(m);
    if (its.includes("machine_armour") && parseInt(e.base) < 40) e.base = "40mm";
    if (its.includes("tank_palanquin")) e.base = "50mm";
    if (its.includes("ducal_armour")) { e.mv = '10"/Flying'; if (!e.kw.includes("FLYING")) e.kw.push("FLYING"); }
    if (its.includes("armour_fly")) { e.mv = '8"/Flying'; if (!e.kw.includes("FLYING")) e.kw.push("FLYING"); }
    if (its.includes("anfarro") && e.m !== null) e.m = (e.m || 0) + 1;
    // armour total from bought kit
    let tot = e.a || 0; const fixed = X.fixed(m);
    X.bought(m).concat([]).forEach(i => { if (fixed.includes(i)) return; const it = ITEMS[i]; if (!it || !["AR","SH"].includes(it.t)) return;
      it.k.forEach(k => { const mm = k.match(/^-(\d) INJURY MODIFIER/); if (mm) tot -= +mm[1]; }); });
    e.armTotal = Math.max(tot, -3);
    return e;
  };
  X.label = m => (m.name ? m.name + " (" + X.eff(m).name + ")" : X.eff(m).name);
  X.isRanged = i => itemCat(i) === "ranged";

  // ---- costs (warband-level pass for cold steel / first-free) ----
  X.costs = () => {
    const out = {}; const seenMelee = new Set(); let freeCrucifix = !(X.camp && W.camp.crucifixGone); let firstWarlock = true;
    const proc = { armour: X.hasSkill("armour_proc"), melee: X.hasSkill("melee_proc"), ranged: X.hasSkill("ranged_proc") };
    const yeomanRifle = {};
    W.models.forEach(m => {
      const def = X.def(m); const c = { d: 0, g: 0 };
      if (!def) { out[m.uid] = c; return; }
      if (def.merc) {
        if (def.firstDucats && firstWarlock) { c.d += def.firstDucats; firstWarlock = false; } else c.g += def.glory || 0;
      } else { c.d += def.cost || 0; c.g += def.glory || 0; }
      def.opts.forEach(o => { const ch = X.optChoice(m, def, o); c.d += ch.cost || 0; });
      def.ups.forEach(u => { if (X.hasUp(m, u.id)) { c.d += u.cost || 0; c.g += u.glory || 0; } });
      let devotees = 0;
      (m.items || []).forEach(key => {
        const e = X.entry(key); if (!e) return; const item = X.itemOf(key);
        let d = e.d, g = e.g;
        if (def.costOverride && def.costOverride[item] != null && !yeomanRifle[m.uid]) { d = def.costOverride[item]; yeomanRifle[m.uid] = true; }
        if (F.coldSteel && e.cat === "melee" && !e.foreign && !seenMelee.has(item)) { seenMelee.add(item); d = Math.ceil(d / 2); }
        if (e.firstFree && freeCrucifix) { freeCrucifix = false; d = 0; g = 0; }
        if (e.devotee) { devotees++; if (devotees === 2) { d = 0; g = 2; } }
        if (d && !key.startsWith("g:")) { const cat = e.cat;
          if ((proc.armour && ["armour","shield","equipment"].includes(cat) && e.d >= 15) || (proc.melee && cat === "melee" && e.d >= 10) || (proc.ranged && ["ranged","grenade"].includes(cat) && e.d >= 20)) d = Math.max(0, d - 5); }
        c.d += d || 0; c.g += g || 0;
      });
      if (m.dog && X.bought(m).includes("trench_dog")) c.g += (m.dog.bond ? 1 : 0) + (m.dog.train ? 1 : 0);
      out[m.uid] = c;
    });
    return out;
  };
  X.cost = m => X.costs()[m.uid] || { d: 0, g: 0 };
  X.totals = () => {
    const cs = X.costs(); const t = { d: 0, g: 0 };
    Object.values(cs).forEach(c => { t.d += c.d; t.g += c.g; });
    if (F.batteries) t.d += (W.batteries || 0) * F.batteries.cost;
    if (X.camp) (W.arsenal || []).forEach(key => { const e = X.entry(key); if (e) { t.d += e.d || 0; t.g += e.g || 0; } });
    return t;
  };

  // ---- availability of armoury entry for a model (visibility) ----
  X.onlyOk = (m, e) => {
    if (!e.only) return true; const ef = X.eff(m); const def = X.def(m); const its = X.items(m);
    const f = o => (o === "bull" && X.hasUp(m, "gargantuan") && ["ranged","melee"].includes(e.cat)) ? true : o === "ELITE" ? ef.elite :
      o[0] === "@" ? X.hasUp(m, o.slice(1)) :
      o[0] === "$" ? its.includes(o.slice(1)) :
      (o === def.id || o === def.as);
    return e.onlyAll ? e.only.every(f) : e.only.some(f);
  };
  X.allowedEntry = (m, e) => {
    const def = X.def(m); if (!def) return false; const k = def.kit; const item = e.item; const it = ITEMS[item]; if (!it) return false;
    if (W.free) return true;
    if (def.merc && !k.allowCats) return false;
    if (!X.onlyOk(m, e)) return false;
    if (F.noKeywords.some(kw => it.k.some(k => k === kw || k.includes("(" + kw + ")")))) return false;
    // bayonet lug compatibility checked in validation
    let cat = e.cat;
    let allowed = true;
    if (k.closed) {
      allowed = (k.allowCats || []).includes(cat) || (k.allowItems || []).includes(item);
      def.ups.forEach(u => { if (X.hasUp(m, u.id) && u.allow) { if ((u.allow.cats || []).includes(cat) || (u.allow.items || []).includes(item)) allowed = true; } });
      if ((k.allowItems || []).includes(item) || def.ups.some(u => X.hasUp(m, u.id) && u.allow && (u.allow.items || []).includes(item))) allowed = true;
      else if (cat === "shield" && def.ups.some(u => X.hasUp(m, u.id) && u.allow && (u.allow.items||[]).length)) allowed = false;
    }
    if (!allowed) return false;
    if ((k.deny || []).includes(cat)) return false;
    if ((k.denyItems || []).includes(item)) return false;
    if (k.only && k.only[cat] && !k.only[cat].includes(item)) return false;
    if (k.heavyWeaponsOnly && ["ranged","melee"].includes(cat) && !it.k.includes("HEAVY")) return false;
    if (k.no2H && it.t === "2H") return false;
    if (k.maxItemCost != null && (e.g || (e.d || 0) > k.maxItemCost)) return false;
    if (k.rangedMaxCost != null && cat === "ranged" && (e.g || (e.d || 0) > k.rangedMaxCost)) return false;
    if (k.saint && !(cat === "melee" && ["1H","2H"].includes(it.t))) return false;
    if (k.amalgam && !["ranged","melee"].includes(cat) && item !== "trench_shield") return false;
    if (def.ups.some(u => X.hasUp(m, u.id) && u.noItems && u.noItems.includes(item))) return false;
    return true;
  };
  X.foreignAllowed = (m) => {
    const def = X.def(m); const out = [];
    (F.foreign || []).forEach(fr => out.push(fr));
    def.ups.forEach(u => { if (X.hasUp(m, u.id) && u.foreignWeapon) out.push({ fac: u.foreignWeapon, weaponsOnly: true, perModel: true, upId: u.id }); });
    (W.goetic && W.goetic[m.uid] || []).forEach(pid => { const p = GOETIC.find(x => x.id === pid); if (p && p.foreignItem) out.push({ fac: p.foreignItem, perModel: true }); });
    return out;
  };

  // ---- counts ----
  X.countType = id => W.models.filter(m => { const d = X.def(m); return d && (d.id === id); }).length;
  X.countUp = (id, excl) => W.models.filter(m => X.hasUp(m, id) && !(excl && excl.includes(X.def(m).id))).length;
  X.countItem = item => { let n = 0; W.models.forEach(m => (m.items || []).forEach(k => { if (k === item) n++; })); return n; };
  X.otherCost = (uid) => { const cs = X.costs(); let s = 0; W.models.forEach(m => { if (m.uid !== uid) s += cs[m.uid].d; }); return s; };
  X.maxFor = def => {
    let max = def.max;
    if (def.max2if1000) { const others = X.totals().d - W.models.filter(m => X.def(m) && X.def(m).id === def.id).reduce((s, m) => s + X.cost(m).d, 0); if (others >= 1000) max = 2; }

  { id: "martyr", n: "Martyrdom Dog", ok: W => W.fac === "tp", req: "Trench Pilgrims only",
    x: () => "Carries a Martyrdom Device and can set it off the way an Ecclesiastic Prisoner does." },
  { id: "mercy", n: "Mercy Dog", ok: W => W.fac === "na", req: "New Antioch only",
    x: () => "Has and can use a Medi-kit. Starting in contact with a Down friend more than 1\" from enemies, it can drag that friend along at half Movement (not when charging or retreating)." }
];

</script>

<script>
// ================= APP =================
const BOOK_RULES = {named:{},itemRules:{},goetic:{},modelEntries:{},keywordRules:{}};
BOOK_RULES.goetic = {"Burning Inferno":"Burning Inferno | 15 👑 | Spell (Cost 1-3) | Sorcerers only The Sorcerer opens a portal to the Lake of Fire, drawing forth a great screaming ball of Infernal lava mixed with damned souls. You must take a Cast Spell ACTION with the spellcaster in order for it to cast this spell. If you do so, the spellcaster can make a Ranged Attack with a Range of 36” . The attack has the BLAST, FIRE and SCATTER Keywords, and a blast radius in inches equal to the number of BLOOD MARKERS that were paid to cast the spell. In addition, if the Success Roll for a Ranged Attack with a Burning Inferno that targets an enemy model is a Success or a Critical Success, or if the attack is a Failure and the target point scatters onto a model's base, apply the effect of the IGNORE ARMOUR Keyword to the Injury Roll for that model.","Slavemaster":"Slavemaster | 10 👑 | Spell (Cost 1) | ELITE only Yoke Fiends are held in total thrall by the mightier members of the Court. You must take a Cast Spell ACTION with the spellcaster in order for it to cast this spell. If you do so, you can carry out one of the following Commands with a Y oke Fiend that is within 18” of the spellcaster. Carrying out a Command does not stop the Y oke Fiend from being Activated in the same Turn (before or after the Command was issued). Sacrifice Command: The Y oke Fiend kills itself. It is taken Out of Action and crossed off its Warband Roster. Fight Command: The Y oke Fiend carries out a Melee Attack. Move Command: The Y oke Fiend carries out a Move (it cannot Charge or Retreat). Shoot Command: The Y oke Fiend carries out a Ranged Attack.","Blind Rage":"Blind Rage | 10 👑 | Ability | ELITE only, Limit: 3 With alacrity borne out of sheer rage, this creature can move at a startling speed. Add +1 DICE to the Risky Success Roll for a model with this Goetic Ability that is taking a Dash ACTION.","Charge of Hatred":"Charge of Hatred | 10 👑 | Ability | ELITE only, Limit: 3 There is virtually no escape from the hatred of this creature. When a model with this Goetic Ability makes a Charge it counts as having Movement Characteristic of 12” . Do not roll a D6 to determine its Charge Bonus, but in all other regards carry out the Charge normally (i.e. Difficult terrain will slow the model down, it will have to Jump across gaps, and so on). In addition, unless the target of the charge is the closest enemy model in Line of Sight, you must take a Risky Success Roll for the model before making the charge move. If the roll is a Failure, the model cannot move and its Activation ends. If the roll is a Success, it can carry out the Charge normally.","Lesser Mark of Cain":"Lesser Mark of Cain | 20 👑 | Ability | ELITE only, Limit: 1 An inferior copy of the mark that the God-Tyrant YHWH placed on the forehead of Cain, the First Murderer. A model with this Goetic Ability has the -1 INJURY DICE Keyword. VP","Coveted Position":"Coveted Position | 10 👑 | Spell (Cost 2) | Praetors & Sorcerers only The burning jealousy and envy of those in better position in life allows the caster of this spell to instantly change places with whomever they envy. You must take a Cast Spell ACTION with the spellcaster in order for it to cast this spell. If you do so, pick a model (friend or foe) that is within 12” of the spellcaster, in its Line of Sight, and is more than 1” away from any other models. You can then swap the position of the two models. You must redeploy each model so that the centre of their base is at the location that was previously occupied by the centre of the base of the model they are swapping positions with. If this is impossible for any reason (e.g. because Impassable terrain or another model gets in the way), the two models remain in their original locations. Note that the spellcaster can cast this spell even if they are within 1” of an enemy model (in which case the enemy model cannot make a Melee Attack before the spellcaster's position is swapped), and can redeploy within 1” of an enemy model","Envious Eyes":"Envious Eyes | 5 👑 | Ability | Praetors & Sorcerers only So great is the envy of this creature, it can manifest the object of its desire in physical form. You can purchase 1 piece of Battlekit from the New Antioch, Trench Pilgrims, or Iron Sultanate Armouries for a model with this Goetic Ability. Any stipulations that apply to it must still be followed (so there is little point in taking the Assassin’s Dagger, for example, as it can only be used by Assassins). This piece of Battlekit cannot be sold or reallocated in the Quartermaster Step, and you can repurchase the Battlekit later during the campaign if it is lost for any other reason.","What is Yours is Mine":"What is Yours is Mine | 10 👑 | Spell (Cost 1) | ELITE only The caster of this spell cannot bear another to possess that which it lacks, and bends reality to its will to sate its jealousy. You must take a Cast Spell ACTION with the spellcaster in order for it to cast this spell. If you do so, you can remove 1 BLOOD MARKER or BLESSING MARKER from a model in the spellcaster’s Line of Sight (friend or foe) and place it next to the spellcaster. VP","Call of the Flesh":"Call of the Flesh | 15 👑 | Spell (Cost 2) | Praetors & Sorcerers only None can resist the call of Lust. You must take a Cast Spell ACTION with the spellcaster in order for it to cast this spell. If you do so, the spellcaster’s Activation immediately ends and the first ACTION taken by the next model your opponent Activates must be a Move, Charge or Retreat. If the enemy model is Down, it will stand up before taking the ACTION; if it cannot stand up for any reason, the spell has no effect on it. In addition, when your opponent moves the model, it must end the move as close to the spellcaster as possible, taking a Retreat ACTION if it Activates within 1” of an enemy model, and taking a Charge ACTION if it Activates within 12” of the spellcaster. If the model must move through Dangerous terrain, or Climb, Jump, or Jump Down, to get as close to the spellcaster as possible, then it must do so. After taking the Move, Charge or Retreat ACTION the model can carry out other ACTIONS normally, with the exception that it cannot choose the spellcaster as the target for a Ranged or Melee attack for the rest of the Turn.","Exquisite Pain":"Exquisite Pain | 15 👑 | Spell (Cost 1-2) | ELITE only Pain and pleasure are but two sides of the same coin. This is the wisdom of the Sin of Lust. You must take a Cast Spell ACTION with the spellcaster in order for it to cast this spell. If you do so, pick a model that is in the spellcaster’s Line of Sight (friend or foe). Place the BLOOD MARKERS paid to cast the spell next to the model that you picked.","Forbidden Pleasures":"Forbidden Pleasures | 10 👑 | Ability | Praetors & Sorcerers only The unspeakable things done to the poor slave of the fiend are best left unsaid. You can use this Goetic Ability at the start of each game, before deployment. For each model in your Warband that has this Goetic Ability, you can pick a model from your Warband that does not have the DEMONIC Keyword. Place 3 BLOOD MARKERS next to each model that you pick. VP","Light of Samael":"Light of Samael | 15 👑 | Spell (Cost 2) | Praetors & Sorcerers only The Angel Samael fell from splendour and glory, and now his divine light burns all in its path. You must take a Cast Spell ACTION with the spellcaster in order for it to cast this spell. If you do so, pick an enemy model that is within 24” of the spellcaster and in their Line of Sight, and then make an Injury Roll for the enemy model. If the enemy model is mounted on a base of 32mm or less, it is driven back D6” in a straight line directly away from the spellcaster. The model stops if it is driven into another model, Impassable terrain or terrain it cannot cross without having to Climb.","Proud Defiance":"Proud Defiance | 15 👑 | Ability | ELITE only Retreat would mean submitting to others, an unthinkable act. You do not have to take Morale Checks if your Warband has at least 1 model with this Goetic Ability on the battlefield.","Too Proud to Fall":"T oo Proud to Fall | 10 👑 | Spell (Cost 2) | Praetors & Sorcerers only The pride of this creature matches Morningstar himself. It will never kneel down willingly. You can cast this spell immediately after the spellcaster is taken Down. If you do so, the spellcaster ignores the Down result and remains standing, but will still suffer any other effects of the Injury Roll or rule that caused them to be taken Down. For example, BLOOD MARKERS from an Injury Roll must be placed next to the model as normal, and if the TOUGH Keyword was used then it cannot be used again during the game, and so on. VP","Charm of Acedia":"Charm of Acedia | 15 👑 | Spell (Cost 1) | ELITE only Not even trying is the surest way to succeed. You must take a Cast Spell ACTION with the spellcaster in order for it to cast this spell. If you do so, if the next ACTION the spellcaster takes as part of this Activation requires one or more Success Rolls or Risky Success Rolls for any part of it, the first roll is automatically a Success (do not roll any dice).","Daemonium Meridianum":"Daemonium Meridianum | 20 👑 | Ability | ELITE only, Limit: 1 It is impossible to approach this infernal warrior with any energy or enthusiasm. Enemy models treat Open or Dangerous terrain within 6” of a model with this Goetic Ability as if it had the DIFFICUL T TERRAIN Keyword.","Morphean Mind":"Morphean Mind | 15 👑 | Ability | ELITE only, Limit: 2 The mind of this demonic creature warps the flow of time so it may take as long as it wishes to decide on its actions. The opposing player cannot spend more than 1 BLOOD MARKER to add -1 DICE when you take a Success Roll for a model with this Goetic Ability. VP","Belly of the Beast":"Belly of the Beast | 5 👑 | Ability | ELITE only This creature is known to feast on vast mounds of flesh before it leaves Hell. If it is wounded in battle, its opponents suffer agonizing acidic burns as the contents of its gut gush all over them. After making a Melee Attack that targets a model with this Goetic Ability, place 1 BLOOD MARKER next to the attacking model as long as at least 1 BLOOD MARKER was placed next to the model with this Goetic Ability as a result of the attack.","Eater of the Flesh":"Eater of the Flesh | 10 👑 | Ability | Praetors & Sorcerers only, Limit: 1 An unnatural hunger for flesh haunts this creature. Whenever mortal blood is spilled, this demonic entity feeds through tears in reality, gorging itself on viscera and guts. After making a Melee Attack for a model with this Goetic Ability, remove 1 BLOOD MARKER from the model for each BLOOD MARKER that is placed next to the target model as a result of the attack. This Goetic Ability does not affect attacks that target an enemy model with the BLACK GRAIL or DEMONIC Keywords.","Uncaring Gluttony":"Uncaring Gluttony | 10 👑 | Spell (Cost 2) | ELITE only, Limit: 1 This curse drives its target mad with an unnatural hunger, making them heedless of any danger as they seek to consume any matter they now perceive as edible. You must take a Cast Spell ACTION with the spellcaster in order for it to cast this spell. If you do so, pick 1 enemy model that has not yet been Activated this Turn, and pick one piece of Equipment that the model has (note its T ype must be Equipment, not Weapon or Special and so on). Equipment that has the CONSUMABLE Keyword cannot be picked as it has already been consumed, and Equipment that has the DEPLOYABLE Keyword cannot be picked if it is more than 1” away from the model. The model chews on the Equipment, rendering it unusable for the rest of the game. VP","Black Heart":"Black Heart | 5 👑 | Spell (Cost 1) | ELITE only, Limit: 2 Greed has corrupted the heart of this fallen creature to such an extent that there is a gaping hole within its chest. When it desires something it bleeds black tar that empowers this servant of avarice. You can cast this spell before taking a Success Roll or a Risky Success Roll for the spellcaster. If you do so, add +1 DICE to the roll.","Body of Gold":"Body of Gold | 15 👑 | Ability | ELITE only, Limit: 1 So great is the devotion of this servant of Greed that their entire body takes on the aspect of the precious metal. A model with this Goetic Ability has the GOLEM Keyword. In addition, this model loses the TOUGH Keyword if it has it, and it cannot gain the TOUGH Keyword through any other means.","Greedy Hearts":"Greedy Hearts | 15 👑 | Ability | ELITE only, Limit: 1 One cannot serve both Mammon and God. Extravagant displays of wealth by your enemies only strengthen the servants of Greed. At the start of each game, after both sides have deployed, place 1 BLESSING MARKER next to a model with this Goetic Ability for each enemy model that is worth a total of 150 👑 o r more (including the cost of their Battlekit, etc). VP"};
Object.assign(BOOK_RULES.itemRules, {
  heavy_shotgun: "Tungsten-orichalcum Alloy Shot: Add +1 INJURY DICE to rolls for Ranged Attacks made by this Weapon at Short Range.",
  medikit: "Treat ACTION: A model with this item can take a Treat ACTION. If it does so, take a Risky Success Roll for the model. If the roll is a Failure, the model's Activation ends immediately. If it is a Success or Critical Success, either remove 1 BLOOD MARKER from the model or a friendly model within 1\" of it, or stand up a friendly model that is Down and within 1\" of it.",
  alch_ammo: "Guiding Path: Alchemical Ammunition can only be used with an Alaybozan, Halberd-Gun, Jezzail or Siege Jezzail (even though the Alaybozan has the SHRAPNEL Keyword). In a campaign, you cannot reallocate Alchemical Ammunition to another model.",
  anqa_guard: "An Anqa Guard is represented by an Impassable terrain piece about 1/2\" high on a 40mm base. Pre-battle Deployment: After you deploy a model with an Anqa Guard, you can also deploy the Guard anywhere wholly within your deployment zone. Once deployed, the model is not considered to be carrying it for the rest of the game. Combat Deployment ACTION: A model carrying an Anqa Guard can take this ACTION and make a Risky Success Roll with +2 DICE. On a Failure, nothing happens and its Activation ends. On a Success or Critical Success, deploy the Guard within 1\" of the model; it is no longer considered to be carrying it.",
  trench_dog: "A Trench Dog is represented by a model on a 25mm base. Loyal Hound: When you give a Trench Dog to a model, you can give both the model and the dog the FIRETEAM Keyword for +1 Glory. The Dogs of War: After deploying the owner, deploy its Trench Dog. Treat the dog as a model in the warband, except it does not count for Morale Checks. If taken Out of Action, roll for survival as for a Troops model; it cannot be Promoted. Special Training: For +1 Glory, give the dog one of the following. Guard Dog (not Black Grail or The Court): models cannot use INFILTRATOR to deploy within 12\" of an enemy Guard Dog. Hellhound (Fallen only): gains NEGATE FIRE; its attacks gain +1 DICE and GAS in Black Grail or Knights of Avarice, or +1 DICE and FIRE in any other warband. Martyrdom Dog (Trench Pilgrims only): has a Martyrdom Device and can trigger it like an Ecclesiastic Prisoner. Mercy Dog (New Antioch only): has and can use a Medi-kit; when it moves after starting in contact with a friendly Down model more than 1\" from enemies, it can drag that model while halving its Movement, but not while retreating or charging. Dog profile: Movement 8\"/Infantry, Ranged -, Melee +0 DICE, Armour 0, Base 25mm; no Battlekit. Four Paws gives +1 DICE to Risky Success Rolls to Climb, Jump or Dash. Pack Loyalty gives it its owner's Faction Keyword. Teeth and Claws lets it make a Melee Attack without a Melee Weapon."
});
BOOK_RULES.keywordRules = {"+/- DICE":"+/- DICE (Effect): Dice that are added to Success Rolls (▶ see Success Rolls). If the Keyword applies to a Weapon, the dice are only added to Success Rolls for Attacks made with it.","+/- INJURY DICE":"+/- INJURY DICE (Effect): Dice that are added to Injury Rolls (▶ see Injury Rolls). If the Keyword applies to a Weapon, the dice are only added to Injury Rolls for Attacks made with it.","+/- INJURY MODIFIER":"+/- INJURY MODIFIER (Effect): Modifiers that are applied to the result of an Injury Roll (▶ see Injury Rolls). If the Keyword applies to a Weapon, the modifier is only added to Injury Rolls for Attacks made with it.","ACTION":"ACTION (Tag): An activity a model can carry out when it is Activated. Common ACTIONS include Move, Dash, Shoot and Fight.","AMMUNITION":"AMMUNITION (KEYWORD) (Effect): If a model has a piece of Battlekit with this Keyword, it will use it in the next game that it takes part in. When the model is deployed, say which Ranged Weapon the Battlekit will be used for. It gains the (KEYWORD) until the end of the game. The Ranged Weapon you choose cannot already have the BLAST, FIRE, GAS, or SHRAPNEL Keywords, and cannot have more than one type of AMMUNITION.","ARMOUR PIERCING":"ARMOUR PIERCING (Effect): A Weapon with this Keyword reduces the target’s total -INJURY MODIFIER from its Armour Characteristic, and/or any Armour or Shields it has by 1, to a minimum of 0. For example, if a target had Standard Armour and a Trench Shield, the -INJURY MODIFIER would be lowered from -2 to -1.","ARTIFICIAL":"ARTIFICIAL (Tag): This model is not of natural biological origin but is instead constructed from non-organic elements.","ASSAULT":"ASSAUL T (Effect): Ranged Attacks made with Weapons that have this Keyword do not prevent a model from taking a Charge or Fight ACTION during the same Activation. Introduction The World in Flames Core Rules Comprehensive Rules Keywords T errain Battlekit Campaign Rules Scenarios 53 Keyword-Trench Crusade","AUTOMATIC":"AUTOMATIC (X) (Effect): When you take a Shoot ACTION and choose a Weapon with this Keyword to make a Ranged Attack, you can make a number of Ranged Attacks with this Weapon equal to X, one after another. The attacks can target different enemy models if desired, as long as they are all within 6” of each other. Resolve each attack one at a time using steps 2 to 6 of the Ranged Attack Sequence. Any BLOOD MARKERS or BLESSING MARKERS that are spent only modify the Injury Roll for the Ranged Attack they are spent on.","BLACK GRAIL":"BLACK GRAIL (Tag): This model is part of the Cult of the Black Grail Faction.","BLAST":"BLAST (X”) (Effect): A Ranged Weapon with BLAST (X”) has a blast radius in inches equal to X (including vertically). When you make an attack with the Weapon, you must pick a target for the attack. The target can either be an enemy model or a visible point on the battlefield or on a terrain piece; whichever you choose must be within the attacking model’s Line of Sight and the Weapon’s range. If the Success Roll for the attack is a Failure, the attack misses and nothing happens unless the weapon also has the SCATTER Keyword (▶ see SCATTER). If the Success Roll for the attack is a Success or Critical Success, every model that has a Line of Sight to the target of the attack and which is within the Weapon’s blast radius is hit. In addition, friendly models that are within 1” of an enemy model that was hit by the blast radius are also hit. Measure the blast radius from the centre of the target model’s base, or the centre of the visible point you picked, to the closest point on the other model’s base. Make an Injury Roll for every model that was hit. If you roll a Critical Success, only add the extra INJURY DICE to the roll for a model if it was chosen as the target of the attack.","BLESSED":"BLESSED (X) (Effect): When you deploy a model with this Keyword for the first time in a game, place a number of BLESSING MARKERS beside the model equal to X.","BLESSING MARKER":"BLESSING MARKER (Tag): The model is under the influence of a supernatural or chemical enhancement that provides temporary benefits. (▶ see BLESSING MARKERS).","BLOCK":"BLOCK (Effect): Add -1 DICE for Melee Attacks targeting a model with this Keyword, or that has a Weapon that has this Keyword, if the attacker made a Charge ACTION before making the attack this Turn.","BLOOD MARKER":"BLOOD MARKER (Tag): BLOOD MARKERS are placed on models that suffer an injury. (▶ see BLOOD MARKERS).","CLEAVE":"CLEAVE (X) (Effect): When you take a Fight ACTION and choose a Weapon with this Keyword to make a Melee Attack, you can make a number of Melee Attacks with this Weapon equal to X, one after another. The attacks can target different enemy models if desired. Resolve each attack one at a time using steps 2 to 4 of the Melee Attack Sequence. Any BLOOD MARKERS or BLESSING MARKERS that are spent only modify the Injury Roll for the Melee Attack they are spent on.","CONSUMABLE":"CONSUMABLE (Effect): In a campaign (▶ see Campaign Rules) Battlekit with this Keyword is lost at the end of a game in which it is used. Introduction The World in Flames Core Rules Comprehensive Rules Keywords T errain Battlekit Campaign Rules Scenarios 54 Keyword-Trench Crusade","COVER":"COVER (Effect): A model with this Keyword has the Cover or Defended Obstacle attack modifiers (▶ see Cover).","CRITICAL":"CRITICAL (Effect): Add +2 INJURY DICE instead of +1 INJURY DICE when a Critical Success is rolled for an attack made by a Weapon with this Keyword.","CUMBERSOME":"CUMBERSOME (Effect): Weapons with this Keyword require two hands to use, even if the model has the STRONG Keyword. However, they can still be used alongside a Shield with the Shield Combo stipulation.","DANGEROUS TERRAIN":"DANGEROUS TERRAIN (Effect): If you Activate a model that is in terrain with this Keyword, or if you move a model into terrain with this Keyword during a move, you must take a Risky Success Roll for the model. If the roll is a Success or Critical Success, you can carry on with the model's move, and you do not have to take any more Risky Success Rolls for the model if it moves into any more terrain with this Keyword as part of that move. If the roll is a Failure, you must make an Injury Roll for the model and its Activation ends. Sometimes DANGEROUS TERRAIN will have one or more Keywords in brackets directly after it. Any Injury Rolls caused by the DANGEROUS TERRAIN rule have those Keywords. For example, if a terrain piece had the DANGEROUS TERRAIN (FIRE) Keywords, then any Injury Rolls caused by it would count as having the FIRE Keyword.","DEADLY":"DEADLY (Effect): When you make an Injury Roll for an attack made with a weapon with this Keyword, roll 3D6 and add all 3 dice together. Any +INJURY DICE or -INJURY DICE are added to the roll normally, except that you pick the 3 highest or lowest dice in the roll instead of the 2 highest or lowest.","DEMONIC":"DEMONIC (Effect): A model with this Keyword has the NEGATE FIRE Keyword.","DEPLOYABLE":"DEPLOYABLE (Tag): Battlekit that is represented by a model or terrain piece that can be set up during the game.","DIFFICULT TERRAIN":"DIFFICUL T TERRAIN (Effect): Every 1” a model is moved across terrain with this Keyword counts as 2” .","ELITE":"ELITE (Tag): The most senior and heroic models in a Warband.","FEAR":"FEAR (Effect): Add -1 DICE to a Melee Attack that targets a model with this Keyword. Models that cause FEAR are immune to FEAR themselves.","FIRE":"FIRE (Effect): After making the Injury Roll for a Weapon with this Keyword, place 1 extra BLOOD MARKER next to the target model even if the result is No Effect.","FIRETEAM":"FIRETEAM (Effect): A model with this Keyword is part of a group of 2 models, both of which must have the FIRETEAM Keyword. You can create Fireteams when you recruit a Warband, and in the Quartermaster Step. Record which models are in Fireteams in your Warband on your Warband Roster. You can Activate friendly models that are part of the same Fireteam simultaneously. If you do so, you can take their ACTIONS in any order you wish, and you can switch between the two models freely. However, if the Activation of either member of the Fireteam ends during a simultaneous Activation, it immediately ends for the other model too. A model cannot be in more than 1 Fireteam. Introduction The World in Flames Core Rules Comprehensive Rules Keywords T errain Battlekit Campaign Rules Scenarios 55 Keyword-Trench Crusade","FLAMETHROWER":"FLAMETHROWER (Effect): When a Weapon with this Keyword is used to make a Ranged Attack it is automatically a Success. Do not make a Success Roll for the attack. Note that this means that the attack cannot achieve a Critical Success.","FLYING":"FLYING (Effect): When you make a move, retreat move or charge move with a model with this Keyword, you can measure the path on which it travels ‘through the air’ . It must end the move on the battlefield or on a terrain piece. You must still take a Risky Success Roll for the model if it is Activated or ends its move on Dangerous terrain, and it cannot end its move on Impassable terrain. In addition do not make an Injury Roll if a model with this Keyword Falls.","GAS":"GAS (Effect): After making the Injury Roll for a Weapon with this Keyword, place 1 extra BLOOD MARKER next to the target model even if the result is No Effect.","GOLEM":"GOLEM (Effect): A model with this Keyword treats an Out of Action result from the Injury Roll Table as a Down result unless the result was caused by a Bloodbath Roll. In addition, you cannot remove BLOOD MARKERS from a friendly model with this Keyword (the opposing player can use them normally). Finally, a model with this Keyword has the NEGATE FEAR and NEGATE GAS Keywords, but cannot have the TOUGH Keyword.","HEAVY":"HEAVY (Effect): A model cannot be equipped with more than one piece of Battlekit with this Keyword and it does not receive a Charge Bonus when it makes a charge move. In addition, if a Ranged Weapon or Grenade has this Keyword, you cannot use the Weapon or Grenade to make a Ranged Attack and take a Move, Charge or Retreat, or Dash ACTION with the attacking model as part of the same Activation.","HELD":"HELD (Effect): A piece of Battlekit with this Keyword requires one hand to carry and cannot be put down. Because of this, a model that has this Keyword can only be equipped with or use either a 1-Handed Weapon or a Shield. It cannot be equipped with or use any 2-Handed Weapons, or both a Weapon and a Shield (even if the Shield has the Shield Combo rule). It may still carry Grenades.","HERETIC":"HERETIC (Tag): The model is a member of the Heretic Legions Faction.","IGNORE ARMOUR":"IGNORE ARMOUR (Effect): Ignore -INJURY DICE and -INJURY MODIFIERS for a target’s Armour Characteristic, and for any Armour or Shield pieces of Battlekit that it has, for attacks that have this Keyword.","IGNORE":"IGNORE [MODIFIER] (Effect): Ignore the Success Roll or Injury Roll modifier that is specified. For example, the Success Roll for an attack made with a Ranged Weapon that had the IGNORE COVER Keyword would not be affected by the -1 DICE modifier for a target that is in Cover.","IMPASSABLE TERRAIN":"IMPASSABLE TERRAIN (Effect): Models cannot be moved onto or across terrain with this Keyword.","IMPERVIOUS":"IMPERVIOUS (Effect): The ARMOUR PIERCING and IGNORE ARMOUR Effects do not affect any -INJURY DICE and -INJURY MODIFIERS that apply to Battlekit that has this Keyword. Any other Battlekit the target model has is affected normally. Introduction The World in Flames Core Rules Comprehensive Rules Keywords T errain Battlekit Campaign Rules Scenarios 56 Keyword-Trench Crusade","INFECTION MARKERS":"INFECTION MARKERS (Tag): The model is under the influence of a supernatural or chemical malady that provides temporary effects. (▶ see Infection Markers in Warbands of Trench Crusade).","INFILTRATOR":"INFIL TRATOR (Effect): When a model with this Keyword is deployed for the first time in a game, it can be set up anywhere on the battlefield as long as it is out of the Line of Sight of all enemies and is at least 8” away from the closest enemy. INFIL TRATORS are deployed after models that do not have this Keyword. Any INFIL TRATORS that cannot be deployed in this way are instead deployed normally in their deployment zone.","MINED":"MINED (Effect): When a model moves into contact with a Marker or terrain piece with the MINED Keyword, the mine will detonate unless the model has the NEGATE MINED Keyword. Make an Injury Roll with the SHRAPNEL Keyword for the model that detonated the mine, and then the Marker or terrain piece loses the MINED Keyword. If the model that detonated the mine wasn't taken Down or Out of Action, it can then continue its move. Models with the FLYING Keyword only detonate a mine if they finish a move in contact with a MINED Marker or terrain piece (they can fly across it without setting it off ).","LEADER":"LEADER (Effect): Add +1 DICE to Morale Checks if your Warband has at least 1 model with this Keyword on the battlefield that is not Down or Out of Action.","NEW ANTIOCH":"NEW ANTIOCH (Tag): This model is part of the Principality of New Antioch Faction.","NEGATE":"NEGATE [KEYWORD] (Effect): A model with the NEGATE Keyword is not affected by the specified Keyword’s Effect. For example, a model with NEGATE SHRAPNEL ignores the Effect of the SHRAPNEL Keyword.","PILGRIM":"PILGRIM (Tag): This model is part of the Trench Pilgrim Faction.","PISTOL":"PISTOL (Effect): A pistol can be used as a Melee Weapon or a Ranged Weapon, and can be used as both in the same Activation. When it is used as a Ranged Weapon it has the Range shown on its Profile and uses the attacking model’s Ranged Characteristic. When used as a Melee Weapon it can use the attacking model’s Ranged or Melee Characteristic and can be used as an Off-Hand We apon if desired.","RELOAD":"RELOAD (Effect): If a model makes an attack with a Weapon that has this Keyword then its Activation ends after the ACTION that allowed the attack is completed.","REGENERATE":"REGENERATE (X) (Effect): When you Activate a model with this Keyword, before carrying out any ACTIONS, you can remove up to X BLOOD MARKERS from the model. Introduction The World in Flames Core Rules Comprehensive Rules Keywords T errain Battlekit Campaign Rules Scenarios 57 Keyword-Trench Crusade","RISKY":"RISKY (Effect): If you must make a Success Roll for a model that is using a piece of Battlekit that has this Keyword, then the Success Roll becomes a Risky Success Roll (the model’s Activation or ACTION will end if the Risky Success Roll is a Failure). For example, the Success Roll for an attack made with a Weapon that has the RISKY Keyword would become a Risky Success Roll. This Effect is ignored if the Success Roll is already a Risky Success Roll.","SCATTER":"SCATTER (Effect): Some Weapons with the BLAST Keyword also have the SCATTER Keyword. When you make an attack with the Weapon, pick a target and carry out the attack as described in the rules for BLAST. However, if the Success Roll for the attack was a Failure, the attack will scatter instead of missing. T o see where it scatters to, subtract the Success Roll from 7. For example, if the Success Roll was 4, then the target point would scatter (7–4=) 3” . Your opponent must move the attack exactly that many inches in a direction of their choice, to a point on the battlefield, on a terrain piece, or on the base of a model. There must be Line of Sight between the point that is chosen and the original target for the attack. If this is impossible for any reason, then treat the attack as a miss. Then, determine who is hit as described in the rules for BLAST.","SHOTGUN":"SHOTGUN (Effect): Add -1 INJURY DICE to rolls for attacks made at Long Range with a Weapon that has this Keyword instead of the usual Long Range modifier (-1 DICE).","SHRAPNEL":"SHRAPNEL (Effect): After making the Injury Roll for a Weapon with this Keyword, place 1 extra BLOOD MARKER next to the target model even if the result is No Effect.","SKIRMISHER":"SKIRMISHER (Effect): If an enemy selects a model with this Keyword as the target of a Charge, you can choose to evade with your model before the Charge is made, as long as your model is not within 1” of an enemy. When a model evades, roll a D3 and move the model that many inches. It must finish this move more than 1” away from all enemy models. If this move results in there being an interposing model between the evading model and the model that is making the charge, then the charging model must choose the interposing model as the target for its charge.","STRONG":"STRONG (Effect): A model with this Keyword has the NEGATE HEAVY Keyword. In addition, it can equip and use one 2-Handed Melee Weapon as if it were a 1-Handed Melee Weapon.","SULTANATE":"SUL TANATE (Tag): This model is part of the Sultanate of the Iron W all Faction.","THE COURT":"THE COURT (Tag): This model is part of The Court of the Seven-Headed Serpent Faction.","TOUGH":"TOUGH (Effect): The first time a model with this Keyword suffers an Out of Action result on the Injury Table, it is treated as a Down result instead. Introduction The World in Flames Core Rules Comprehensive Rules Keywords T errain Battlekit Campaign Rules Scenarios 58 Terrain-Trench Crusade A Trench Crusade battlefield TRENCH CRUSADE TERRAIN Just as a real battlefield would have terrain features such as buildings, hills and forests, the battlefield for a game of Trench Crusade will need its own terrain features to provide cover for the warriors in your Warband. The terrain you place on the battlefield is made up of individual models that are called terrain pieces. The Battlefield The area on which you play your game is referred to as the battlefield. Before you can set up the terrain for your game, you will need a battlefield to place it on. Most games of Trench Crusade can be played on a dining table, but some require an area that is 36” or 48” square. If you are going to play one of these larger scenarios, you may need to make a special gaming board. For all of the other scenarios, a standard dining table will provide more than enough space for your game. Terrain Pieces In addition to the battlefield you will need as many terrain pieces as you can lay your hands on. You can purchase plastic terrain models suitable for use as terrain pieces in much the same way as you can the models that make up the warriors in your Warband. W e would recommend you use the models from the growing range of Trench Crusade terrain for your games, but we won’t mind if you decide to use another company’s kits instead of our own. Many players enjoy scratch-building the terrain pieces for their games from modelling materials like plasticard, foam board and foam card, PVA glue and modelling sand. Suffice to say that a quick search on the internet will bring up plenty of examples of terrain models that you can use, and introductory articles about how to scratch-build terrain. Battlefield Archetypes Introduction The World in Flames Core Rules Comprehensive Rules Keywords T errain Battlekit Campaign Rules Scenarios T errain Pieces Battlefield 59 Terrain-Trench Crusade An improvised battlefield Don’t worry if you are new to tabletop wargaming and have not yet had a chance to build up a large collection of terrain. Just use any terrain pieces you have available, and/or supplement them with household items that can stand-in for actual terrain pieces. For example, you could use books to represent low hills, pens to represent walls, rocks collected from your garden or a park as boulders, twigs to represent fallen trees and so on. Placing a thick blanket over some books will create a rolling landscape with hills and gullies to fight over. The important thing to appreciate is that it is absolutely okay to use whatever you have to hand in order to play a game of Trench Crusade; after all, the Lord took six days to create everything, so don’t worry if it takes a little time to create your ideal battlefield! Don’t worry, very soon your collection of terrain pieces will grow and you will be able to return your books to their shelves and your rocks and twigs to the garden (though you may well find yourself looking back very fondly on those early games and the improvised terrain that you used in order to play them). Battlefield Battlefield Archetypes Introduction The World in Flames Core Rules Comprehensive Rules Keywords T errain Battlekit Campaign Rules Scenarios T errain Pieces"};
BOOK_RULES.keywordRules.TOUGH = "TOUGH (Effect): The first time a model with this Keyword suffers an Out of Action result on the Injury Table, it is treated as a Down result instead.";
BOOK_RULES.named = {"Secrets of the House of Wisdom":"Secrets of the House of Wisdom: Each Jabirean Alchemist in a House of Wisdom Warband can have one of following abilities at the cost indicated below. You cannot give the same ability to more than one model (i.e. every Jabirean Alchemist that has an ability must have a different one).","Marksmanship of the Iron Wall":"Marksmanship of the Iron Wall: All the members of the Warband practise marksmanship from the dizzying heights of the Iron W all against targets on the ground below. Add +2 DICE instead of +1 DICE to the Success Roll for a Ranged Attack made by models in a Defenders of the Iron W all Warband when they have the Elevated Position modifier.","Followers of Saint Methodius":"Followers of Saint Methodius: The Patron of a W ar Pilgrimage of Saint Methodius Warband is always a Learned Saint.","Arise and be Healed! ACTION":"Arise and be Healed! ACTION: A Papal States Intervention Force Trench Cleric can take an Arise and be Healed! ACTION. If they do so, take a Risky Success Roll for the Trench Cleric. If the roll is a Failure, nothing happens, and the Trench Cleric’s Activation ends. If the roll is a Success or Critical Success, pick the Trench Cleric or 1 friendly model within 3” of the Trench Cleric. The model you pick can stand back up at no cost to their movement, and you can remove up to D3 BLOOD MARKERS and/or INFECTION MARKERS from the model.","Ammunition Sacrament ACTION":"Ammunition Sacrament ACTION: A Mendelist Ammo Monk can take an Ammunition Sacrament ACTION. If they do so, take a Risky Success Roll for the Mendelist Ammo Monk. If the roll is a Failure, the Mendelist Ammo Monk’s Activation ends. If the roll is a Success or a Critical Success, pick 1 friendly model within 1” of the Mendelist Ammo Monk and in their Line of Sight, and then pick one of the following Ammunition Sacraments. The Sacrament you pick applies to the model until the end of its next Activation. Bullet of the Guided Path Sacrament: Add +1 DICE to rolls for Ranged Attacks made by the model. Cartridge of his W rath Sacrament: Add the BLAST 2” and SHRAPNEL Keywords to Ranged Weapons used by the model that do not have the BLAST or FLAMETHROWER Keywords. Echo of his W ord Sacrament: Add +1 INJURY DICE to rolls for Ranged Attacks made by the model.","Onward Christian Soldiers!":"Onward Christian Soldiers!: Friendly NEW ANTIOCH models within 8” of a Trench Cleric have the NEGATE FEAR Keyword. Keywords NEW ANTIOCH, ELITE, NEGATE FEAR","Followers of Saint Patrick":"Followers of Saint Patrick: The Patron of an Éire Rangers Warband is always a Learned Saint.","Laying on of Hands ACTION":"Laying on of Hands ACTION: A W ar Prophet can take a Laying on of Hands ACTION. If they do so, take a Success Roll for the model. If the roll is a Failure, nothing happens. If the roll is a Success, remove 1 BLOOD MARKER from a friendly model within 6” of the W ar Prophet. If the roll is a Critical Success, remove 3 BLOOD MARKERS from a friendly model within 6” of the W ar Prophet instead of only 1. The W ar Prophet can use this ACTION to heal themselves.","Enforced Orthodoxy ACTION":"Enforced Orthodoxy ACTION: A Castigator can take an Enforced Orthodoxy ACTION. If they do so, take a Risky Success Roll for the model and add +1 DICE to the roll. If the roll is a Failure, the Castigator’s Activation ends immediately. If the roll is a Success or Critical Success, all friendly models that are within 8” of the Castigator that are Down immediately stand back up at no cost to their movement.","Vengeful Scripture ACTION":"Vengeful Scripture ACTION: The Scripture Guardian reads words from the holy (or unholy) text it carries. A Scripture Guardian can take a Vengeful Scripture ACTION. If they do so, pick 1 enemy model within 18” of the Scripture Guardian and in its Line of Sight. Then take a Success Roll for the Scripture Guardian, with +2 DICE if the enemy model is within 9” of the Scripture Guardian and +1 DICE otherwise. If the roll is a Failure, nothing happens. If the roll is a Success, make an Injury Roll for the enemy model, with a +1 INJURY MODIFIER for each BLOOD MARKER the enemy model has (in addition to any benefits you receive if you then spend them to affect the Injury Roll). If the roll is a Critical Success, make an Injury Roll for the enemy model with IGNORE ARMOUR, and +1 INJURY DICE and a +1 INJURY MODIFIER for each BLOOD MARKER the enemy model has. Keywords GOLEM Mercenary Special Rules Starting a Warband New Antioch Trench Pilgrims Iron Sultanate Heretic Legions Black Grail The Court Keywords Mercenaries 183 0-1 Sin Eater - Cost: 6 ☼ A Sin Eater is Fallen and can be recruited as a Mercenary by Fallen Warbands. Sin Eaters were once mortal men and women, but their overwhelming greed, combined with the corrupting influence of the Hellgate, turned them into an abominable form that matches their inner foulness. Sin Eaters are among the few creatures outside Beelzebub’s followers that he deems worthy as their boundless gluttony mirrors his essence. Movement Ranged Melee Armour Base 6”/Infantry - +2 DICE -2 50mm Battlekit Sin Eater always has Reinforced Armour, a Combat Helmet, and a T enderiser Maul (▶S e e Tenderiser Maul). Abilities","Weapons of Mobile Warfare":"Weapons of Mobile Warfare: An Expeditionary Forces of Abyssinia Warband can have a maximum of 3 Ranged Weapons with the HEAVY Keyword, not counting Satchel Charges.","Far from the Sublime Gate":"Far from the Sublime Gate: A Defenders of the Iron W all Warband cannot include any Lions of Jabir, Y üzbaşı or Assassins, and models in the Warband cannot have a Cloak of Alamut or Wind Amulet.","Short-Range Marksmanship":"Short-Range Marksmanship: Add +1 DICE to the Success Rolls for Ranged Attacks made at Short Range by the Lieutenant and any Y eomen in an Expeditionary Forces of Abyssinia Warband, unless the attacking Weapon is a Grenade or has the HEAVY Keyword.","Day of His Wrath ACTION":"Day of His Wrath ACTION: A
